<!DOCTYPE html> <!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN"> <!-- 根元素，页面语言为简体中文 -->
<head> <!-- 文档头：放元信息和样式 -->
<meta charset="UTF-8"> <!-- 字符编码使用 UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"> <!-- 视口：宽度等于设备宽度，禁止缩放，内容延伸到刘海和圆角区域 -->
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)"> <!-- 浅色模式下浏览器状态栏的颜色 -->
<meta name="theme-color" content="#07081a" media="(prefers-color-scheme: dark)"> <!-- 深色模式下浏览器状态栏的颜色 -->
<title>双色球 / 大乐透 随机选号</title> <!-- 页面标题 -->
<style> /* 页面样式开始 */
:root { /* 全局变量（浅色模式的默认值） */
  /* 浅色、深色跟随系统切换 */
  color-scheme: light dark; /* 让浏览器自带控件也跟随系统深浅模式 */
  --bg-page:#eef2ff; /* 页面加载前和背景画布出现前的底色 */
  --bg-canvas:linear-gradient(180deg,#f7f3ff 0%,#eef2ff 100%); /* 页面底层的渐变底色 */
  --text-main:#111827; /* 主要文字颜色 */
  --text-sub:rgba(17,24,39,.78); /* 次要文字颜色（半透明）：分段控件未选中的选项，在彩色液体上也要看得清 */
  --primary:#4f46e5; /* 主题色：焦点框等 */
  /* 号码球：高光、主色、暗部（页面和导出图片共用） */
  --red-hi:#ff8a8a; /* 红球高光色 */
  --red:#ef4444; /* 红球主色 */
  --red-lo:#d22f2f; /* 红球暗部色 */
  --blue-hi:#8ab8ff; /* 蓝球高光色 */
  --blue:#3b82f6; /* 蓝球主色 */
  --blue-lo:#2563d9; /* 蓝球暗部色 */
  /* 液态背景：六种液体颜色 */
  --liquid-1:#5b8cff; /* 液体颜色 1：蓝 */
  --liquid-2:#a35bff; /* 液体颜色 2：紫 */
  --liquid-3:#ff6fb1; /* 液体颜色 3：粉 */
  --liquid-4:#ff9f45; /* 液体颜色 4：橙 */
  --liquid-5:#3fd0c9; /* 液体颜色 5：青 */
  --liquid-6:#7b6cff; /* 液体颜色 6：靛 */
  /* 整屏液体的调色：颜色倍率 混白比例 */
  --liquid-tone:1 .12; /* 浅色：颜色倍率 1，混入 12% 白色：柔和但仍饱满，玻璃的折射和彩边才看得出来（混白太多整屏发粉、玻璃显得发白） */
  --title-glow:0 0 14px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.8); /* 标题外发光：白色光晕让标题在彩色液体上更清楚 */
  --label-glow:0 0 8px rgba(255,255,255,.8),0 0 2px rgba(255,255,255,.6); /* 分段控件文字的光晕：液体颜色较深时也看得清 */
  /* 液体玻璃材质（iOS 27 通透）：几乎全透，靠边缘高光、暗边和折射勾出轮廓 */
  --glass-bg:rgba(255,255,255,.03); /* 玻璃底色：3% 白，几乎全透明 */
  --glass-bg-strong:rgba(255,255,255,.55); /* 较实的玻璃底色（普通按钮用） */
  --glass-blur:blur(4px) saturate(140%) brightness(1.02); /* CSS 玻璃的背景模糊、提饱和、提亮（不用 WebGL 时） */
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%); /* 玻璃左上角的镜面反光 */
  --glass-rim:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.42) 20%,rgba(255,255,255,.22) 42%,rgba(255,255,255,.22) 62%,rgba(255,255,255,.42) 82%,rgba(255,255,255,.9)); /* 玻璃边缘高光描边的渐变：左上和右下最亮，中段保留 22% 白，右上角和左下角的描边不会断开；整体不用纯白，浅背景上不显得发白 */
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1); /* 玻璃外圈深色细边：两层 0.5px 模糊阴影叠加 */
  --glass-border:rgba(15,23,42,.16); /* 大面板的深色细边颜色（用 border 画） */
  --glass-inset: /* 玻璃内侧高光（多行取值，下面每行一层） */
    inset 0 1px 0 rgba(255,255,255,.95), /* 顶部一条 1px 白色亮线 */
    inset 2px 2px 4px rgba(255,255,255,.6), /* 左上内侧透镜光带 */
    inset -2px -2px 4px rgba(255,255,255,.4), /* 右下内侧透镜光带 */
    inset 0 0 16px rgba(255,255,255,.2); /* 内侧整圈柔光 */
  --glass-shadow: /* 小控件的完整玻璃阴影（多行取值） */
    var(--glass-edge), /* 深色细边 */
    var(--glass-inset), /* 内侧高光 */
    0 12px 32px rgba(31,41,95,.14), /* 远处柔和投影 */
    0 2px 6px rgba(31,41,95,.08); /* 近处清晰投影 */
  /* WebGL 玻璃：磨砂半径 高光 顶部反光 提亮；玻璃底色；边缘反光的取色；面板投影颜色 */
  --gl-look:2 .3 .035 1; /* 浅色：磨砂半径 2、高光 0.3、顶部反光 0.035、不提亮（提亮会让玻璃像一层乳白膜） */
  --gl-tint:rgba(20,22,40,.03); /* 浅色 WebGL 玻璃底色：3% 深蓝灰，与深色模式同一思路，玻璃略深于背景，显得通透 */
  --gl-sheen:.6; /* 浅色：边缘反光 60% 取玻璃里背景的颜色（在浅背景上纯白反光会把边缘洗成白雾） */
  --gl-shadow:rgba(40,30,90,.08); /* WebGL 画的面板投影颜色 */
  --rim-w:1.5px; /* 高光描边宽度 */
  --glow:rgba(255,255,255,.8); /* 触摸发光的颜色 */
  --tint-primary:rgba(79,70,229,.9); /* 主按钮的靛蓝底色 */
  --thumb-bg:rgba(255,255,255,.88); /* 分段控件滑块的底色 */
  --thumb-lens:rgba(255,255,255,.4); /* 按住滑块时的透镜底色（更透） */
  /* 保存弹窗：遮罩、玻璃底色、背景模糊、提示文字 */
  --overlay-bg:rgba(15,23,42,.25); /* 保存弹窗遮罩的颜色 */
  --glass-modal:rgba(255,255,255,.22); /* 保存弹窗的玻璃底色 */
  --modal-filter:blur(12px) saturate(160%) brightness(1.08); /* 保存弹窗的背景模糊、提饱和、提亮 */
  --modal-tip:rgba(17,24,39,.78); /* 弹窗提示文字颜色 */
  --modal-tip-shadow:0 1px 6px rgba(255,255,255,.7); /* 弹窗提示文字的光晕 */
  /* 导出图片：背景、画布底色、标题颜色 */
  --export-bg:linear-gradient(160deg,#ffffff 0%,#f4f2ff 55%,#eef3ff 100%); /* 导出图片的背景渐变 */
  --export-base:#f4f2ff; /* 导出图片的画布底色 */
  --export-title:#111827; /* 导出图片标题颜色 */
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --pad:10px; /* 卡片内边距 */
  --ctl-h:46px; /* 按钮、分段控件的高度 */
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad)); /* 卡片外圆角 = 控件半高 + 内边距，内外圆角同心 */
}
@media (prefers-color-scheme: dark) { /* 系统为深色模式时覆盖下面的变量 */
  :root { /* 深色模式的变量 */
    --bg-page:#0b1026; /* 深色底色 */
    --bg-canvas:linear-gradient(180deg,#07081a 0%,#0b1026 100%); /* 深色渐变底色 */
    --text-main:#f1f5f9; /* 深色模式主要文字：近白 */
    --text-sub:rgba(241,245,249,.75); /* 深色模式次要文字：在彩色液体上也要看得清 */
    --primary:#818cf8; /* 深色模式主题色：浅靛 */
    --liquid-1:#3d6bff; /* 深色液体颜色 1：蓝 */
    --liquid-2:#8b3dff; /* 深色液体颜色 2：紫 */
    --liquid-3:#ff3d8f; /* 深色液体颜色 3：玫红 */
    --liquid-4:#ff8a24; /* 深色液体颜色 4：橙 */
    --liquid-5:#1fb8b0; /* 深色液体颜色 5：青 */
    --liquid-6:#5a4dff; /* 深色液体颜色 6：靛 */
    --liquid-tone:.65 0; /* 深色：颜色乘 0.65 压暗，不混白 */
    --title-glow:0 0 14px rgba(0,0,0,.7); /* 深色标题外发光：黑色光晕 */
    --label-glow:0 0 8px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.4); /* 深色分段控件文字的光晕：黑色 */
    --glass-bg:rgba(20,22,40,.08); /* 深色玻璃底色：8% 深蓝灰 */
    --glass-bg-strong:rgba(54,60,84,.74); /* 深色较实的玻璃底色 */
    --glass-blur:blur(5px) saturate(140%); /* 深色 CSS 玻璃的模糊和提饱和 */
    --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%); /* 深色镜面反光（更弱） */
    --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.2) 20%,rgba(255,255,255,.1) 42%,rgba(255,255,255,.1) 62%,rgba(255,255,255,.18) 82%,rgba(255,255,255,.55)); /* 深色高光描边（更弱），中段保留 10% 白，描边不断开 */
    --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55); /* 深色外圈黑色细边 */
    --glass-border:rgba(0,0,0,.6); /* 深色大面板细边颜色 */
    --glass-inset: /* 深色内侧高光（多行取值） */
      inset 0 1px 0 rgba(255,255,255,.3), /* 顶部亮线（更弱） */
      inset 2px 2px 4px rgba(255,255,255,.16), /* 左上透镜光带 */
      inset -2px -2px 4px rgba(255,255,255,.08), /* 右下透镜光带 */
      inset 0 0 16px rgba(255,255,255,.05); /* 内侧柔光 */
    --glass-shadow: /* 深色小控件的玻璃阴影（多行取值） */
      var(--glass-edge), /* 深色细边 */
      var(--glass-inset), /* 内侧高光 */
      0 12px 32px rgba(0,0,0,.4), /* 远处投影（更深） */
      0 2px 6px rgba(0,0,0,.3); /* 近处投影 */
    --gl-look:2.5 .3 .04 1; /* 深色：磨砂 2.5、高光 0.3、顶部反光 0.04、不提亮 */
    --gl-tint:rgba(20,22,40,.08); /* 深色 WebGL 玻璃底色：8% 深蓝灰 */
    --gl-sheen:0; /* 深色：边缘反光用白光（暗背景上是一条清晰的亮线） */
    --gl-shadow:rgba(0,0,0,.25); /* 深色面板投影颜色 */
    --glow:rgba(255,255,255,.26); /* 深色触摸发光（更弱） */
    --tint-primary:rgba(99,102,241,.72); /* 深色主按钮底色 */
    --thumb-bg:rgba(255,255,255,.22); /* 深色滑块底色 */
    --thumb-lens:rgba(255,255,255,.1); /* 深色按住滑块时的透镜底色 */
    --overlay-bg:rgba(0,0,0,.4); /* 深色弹窗遮罩 */
    --glass-modal:rgba(20,22,40,.16); /* 深色弹窗玻璃底色 */
    --modal-filter:blur(12px) saturate(160%) brightness(1.3); /* 深色弹窗背景模糊，提亮更多 */
    --modal-tip:rgba(241,245,249,.85); /* 深色弹窗提示文字 */
    --modal-tip-shadow:0 1px 6px rgba(0,0,0,.5); /* 深色弹窗提示文字的阴影 */
    --export-bg:linear-gradient(160deg,#151b3d 0%,#0b1026 55%,#1c1033 100%); /* 深色导出图片背景渐变 */
    --export-base:#0b1026; /* 深色导出图片画布底色 */
    --export-title:#f1f5f9; /* 深色导出图片标题颜色 */
  }
}
/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) { /* 系统开启“降低透明度”时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#ffffff; /* 玻璃改为白色实底 */
    --glass-bg-strong:#ffffff; /* 较实的玻璃也改为白色实底 */
    --glass-modal:#ffffff; /* 弹窗改为白色实底 */
    --glass-blur:none; /* 不做背景模糊 */
    --glass-spec:none; /* 去掉镜面反光 */
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) { /* 降低透明度且为深色模式时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#1e2333; /* 玻璃改为深色实底 */
    --glass-bg-strong:#1e2333; /* 较实的玻璃改为深色实底 */
    --glass-modal:#1e2333; /* 弹窗改为深色实底 */
  }
}
* {box-sizing:border-box;} /* 所有元素的宽高包含内边距和边框 */
  html, /* 根元素和 */
  body { /* 页面主体的共同样式 */
  margin: 0; /* 去掉默认外边距 */
  padding: 0; /* 去掉默认内边距 */
  width: 100%; /* 宽度铺满窗口 */
  height: 100%; /* 高度铺满窗口 */
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif; /* 字体：优先苹果系统字体和苹方 */
  -webkit-font-smoothing: antialiased; /* 苹果设备上字体平滑 */
  color: var(--text-main); /* 默认文字颜色 */
  display: flex; /* 用 flex 布局 */
  align-items: center; /* 内容垂直居中 */
  justify-content: center; /* 内容水平居中 */
  overflow: hidden; /* 页面不滚动 */
  touch-action: none; /* 禁止浏览器默认的触摸手势（缩放、滚动） */
  -webkit-user-select: none; /* 禁止选中文字（Safari） */
  user-select: none; /* 禁止选中文字 */
  -webkit-touch-callout: none; /* 禁止长按弹出菜单（Safari） */
  }
  html { /* 根元素单独的样式 */
  background-color: var(--bg-page); /* 底色 */
  background-image: var(--bg-canvas); /* 渐变底色 */
  background-repeat: no-repeat; /* 渐变不重复 */
  background-size: 100% 100vh; /* 渐变高度等于视口高度（旧浏览器） */
  background-size: 100% 100lvh; /* 渐变高度等于大视口高度，盖住 iOS 工具栏区域 */
  }
  * { /* 所有元素 */
  -webkit-tap-highlight-color: transparent; /* 去掉点击时的灰色高亮 */
  }
  .container, /* 容器、 */
  .form-box, /* 表单卡片、 */
  .result-box, /* 结果卡片、 */
  .result-inner, /* 结果内容、 */
  .result-line, /* 每行号码、 */
  h1, /* 标题、 */
  button, /* 按钮、 */
  .segmented, /* 分段控件、 */
  .segmented label { /* 分段控件的选项文字： */
  touch-action: none; /* 禁止浏览器默认的触摸手势 */
  -ms-touch-action: none; /* 旧版 IE/Edge 的同一属性 */
}
.backdrop { /* 2D 兜底背景的容器 */
  position:fixed; /* 固定在视口上，不随内容移动 */
  top:0; /* 贴住顶部 */
  left:0; /* 贴住左边 */
  right:0; /* 贴住右边 */
  height:100vh; /* 高度等于视口（旧浏览器） */
  height:100lvh; /* 高度等于大视口，盖住 iOS 工具栏区域 */
  z-index:0; /* 放在内容下面 */
  overflow:hidden; /* 超出部分裁掉 */
  pointer-events:none; /* 不接收点击 */
}
.backdrop canvas { /* 兜底背景的画布 */
  display:block; /* 块级显示，去掉行内元素底部的空隙 */
  width:100%; /* 宽度铺满（低分辨率画布由浏览器放大） */
  height:100%; /* 高度铺满 */
}
/* WebGL 版：背景和玻璃面板由画布绘制，CSS 只保留边框、高光描边和触摸发光 */
.lg-canvas { /* WebGL 画布 */
  position:fixed; /* 固定在视口上 */
  top:0; /* 贴住顶部 */
  left:0; /* 贴住左边 */
  width:100%; /* 宽度铺满 */
  height:100vh; /* 高度等于视口（旧浏览器） */
  height:100lvh; /* 高度等于大视口 */
  z-index:0; /* 放在内容下面 */
  pointer-events:none; /* 不接收点击 */
}
.lg-webgl .backdrop { /* WebGL 生效时，隐藏 2D 兜底背景 */
  visibility:hidden; /* 隐藏但保留布局 */
}
.lg-webgl .glass { /* WebGL 生效时，CSS 玻璃面板 */
  background:transparent; /* 去掉 CSS 底色（由 WebGL 画） */
  -webkit-backdrop-filter:none; /* 去掉 CSS 背景模糊（Safari） */
  backdrop-filter:none; /* 去掉 CSS 背景模糊 */
  box-shadow:none; /* 去掉内侧高光（由 WebGL 画） */
}
.container { /* 页面内容容器 */
  position:relative; /* 建立定位上下文 */
  z-index:1; /* 放在背景画布上面 */
  width:100%; /* 宽度铺满 */
  max-width:480px; /* 最宽 480px */
  display:flex; /* 用 flex 布局 */
  flex-direction:column; /* 纵向排列：标题、表单、结果 */
  gap:16px; /* 各块之间的间距 */
  padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); /* 四周留白，至少 24px，并避开刘海和圆角安全区 */
}
h1 { /* 标题 */
  text-align:center; /* 文字居中 */
  font-size:1.5rem; /* 字号 1.5 倍 */
  font-weight:700; /* 粗体 */
  letter-spacing:-.01em; /* 字距稍微收紧 */
  margin:0 0 4px; /* 底部留 4px */
  /* 液体随机流过标题后面时，保证文字清楚 */
  text-shadow:var(--title-glow); /* 标题外发光 */
}
/* 液体玻璃基础材质：半透明 + 背景模糊增饱和 + 镜面高光 + 高光边缘 */
.glass { /* 玻璃面板 */
  position:relative; /* 建立定位上下文，供伪元素定位 */
  isolation:isolate; /* 新建层叠上下文，让触摸发光层留在面板内容下面 */
  background:var(--glass-spec),var(--glass-bg); /* 镜面反光叠在玻璃底色上 */

.glass::before, /* 玻璃面板、 */
button::before, /* 按钮、 */
.segmented-thumb::before, /* 分段控件滑块、 */

  right:0; /* 贴住右边 */
  bottom:0; /* 贴住底部 */
  left:0; /* 贴住左边 */

/* 触摸发光：光从手指处向外扩散，并带亮所在的玻璃面板 */
.glass::after, /* 玻璃面板、 */
button::after, /* 按钮、 */

  content:""; /* 伪元素必须有 content 才会显示 */

  top:0; /* 贴住顶部 */
  right:0; /* 贴住右边 */

.form-box { /* 表单卡片 */

.segmented { /* 分段控件（彩种切换） */

    transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,opacity .25s; /* 改用 transform 做过渡 */

@supports (translate:0) { /* 支持独立的 translate 属性时 */

@keyframes lg-morph { /* 液态拉伸动画 */

#type-dlt:checked ~ .segmented-thumb { /* 选中“大乐透”时的滑块 */

.segmented input:focus-visible ~ .segmented-thumb { /* 单选框获得键盘焦点时的滑块 */

.segmented input:disabled ~ label { /* 单选框禁用（生成中）时的选项文字 */

.button-group { /* 按钮组 */

/* 数字按字形居中：裁掉行框上下的字体留白，只留大写字母高度到基线（数字与大写字母同高），再由 flex 居中。
   不裁剪时居中的是整个行框，留白上下不对称，数字会偏上或偏下（随字体和字号变化）；不支持 text-box 的旧浏览器保持原样 */

@media (max-width:360px) { /* 屏幕宽度不超过 360px 时 */

</div> <!-- 页面内容容器结束 -->

  (function disableZoom() { // 立即执行：禁止页面缩放
  let lastTouchEnd = 0; // 上一次手指离开屏幕的时间
  document.addEventListener( // 监听
    "gesturestart", // Safari 的双指缩放开始事件
    function (e) { // 事件处理函数
      e.preventDefault(); // 阻止缩放
    },
    { passive: false } // 不设为被动监听，才能调用 preventDefault
  );
  document.addEventListener( // 监听
    "gesturechange", // Safari 的双指缩放进行中事件
    function (e) { // 事件处理函数
      e.preventDefault(); // 阻止缩放
    },
    { passive: false } // 不设为被动监听
  );
  document.addEventListener( // 监听
    "gestureend", // Safari 的双指缩放结束事件
    function (e) { // 事件处理函数
      e.preventDefault(); // 阻止缩放
    },
    { passive: false } // 不设为被动监听
  );
  document.addEventListener( // 监听
    "touchstart", // 手指按下事件
    function (e) { // 事件处理函数
      if (e.touches.length > 1) { // 两根及以上手指
        e.preventDefault(); // 阻止（防止双指缩放）
        return; // 不再往下处理
      }
      const now = Date.now(); // 当前时间
      if (now - lastTouchEnd < 350) { // 距上次松手不到 350 毫秒（双击）
        e.preventDefault(); // 阻止（防止双击放大）
      }
    },
    { passive: false } // 不设为被动监听
  );
  document.addEventListener( // 监听
    "touchmove", // 手指移动事件
    function (e) { // 事件处理函数
      if (e.touches.length > 1) { // 两根及以上手指
        e.preventDefault(); // 阻止（防止双指缩放）
        return; // 不再往下处理
      }
      if ( // 如果
        typeof isRolling !== "undefined" && // isRolling 已定义

      }

    { passive: false } // 不设为被动监听
  );

    "touchend", // 手指离开事件
    function () { // 事件处理函数
      lastTouchEnd = Date.now(); // 记下松手时间，用于判断双击
    },
    { passive: false } // 不设为被动监听
  );
  document.addEventListener( // 监听
    "dblclick", // 鼠标双击事件

      e.preventDefault(); // 阻止双击放大
    },
    { passive: false } // 不设为被动监听
  );
})(); // 立即执行函数结束
const resultInner=document.getElementById("result-inner") // 结果内容元素
const typeInputs=document.querySelectorAll('input[name="type"]') // 两个彩种单选框
let isRolling=false // 是否正在生成号码
function getType(){ // 取当前选中的彩种
  return document.querySelector('input[name="type"]:checked').value // 返回选中单选框的值：ssq 或 dlt
}
const segmentedThumb=document.querySelector(".segmented-thumb") // 分段控件的滑块
typeInputs.forEach(input=>input.addEventListener('change',()=>{ // 每个单选框切换时
  segmentedThumb.classList.remove("morph") // 先去掉拉伸动画的类
  void segmentedThumb.offsetWidth // 读取一次布局，强制浏览器应用上一步，才能重新播放动画
  segmentedThumb.classList.add("morph") // 加回类，播放液态拉伸动画
  if(!isRolling){ // 不在生成中时
    resultInner.innerHTML='' // 清空结果（换了彩种，旧号码不再有效）
  }

segmentedThumb.addEventListener("animationend",()=>segmentedThumb.classList.remove("morph")) // 拉伸动画播完后去掉类
;(function liquidGlassTouchLight(){ // 立即执行：触摸发光
  let lit=[] // 当前亮着的元素
  function place(el,e){ // 把光晕移到手指位置
    const r=el.getBoundingClientRect() // 元素在屏幕上的位置
    el.style.setProperty("--lx",`${e.clientX-r.left}px`) // 手指相对元素左边的距离
    el.style.setProperty("--ly",`${e.clientY-r.top}px`) // 手指相对元素上边的距离
  }
  function release(){ // 熄灭所有光晕
    lit.forEach(el=>el.classList.remove("lit")) // 去掉 lit 类
    lit=[] // 清空列表
  }
  document.addEventListener("pointerdown",e=>{ // 按下时
    release() // 先熄灭上一次的
    const ctl=e.target.closest("button,.segmented") // 找到按下的按钮或分段控件
    if(!ctl) return // 不是控件就不处理
    if(ctl.matches(".segmented")&&typeInputs[0].disabled) return // 分段控件禁用时不发光
    if(ctl.disabled) return // 按钮禁用时不发光
    const surface=ctl.matches(".segmented")?segmentedThumb:ctl // 分段控件让滑块发光，按钮让自己发光
    lit=[surface] // 记入列表
    const panel=ctl.closest(".glass") // 所在的玻璃面板
    if(panel) lit.push(panel) // 面板也一起带亮
    lit.forEach(el=>{ // 每个要亮的元素
      place(el,e) // 光晕移到手指位置
      el.classList.add("lit") // 亮起
    })
  })
  document.addEventListener("pointermove",e=>{ // 手指移动时
    lit.forEach(el=>place(el,e)) // 光晕跟着手指走
  })
  document.addEventListener("pointerup",release) // 松手时熄灭
  document.addEventListener("pointercancel",release) // 触摸被系统打断时熄灭
})() // 立即执行函数结束
// 取 [0,max) 内的无偏随机整数：crypto 生成 32 位随机数，丢弃尾部不能整除的部分（拒绝采样）
const randomWord=new Uint32Array(1) // 存放一个 32 位随机数的缓冲区，重复使用
function randomIntUnbiased(max){ // 取 [0,max) 内的无偏随机整数
  if(!(max>0&&max<=0x100000000)) throw new Error("max must be in (0, 2^32]") // max 必须在 1 到 2^32 之间
  const limit=0x100000000-0x100000000%max // 不超过 2^32 的最大的 max 整数倍，超出部分会造成偏差
  let x // 随机数
  do{ // 循环
    crypto.getRandomValues(randomWord) // 用浏览器的加密随机数生成器填充
    x=randomWord[0] // 取出这个 32 位随机数
  }while(x>=limit) // 落在尾部不能整除的区间就重取
  return x%max // 取余，得到 [0,max) 的无偏结果
}
function randomNums(min,max,count){ // 从 min 到 max 中随机取 count 个不重复的数，从小到大排序
  const pool=Array.from({length:max-min+1},(_,i)=>i+min) // 号码池：min, min+1, ..., max
  for(let i=pool.length-1;i>0;i--){ // 从后往前洗牌（Fisher–Yates）
    const j=randomIntUnbiased(i+1) // 在 [0,i] 中随机选一个位置
    ;[pool[i],pool[j]]=[pool[j],pool[i]] // 与当前位置交换
  }
  return pool.slice(0,count).sort((a,b)=>a-b) // 取前 count 个并从小到大排序
}
function createBall(n,color){ // 创建一个号码球
  const span=document.createElement("span") // 外层：球
  span.className=`ball ${color}` // 球的样式：ball 加颜色（red 或 blue）
  const num=document.createElement("span") // 内层：数字
  num.className="ball-num" // 数字的样式（按字形居中）
  num.textContent=String(n).padStart(2,"0") // 补零成两位数
  span.appendChild(num) // 数字放进球里
  return span // 返回这个球
}
function toggleButtons(disabled){ // 统一禁用或启用按钮和彩种切换
  document.getElementById("generate-btn").disabled=disabled // “生成号码”按钮
  document.getElementById("save-btn").disabled=disabled // “保存图片”按钮
  typeInputs.forEach(input=>input.disabled=disabled) // 两个彩种单选框
}
function generateRolling(){ // 生成号码（滚动 10 秒后停下）
  if(isRolling) return // 正在生成就忽略
  const type=getType() // 记下开始时的彩种
  const count=5 // 生成 5 注
  isRolling=true // 标记为生成中
  toggleButtons(true) // 禁用按钮和彩种切换
  resultInner.setAttribute("aria-busy","true") // 告诉读屏软件内容正在变化，先不播报
  const duration=10000 // 滚动 10 秒
  const start=performance.now() // 开始时间
  function frame(now){ // 每一帧
    resultInner.innerHTML='' // 清空上一帧的号码
    for(let i=0;i<count;i++){ // 生成 5 行
      const line=document.createElement("div") // 一行
      line.className="result-line" // 行的样式
      if(type==="ssq"){ // 双色球
        randomNums(1,33,6).forEach(n=>line.appendChild(createBall(n,"red"))) // 6 个红球：1～33 中不重复
        line.appendChild(createBall(randomNums(1,16,1)[0],"blue")) // 1 个蓝球：1～16
      }else{ // 大乐透
        randomNums(1,35,5).forEach(n=>line.appendChild(createBall(n,"red"))) // 5 个红球：1～35 中不重复
        randomNums(1,12,2).forEach(n=>line.appendChild(createBall(n,"blue"))) // 2 个蓝球：1～12 中不重复
      }
      resultInner.appendChild(line) // 这一行加到结果里
    }
    if(now-start<duration){ // 还没到 10 秒
      requestAnimationFrame(frame) // 下一帧继续滚动
    }else{ // 到 10 秒了
      isRolling=false // 标记为生成结束，最后一帧就是结果
      resultInner.removeAttribute("aria-busy") // 读屏软件播报最终号码
      toggleButtons(false) // 恢复按钮和彩种切换
    }
  }
  requestAnimationFrame(frame) // 开始第一帧
}
document.getElementById("generate-btn").onclick=generateRolling // 点击“生成号码”时生成
function formatDateLocal(date){ // 时间格式化为 2026-10-30_123456
  const y=date.getFullYear() // 年
  const m=String(date.getMonth()+1).padStart(2,"0") // 月，补零
  const d=String(date.getDate()).padStart(2,"0") // 日，补零
  const h=String(date.getHours()).padStart(2,"0") // 时，补零
  const min=String(date.getMinutes()).padStart(2,"0") // 分，补零
  const s=String(date.getSeconds()).padStart(2,"0") // 秒，补零
  return `${y}-${m}-${d}_${h}${min}${s}` // 拼成字符串
}
// 导出图片直接用 Canvas 画：版式与原来的截图一致，配色随当前深浅模式。
// 不用 html2canvas 截图：它按自己估算的字体基线画字，iPhone 的苹方、SF 字体上数字会明显偏下
const EXPORT_LAYOUT={ball:28,gap:8,rowGap:12,padX:16,padY:20,titleSize:16,titleHeight:22,titleGap:16,numberSize:13.6} // 导出图片的版式：球直径、球间距、行间距、左右留白、上下留白、标题字号、标题行高、标题与号码的间距、数字字号
// 按字形实际的上下边界垂直居中，不依赖各字体不同的基线和行高
function fillTextCentered(ctx,text,x,cy){ // 在 (x, cy) 处画文字，按字形上下边界垂直居中
  ctx.textBaseline="alphabetic" // 以字母基线为准
  const m=ctx.measureText(text) // 量出文字的尺寸
  if(m.actualBoundingBoxAscent!==undefined){ // 浏览器支持字形的实际上下边界时
    ctx.fillText(text,x,cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2) // 基线下移半个（上沿高度 − 下沿深度），让字形正好居中
  }else{ // 不支持时
    ctx.textBaseline="middle" // 退回以行框中线为准
    ctx.fillText(text,x,cy) // 画文字
  }
}
// 把 CSS 的 linear-gradient(角度, 颜色 位置%, ...) 换成 Canvas 渐变，渐变线长度与 CSS 的算法相同
function canvasLinearGradient(ctx,css,width,height){ // CSS 线性渐变 → Canvas 渐变
  const angle=parseFloat((css.match(/([\d.]+)deg/)||[0,180])[1])*Math.PI/180 // 取角度并换成弧度，没写时默认 180 度（从上到下）
  const dx=Math.sin(angle) // 渐变方向的 x 分量（CSS 0 度朝上，顺时针）
  const dy=-Math.cos(angle) // 渐变方向的 y 分量
  const half=(Math.abs(width*dx)+Math.abs(height*dy))/2 // 渐变线的半长：让渐变刚好覆盖整个矩形的角
  const g=ctx.createLinearGradient(width/2-dx*half,height/2-dy*half,width/2+dx*half,height/2+dy*half) // 从中心沿方向往两边各延伸半长，建立渐变
  for(const m of css.matchAll(/(#[0-9a-f]{3,8}|rgba?\([^)]*\))\s+([\d.]+)%/gi)) g.addColorStop(parseFloat(m[2])/100,m[1]) // 逐个取出“颜色 位置%”，加为色标
  return g // 返回渐变
}
// 与 .red、.blue 的 radial-gradient(circle at 32% 26%, ...) 相同，半径到最远的角；投影与页面上的号码球相同
function drawExportBall(ctx,theme,scale,color,number,x,y,r){ // 画一个导出图片里的号码球
  const gx=x-r+2*r*.32 // 高光中心 x：球左边 + 32% 直径
  const gy=y-r+2*r*.26 // 高光中心 y：球上边 + 26% 直径
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.hypot(x+r-gx,y+r-gy)) // 径向渐变，半径到最远的角（右下角）
  g.addColorStop(0,theme.getPropertyValue(`--${color}-hi`).trim()) // 0%：高光色
  g.addColorStop(.55,theme.getPropertyValue(`--${color}`).trim()) // 55%：主色
  g.addColorStop(1,theme.getPropertyValue(`--${color}-lo`).trim()) // 100%：暗部色
  ctx.save() // 保存画布状态（阴影设置之后恢复）
  // Canvas 的阴影参数不随缩放变化，按导出倍数换算
  ctx.shadowColor="rgba(15,23,42,.18)" // 投影颜色
  ctx.shadowOffsetY=2*scale // 投影向下 2px
  ctx.shadowBlur=5*scale // 投影模糊 5px
  ctx.fillStyle=g // 用渐变填充
  ctx.beginPath() // 开始画路径
  ctx.arc(x,y,r,0,Math.PI*2) // 圆
  ctx.fill() // 填充球
  ctx.shadowColor="rgba(0,0,0,.18)" // 数字阴影颜色
  ctx.shadowOffsetY=scale // 数字阴影向下 1px
  ctx.shadowBlur=scale // 数字阴影模糊 1px
  ctx.fillStyle="#fff" // 白色数字
  fillTextCentered(ctx,number,x,y) // 在球心画数字，按字形居中
  ctx.restore() // 恢复画布状态，去掉阴影
}
function drawExportImage(title){ // 画出导出图片，返回画布
  const L=EXPORT_LAYOUT // 版式参数的简写
  const theme=getComputedStyle(document.documentElement) // 当前深浅模式下的 CSS 变量
  const font=getComputedStyle(document.body).fontFamily // 页面使用的字体
  const lines=[...resultInner.children].map(line=>[...line.children].map(ball=>({ // 从页面读出每行的号码球
    number:ball.textContent, // 号码文字
    color:ball.classList.contains("blue")?"blue":"red" // 颜色：有 blue 类就是蓝球，否则是红球
  })))
  // 至少 2 倍；iPhone 等 3 倍屏按 3 倍导出，图片更清晰
  const scale=Math.min(Math.max(window.devicePixelRatio||1,2),3) // 导出倍数：至少 2，最多 3，跟随屏幕像素密度
  const canvas=document.createElement("canvas") // 新建画布
  const ctx=canvas.getContext("2d") // 取 2D 绘图上下文
  const titleFont=`600 ${L.titleSize}px ${font}` // 标题字体：粗体 16px
  ctx.font=titleFont // 先设好字体，用来量标题宽度
  const columns=Math.max(...lines.map(line=>line.length)) // 最多一行有几个球
  const width=Math.ceil(Math.max(columns*(L.ball+L.gap),ctx.measureText(title).width)+L.padX*2) // 图片宽度：号码行和标题取较宽者，再加左右留白
  const height=L.padY*2+L.titleHeight+L.titleGap+lines.length*L.ball+(lines.length-1)*L.rowGap // 图片高度：上下留白 + 标题 + 间距 + 各行号码 + 行间距
  canvas.width=width*scale // 画布实际像素宽度
  canvas.height=height*scale // 画布实际像素高度
  ctx.scale(scale,scale) // 之后按 CSS 像素坐标作画
  ctx.fillStyle=theme.getPropertyValue("--export-base").trim() // 底色
  ctx.fillRect(0,0,width,height) // 先铺底色
  ctx.fillStyle=canvasLinearGradient(ctx,theme.getPropertyValue("--export-bg"),width,height) // 背景渐变
  ctx.fillRect(0,0,width,height) // 再铺渐变
  ctx.textAlign="center" // 文字水平居中
  ctx.font=titleFont // 标题字体
  ctx.fillStyle=theme.getPropertyValue("--export-title").trim() // 标题颜色
  fillTextCentered(ctx,title,width/2,L.padY+L.titleHeight/2) // 画标题，在标题行内垂直居中
  ctx.font=`600 ${L.numberSize}px ${font}` // 号码数字字体：粗体 13.6px
  const top=L.padY+L.titleHeight+L.titleGap // 第一行号码的顶部位置
  lines.forEach((line,row)=>{ // 每一行
    const left=(width-line.length*(L.ball+L.gap))/2+L.gap/2 // 这一行最左边球的左边缘，让整行水平居中
    line.forEach((ball,i)=>{ // 这一行的每个球
      drawExportBall(ctx,theme,scale,ball.color,ball.number,left+i*(L.ball+L.gap)+L.ball/2,top+row*(L.ball+L.rowGap)+L.ball/2,L.ball/2) // 画球：圆心 x、圆心 y、半径
    })
  })
  return canvas // 返回画好的画布
}
function saveAsImage(){ // 保存图片
  if(isRolling){ // 正在生成时
    alert("请等待生成完成再保存") // 提示等待
    return // 不保存
  }
  if(!resultInner.innerHTML.trim()){ // 还没有生成结果时
    alert("当前没有生成结果") // 提示没有结果
    return // 不保存
  }
  const type=getType() // 当前彩种
  const typeText=type==="ssq"?"双色球":"大乐透" // 彩种的中文名
  const dateText=formatDateLocal(new Date()) // 当前时间，用在标题和文件名里
  let canvas // 导出用的画布
  try{ // 尝试
    canvas=drawExportImage(`${dateText} ${typeText}`) // 画出导出图片，标题为“时间 彩种”
  }catch(error){ // 画图出错时
    console.error("保存图片失败:",error) // 在控制台记录错误
    alert("图片生成失败，请重试") // 提示失败
    return // 不保存
  }
  // iPadOS 默认伪装成 Mac 的 UA，用触摸点数区分
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1) // 是否 iOS：UA 含 iPad/iPhone/iPod，或者是带多点触摸的“Mac”（iPadOS）

    gl.uniform1f(glass.u.uDpr,dpr) // 像素密度
    gl.uniform1i(glass.u.uPanelN,panels.length) // 面板数量
    gl.uniform1fv(glass.u.uPanelR,panels.map(el=>parseFloat(getComputedStyle(el).borderTopLeftRadius)||0).concat([0,0]).slice(0,2)) // 两块面板的圆角半径（从 CSS 读取，不足两块补 0）
    readTheme() // 读取颜色和参数
    draw(performance.now()) // 立即画一帧
  }
  function draw(now){ // 画一帧：now 为当前时间
    // iOS Safari 首次打开时，工具栏调整会改变画布尺寸，却不一定触发 resize 事件。
    // 尺寸不一致时画面会被拉伸，玻璃和卡片错位，所以每次绘制前都核对一遍
    if(canvas.clientWidth!==sizeW||canvas.clientHeight!==sizeH||Math.min(window.devicePixelRatio||1,2)!==sizeDpr){ // 画布尺寸或像素密度和记录的不一致
      resize() // 重新设置（resize 里会再画）
      return // 本次不再往下画
    }
    liquidBackdrop.step(now) // 推进液体运动
    const ph=liquidBackdrop.phases() // 取当前相位
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo) // 画到液体纹理里
    gl.viewport(0,0,fieldW,fieldH) // 视口为纹理尺寸
    gl.useProgram(field.prog) // 用液体程序
    gl.uniform2fv(field.u.uWarpP,ph.warp) // 五层扭曲的相位
    gl.uniform1fv(field.u.uTintP,ph.tint) // 六种条纹的相位
    gl.drawArrays(gl.TRIANGLES,0,3) // 画满整个纹理
    gl.bindFramebuffer(gl.FRAMEBUFFER,null) // 改为画到屏幕
    gl.viewport(0,0,canvas.width,canvas.height) // 视口为画布尺寸
    gl.useProgram(glass.prog) // 用玻璃程序
    gl.bindTexture(gl.TEXTURE_2D,fieldTex) // 使用刚画好的液体纹理
    gl.uniform4fv(glass.u.uPanel,panels.flatMap(el=>{ // 两块面板的位置
      const r=el.getBoundingClientRect() // 面板在屏幕上的位置
      return [r.left+r.width/2,r.top+r.height/2,r.width/2,r.height/2] // 中心 x、中心 y、半宽、半高
    }).concat([0,0,0,0,0,0,0,0]).slice(0,8)) // 不足两块补 0
    gl.drawArrays(gl.TRIANGLES,0,3) // 画满整个屏幕
  }
  // 帧率不设上限：屏幕每刷新一次就画一帧（60Hz 屏 60 帧，高刷屏跟随浏览器给的刷新率）
  function loop(now){ // WebGL 的动画循环
    raf=requestAnimationFrame(loop) // 预约下一帧
    draw(now) // 画这一帧
  }
  function start(){ // 开始动画循环
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop) // 没在循环且没开减弱动态效果时才开始
  }
  function stop(){ // 停止动画循环
    cancelAnimationFrame(raf) // 取消下一帧
    raf=0 // 清空帧编号
  }
  function destroy(){ // 销毁 WebGL：停止动画、移除监听、释放资源
    stop() // 停止动画
    listeners.abort() // 移除所有带 signal 的监听
    observers.forEach(o=>o.disconnect()) // 断开所有尺寸观察器
    canvas.remove() // 移除画布
    document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记，CSS 玻璃恢复
    const lose=gl.getExtension("WEBGL_lose_context") // 取“主动丢弃上下文”扩展
    if(lose&&!gl.isContextLost()) lose.loseContext() // 上下文还在就主动丢弃，立即释放显存
  }
  document.body.insertBefore(canvas,document.body.firstChild) // 画布放到页面最前面（在内容下层）
  resize() // 设置尺寸并画第一帧
  // 极少数设备不能渲染到纹理，此时改用 2D 兜底画法
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo) // 绑定帧缓冲
  const fboOk=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE // 检查能否渲染到纹理
  gl.bindFramebuffer(gl.FRAMEBUFFER,null) // 恢复画到屏幕
  if(!fboOk){ // 不能渲染到纹理时
    destroy() // 销毁
    return null // 返回 null，改用兜底
  }
  canvas.addEventListener("webglcontextlost",()=>{ // WebGL 上下文丢失时（例如 iOS 后台回收）
    destroy() // 销毁
    onLost() // 通知控制器改用兜底
  },on) // 监听可一次性移除
  document.documentElement.classList.add("lg-webgl") // 标记 WebGL 生效，CSS 去掉玻璃底色和模糊
  start() // 开始动画
  window.addEventListener("resize",resize,on) // 窗口尺寸变化时重新设置
  if(window.visualViewport) visualViewport.addEventListener("resize",resize,on) // 可视区域尺寸变化时（iOS 工具栏收起展开）重新设置
  if(window.ResizeObserver){ // 浏览器支持 ResizeObserver 时
    ;[document.querySelector(".container"),canvas].forEach(el=>{ // 观察内容容器（面板位置变化）和画布（画布尺寸变化）
      const o=new ResizeObserver(()=>draw(performance.now())) // 尺寸变化时重画
      o.observe(el) // 开始观察
      observers.push(o) // 记入列表，销毁时断开
    })
  }
  // 旧版 Safari 不支持用 signal 移除监听，所以回调里先确认 WebGL 仍在使用
  onMediaChange(matchMedia("(prefers-color-scheme: dark)"),()=>{ // 系统深浅模式切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    readTheme() // 重新读取颜色
    draw(performance.now()) // 重画
  },on) // 监听可一次性移除
  onMediaChange(reduceMotion,()=>{ // 系统“减弱动态效果”切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    stop() // 先停止
    start() // 按新设置重新开始
    draw(performance.now()) // 立即画一帧
  },on) // 监听可一次性移除
  return {destroy} // 返回销毁接口
}
// 优先用 WebGL；不支持、上下文丢失或系统要求降低透明度时，用 2D 兜底背景和 CSS 玻璃。
// "降低透明度"可以随时切换，切换后立即生效。
// iOS Safari 常在页面切到后台后回收 WebGL 上下文，回到前台时重新创建
;(function liquidGlassController(){ // 立即执行：决定用 WebGL 还是兜底
  const reduceTransparency=matchMedia("(prefers-reduced-transparency: reduce)") // 系统“降低透明度”设置
  let webgl=null // 当前的 WebGL 实例
  let unsupported=false // 设备是否不支持 WebGL（不支持就不再尝试）
  function fallback(){ // 改用兜底
    webgl=null // 清掉 WebGL 实例
    liquidBackdrop.start() // 启动兜底背景
  }
  function create(){ // 创建 WebGL，出错时清理干净
    try{ // 尝试
      return createLiquidGlass(fallback) // 创建，上下文丢失时改用兜底
    }catch(error){ // 初始化出错时
      console.warn("液体玻璃初始化失败:",error) // 在控制台记录
      document.querySelectorAll(".lg-canvas").forEach(c=>c.remove()) // 移除可能残留的画布
      document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记
      return null // 返回 null
    }
  }
  function apply(){ // 根据当前设置选择 WebGL 或兜底
    if(reduceTransparency.matches){ // 开启了降低透明度
      if(webgl) webgl.destroy() // 有 WebGL 就销毁
      fallback() // 改用兜底（实底玻璃）
      return // 结束
    }
    if(webgl||unsupported) return // WebGL 已在运行或设备不支持就不处理
    webgl=create() // 尝试创建 WebGL
    if(webgl){ // 创建成功
      liquidBackdrop.stop() // 停止兜底背景
    }else{ // 创建失败
      unsupported=true // 记为不支持
      liquidBackdrop.start() // 启动兜底背景
    }
  }
  apply() // 页面加载时先选一次
  onMediaChange(reduceTransparency,apply) // 降低透明度切换时重新选
  document.addEventListener("visibilitychange",()=>{ // 页面可见性变化时
    if(document.visibilityState==="visible") apply() // 回到前台就重新选（WebGL 被回收后会重建）
  })
})() // 立即执行函数结束
</script> <!-- 脚本结束 -->
</body> <!-- 页面主体结束 -->
