<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07081a" media="(prefers-color-scheme: dark)">
<title>双色球 / 大乐透 随机选号</title>
<style>
:root {
  /* 浅色、深色跟随系统切换 */
  color-scheme: light dark;
  --bg-page:#eef2ff;
  --bg-canvas:linear-gradient(180deg,#f7f3ff 0%,#eef2ff 100%);
  --text-main:#111827;
  --text-sub:rgba(17,24,39,.6);
  --primary:#4f46e5;
  /* 号码球：高光、主色、暗部（页面和导出图片共用） */
  --red-hi:#ff8a8a;
  --red:#ef4444;
  --red-lo:#d22f2f;
  --blue-hi:#8ab8ff;
  --blue:#3b82f6;
  --blue-lo:#2563d9;
  /* 液态背景：六种液体颜色 */
  --liquid-1:#5b8cff;
  --liquid-2:#a35bff;
  --liquid-3:#ff6fb1;
  --liquid-4:#ff9f45;
  --liquid-5:#3fd0c9;
  --liquid-6:#7b6cff;
  /* 整屏液体的调色：颜色倍率 混白比例 */
  --liquid-tone:1 .28;
  --title-glow:0 0 14px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.8);
  /* 液体玻璃材质（iOS 27 通透）：几乎全透，靠边缘高光、暗边和折射勾出轮廓 */
  --glass-bg:rgba(255,255,255,.03);
  --glass-bg-strong:rgba(255,255,255,.55);
  --glass-blur:blur(4px) saturate(140%) brightness(1.02);
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%);
  --glass-rim:linear-gradient(140deg,#fff,rgba(255,255,255,.4) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.45) 82%,#fff);
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1);
  --glass-border:rgba(15,23,42,.16);
  --glass-inset:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 2px 2px 4px rgba(255,255,255,.6),
    inset -2px -2px 4px rgba(255,255,255,.4),
    inset 0 0 16px rgba(255,255,255,.2);
  --glass-shadow:
    var(--glass-edge),
    var(--glass-inset),
    0 12px 32px rgba(31,41,95,.14),
    0 2px 6px rgba(31,41,95,.08);
  /* WebGL 玻璃：磨砂半径 高光 顶部反光 提亮；面板投影颜色 */
  --gl-look:2 .38 .05 1.02;
  --gl-shadow:rgba(40,30,90,.08);
  --rim-w:1.5px;
  --glow:rgba(255,255,255,.8);
  --tint-primary:rgba(79,70,229,.9);
  --thumb-bg:rgba(255,255,255,.88);
  --thumb-lens:rgba(255,255,255,.4);
  /* 保存弹窗：遮罩、玻璃底色、背景模糊、提示文字 */
  --overlay-bg:rgba(15,23,42,.25);
  --glass-modal:rgba(255,255,255,.22);
  --modal-filter:blur(12px) saturate(160%) brightness(1.08);
  --modal-tip:rgba(17,24,39,.78);
  --modal-tip-shadow:0 1px 6px rgba(255,255,255,.7);
  /* 导出图片：背景、画布底色、标题颜色 */
  --export-bg:linear-gradient(160deg,#ffffff 0%,#f4f2ff 55%,#eef3ff 100%);
  --export-base:#f4f2ff;
  --export-title:#111827;
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --pad:10px;
  --ctl-h:46px;
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:#0b1026;
    --bg-canvas:linear-gradient(180deg,#07081a 0%,#0b1026 100%);
    --text-main:#f1f5f9;
    --text-sub:rgba(241,245,249,.6);
    --primary:#818cf8;
    --liquid-1:#3d6bff;
    --liquid-2:#8b3dff;
    --liquid-3:#ff3d8f;
    --liquid-4:#ff8a24;
    --liquid-5:#1fb8b0;
    --liquid-6:#5a4dff;
    --liquid-tone:.65 0;
    --title-glow:0 0 14px rgba(0,0,0,.7);
    --glass-bg:rgba(20,22,40,.08);
    --glass-bg-strong:rgba(54,60,84,.74);
    --glass-blur:blur(5px) saturate(140%);
    --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);
    --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.14) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.55));
    --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55);
    --glass-border:rgba(0,0,0,.6);
    --glass-inset:
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 2px 2px 4px rgba(255,255,255,.16),
      inset -2px -2px 4px rgba(255,255,255,.08),
      inset 0 0 16px rgba(255,255,255,.05);
    --glass-shadow:
      var(--glass-edge),
      var(--glass-inset),
      0 12px 32px rgba(0,0,0,.4),
      0 2px 6px rgba(0,0,0,.3);
    --gl-look:2.5 .3 .04 1;
    --gl-shadow:rgba(0,0,0,.25);
    --glow:rgba(255,255,255,.26);
    --tint-primary:rgba(99,102,241,.72);
    --thumb-bg:rgba(255,255,255,.22);
    --thumb-lens:rgba(255,255,255,.1);
    --overlay-bg:rgba(0,0,0,.4);
    --glass-modal:rgba(20,22,40,.16);
    --modal-filter:blur(12px) saturate(160%) brightness(1.3);
    --modal-tip:rgba(241,245,249,.85);
    --modal-tip-shadow:0 1px 6px rgba(0,0,0,.5);
    --export-bg:linear-gradient(160deg,#151b3d 0%,#0b1026 55%,#1c1033 100%);
    --export-base:#0b1026;
    --export-title:#f1f5f9;
  }
}
/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass-bg:#ffffff;
    --glass-bg-strong:#ffffff;
    --glass-modal:#ffffff;
    --glass-blur:none;
    --glass-spec:none;
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
  :root {
    --glass-bg:#1e2333;
    --glass-bg-strong:#1e2333;
    --glass-modal:#1e2333;
  }
}
* {box-sizing:border-box;}
  html,
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  }
  html {
  background-color: var(--bg-page);
  background-image: var(--bg-canvas);
  background-repeat: no-repeat;
  background-size: 100% 100vh;
  background-size: 100% 100lvh;
  }
  * {
  -webkit-tap-highlight-color: transparent;
  }
  .container,
  .form-box,
  .result-box,
  .result-inner,
  .result-line,
  h1,
  button,
  .segmented,
  .segmented label {
  touch-action: none;
  -ms-touch-action: none;
}
.backdrop {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:100vh;
  height:100lvh;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.backdrop canvas {
  display:block;
  width:100%;
  height:100%;
}
/* WebGL 版：背景和玻璃面板由画布绘制，CSS 只保留边框、高光描边和触摸发光 */
.lg-canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  height:100lvh;
  z-index:0;
  pointer-events:none;
}
.lg-webgl .backdrop {
  visibility:hidden;
}
.lg-webgl .glass {
  background:transparent;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  box-shadow:none;
}
.container {
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
h1 {
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 4px;
  /* 液体随机流过标题后面时，保证文字清楚 */
  text-shadow:var(--title-glow);
}
/* 液体玻璃基础材质：半透明 + 背景模糊增饱和 + 镜面高光 + 高光边缘 */
.glass {
  position:relative;
  isolation:isolate;
  background:var(--glass-spec),var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  /* 大面板不用外侧模糊投影：Safari 给大尺寸圆角元素画外侧模糊阴影时会分块拼贴，
     圆角外会露出一块方形色块。深色细边改用边框画，内侧高光保留 */
  border:.5px solid var(--glass-border);
  box-shadow:var(--glass-inset);
}
.glass::before,
button::before,
.segmented-thumb::before,
.ios-save-modal::before {
  content:"";
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  border-radius:inherit;
  padding:var(--rim-w);
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
/* 触摸发光：光从手指处向外扩散，并带亮所在的玻璃面板 */
.glass::after,
button::after,
.segmented-thumb::after {
  content:"";
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  left:0;
  z-index:-1;
  border-radius:inherit;
  background:radial-gradient(circle var(--glow-size,90px) at var(--lx,50%) var(--ly,50%),var(--glow),transparent);
  opacity:0;
  transition:opacity .6s ease;
  pointer-events:none;
}
.glass::after {
  --glow-size:150px;
}
.lit::after {
  opacity:1;
  transition-duration:.15s;
}
.glass.lit::after {
  opacity:.55;
}
.form-box {
  border-radius:var(--radius-outer);
  padding:var(--pad);
}
.segmented {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  height:var(--ctl-h);
  padding:4px;
  border-radius:calc(var(--ctl-h) / 2);
  background:rgba(118,118,128,.14);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.segmented input {
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.segmented label {
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  font-weight:500;
  color:var(--text-sub);
  cursor:pointer;
  transition:color .25s;
}
#type-ssq:checked ~ label[for="type-ssq"],
#type-dlt:checked ~ label[for="type-dlt"] {
  color:var(--text-main);
  font-weight:600;
}
.segmented-thumb {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  border-radius:calc(var(--ctl-h) / 2 - 4px);
  isolation:isolate;
  background-image:var(--glass-spec);
  background-color:var(--thumb-bg);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.8),
    0 3px 10px rgba(0,0,0,.12),
    0 1px 2px rgba(0,0,0,.08);
  translate:var(--thumb-x,0) 0;
  scale:var(--thumb-s,1);
  transition:translate .5s cubic-bezier(.34,1.56,.64,1),scale .4s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s,opacity .25s;
}
@supports not (translate:0) {
  .segmented-thumb {
    transform:translateX(var(--thumb-x,0)) scale(var(--thumb-s,1));
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,opacity .25s;
  }
}
@supports (translate:0) {
  .segmented-thumb.morph {
    animation:lg-morph .55s ease;
  }
}
@keyframes lg-morph {
  0% {transform:none;}
  35% {transform:scale(1.1,.9);}
  70% {transform:scale(.98,1.03);}
  100% {transform:none;}
}
#type-dlt:checked ~ .segmented-thumb {
  --thumb-x:100%;
}
.segmented:active input:enabled ~ .segmented-thumb {
  --thumb-s:1.1;
  background-color:var(--thumb-lens);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 2px 2px 4px rgba(255,255,255,.55),
    inset -2px -2px 4px rgba(255,255,255,.4),
    0 8px 20px rgba(0,0,0,.16);
}
.segmented input:focus-visible ~ .segmented-thumb {
  outline:2px solid var(--primary);
  outline-offset:2px;
}
.segmented input:disabled ~ label {
  cursor:not-allowed;
}
.button-group {
  display:flex;
  gap:var(--pad);
  margin-top:var(--pad);
}
button {
  position:relative;
  isolation:isolate;
  flex:1;
  height:var(--ctl-h);
  padding:0 12px;
  font-size:1rem;
  font-weight:600;
  font-family:inherit;
  border-radius:calc(var(--ctl-h) / 2);
  border:none;
  background:var(--glass-spec),var(--glass-bg-strong);
  color:var(--primary);
  cursor:pointer;
  box-shadow:var(--glass-shadow);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .25s,background-color .25s;
}
button.prominent {
  --glow:rgba(255,255,255,.35);
  background:var(--glass-spec),var(--tint-primary);
  color:#fff;
}
button:active {
  transform:scale(1.07);
  filter:brightness(1.1) saturate(1.1);
}
button:focus-visible {
  outline:2px solid var(--primary);
  outline-offset:2px;
}
/* 生成过程中只禁止点击，外观保持不变 */
button:disabled {
  opacity:1;
  filter:none;
  transform:none;
  cursor:not-allowed;
}
.result-box {
  border-radius:var(--radius-outer);
  padding:14px;
  width:100%;
  height:210px;
  overflow-y:hidden;
  flex-shrink:0;
}
.result-inner {
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  width:100%;
  gap:10px;
}
.result-line {
  display:flex;
  justify-content:center;
  height:28px;
}
/* 号码球：带高光的着色玻璃珠 */
.ball {
  width:28px;
  height:28px;
  margin:0 4px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.85rem;
  font-weight:600;
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -2px 3px rgba(0,0,0,.12),
    0 2px 5px rgba(15,23,42,.18);
}
.red {background:radial-gradient(circle at 32% 26%,var(--red-hi) 0%,var(--red) 55%,var(--red-lo) 100%);}
.blue {background:radial-gradient(circle at 32% 26%,var(--blue-hi) 0%,var(--blue) 55%,var(--blue-lo) 100%);}
@media (max-width:360px) {
  :root {--ctl-h:42px;--pad:8px;}
  .ball {width:24px;height:24px;font-size:.75rem;}
  button,
  .segmented label {font-size:.9rem;}
}
/* 横屏时高度不够放下上下排列的内容（页面不能滚动），改为标题在上、选择和结果左右并排 */
@media (orientation:landscape) and (max-height:520px) {
  .container {
    max-width:820px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:12px 16px;
    padding-top:max(12px, env(safe-area-inset-top));
    padding-bottom:max(12px, env(safe-area-inset-bottom));
  }
  h1 {
    grid-column:1 / -1;
    font-size:1.25rem;
    margin:0;
  }
}
.ios-save-overlay {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  /* 遮罩只压暗、不模糊，并用背景色淡入：遮罩带模糊或透明度小于 1 时，弹窗自己的背景模糊看不到后面的页面 */
  background: rgba(0, 0, 0, 0);
  transition: background-color 0.22s ease;
  isolation: isolate;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  touch-action: none;
}
.ios-save-overlay.show {
  background: var(--overlay-bg);
}
.ios-save-modal {
  position: relative;
  width: min(340px, 85vw);
  max-height: 80vh;
  padding: 14px;
  /* 通透玻璃：透过弹窗看到后面模糊的液体，比压暗的背景亮一些 */
  background: var(--glass-spec), var(--glass-modal);
  -webkit-backdrop-filter: var(--modal-filter);
  backdrop-filter: var(--modal-filter);
  border-radius: 32px;
  border: .5px solid var(--glass-border);
  box-shadow: var(--glass-inset);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  -webkit-transform: translateZ(0) scale(.9);
  transform: translateZ(0) scale(.9);
  -webkit-filter: blur(10px);
  filter: blur(10px);
  opacity: 0;
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .3s ease, -webkit-filter .3s ease, opacity .22s ease;
}
.ios-save-overlay.show .ios-save-modal {
  -webkit-transform: translateZ(0) scale(1);
  transform: translateZ(0) scale(1);
  -webkit-filter: none;
  filter: none;
  opacity: 1;
}
.ios-save-preview {
  display: block;
  width: 100%;
  height: auto;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 18px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: default;
}
.ios-save-tip {
  margin-top: 10px;
  font-size: 13px;
  line-height: 20px;
  color: var(--modal-tip);
  text-shadow: var(--modal-tip-shadow);
  text-align: center;
}
.ios-save-close {
  --glow: rgba(255, 255, 255, 0.35);
  flex: none;
  width: 100%;
  margin-top: 10px;
  background: var(--glass-spec), var(--tint-primary);
  color: #fff;
  font-size: 15px;
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="container">
  <h1>双色球 / 大乐透 随机选号</h1>
  <div class="form-box glass">
    <div class="segmented" role="radiogroup" aria-label="彩种">
      <input type="radio" name="type" id="type-ssq" value="ssq" checked>
      <input type="radio" name="type" id="type-dlt" value="dlt">
      <span class="segmented-thumb" aria-hidden="true"></span>
      <label for="type-ssq">双色球</label>
      <label for="type-dlt">大乐透</label>
    </div>
    <div class="button-group">
      <button type="button" id="generate-btn" class="prominent">生成号码</button>
      <button type="button" id="save-btn" class="prominent">保存图片</button>
    </div>
  </div>
  <div class="result-box glass">

// 取 [0,max) 内的无偏随机整数：crypto 生成 32 位随机数，丢弃尾部不能整除的部分（拒绝采样）
const randomWord=new Uint32Array(1)
function randomIntUnbiased(max){
  if(!(max>0&&max<=0x100000000)) throw new Error("max must be in (0, 2^32]")
  const limit=0x100000000-0x100000000%max
  let x
  do{
    crypto.getRandomValues(randomWord)
    x=randomWord[0]
  }while(x>=limit)
  return x%max
}
function randomNums(min,max,count){
  const pool=Array.from({length:max-min+1},(_,i)=>i+min)
  for(let i=pool.length-1;i>0;i--){
    const j=randomIntUnbiased(i+1)
    ;[pool[i],pool[j]]=[pool[j],pool[i]]
  }
  return pool.slice(0,count).sort((a,b)=>a-b)
}

const EXPORT_LAYOUT={ball:28,gap:8,rowGap:12,padX:16,padY:20,titleSize:16,titleHeight:22,titleGap:16,numberSize:13.6}
// 按字形实际的上下边界垂直居中，不依赖各字体不同的基线和行高
function fillTextCentered(ctx,text,x,cy){
  ctx.textBaseline="alphabetic"
  const m=ctx.measureText(text)
  if(m.actualBoundingBoxAscent!==undefined){
    ctx.fillText(text,x,cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2)
  }else{
    ctx.textBaseline="middle"
    ctx.fillText(text,x,cy)
  }
}
// 把 CSS 的 linear-gradient(角度, 颜色 位置%, ...) 换成 Canvas 渐变，渐变线长度与 CSS 的算法相同
function canvasLinearGradient(ctx,css,width,height){
  const angle=parseFloat((css.match(/([\d.]+)deg/)||[0,180])[1])*Math.PI/180
  const dx=Math.sin(angle)
  const dy=-Math.cos(angle)
  const half=(Math.abs(width*dx)+Math.abs(height*dy))/2
  const g=ctx.createLinearGradient(width/2-dx*half,height/2-dy*half,width/2+dx*half,height/2+dy*half)
  for(const m of css.matchAll(/(#[0-9a-f]{3,8}|rgba?\([^)]*\))\s+([\d.]+)%/gi)) g.addColorStop(parseFloat(m[2])/100,m[1])
  return g
}
// 与 .red、.blue 的 radial-gradient(circle at 32% 26%, ...) 相同，半径到最远的角；投影与页面上的号码球相同
function drawExportBall(ctx,theme,scale,color,number,x,y,r){

  const gy=y-r+2*r*.26
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.hypot(x+r-gx,y+r-gy))
  g.addColorStop(0,theme.getPropertyValue(`--${color}-hi`).trim())
  g.addColorStop(.55,theme.getPropertyValue(`--${color}`).trim())
  g.addColorStop(1,theme.getPropertyValue(`--${color}-lo`).trim())

  ctx.arc(x,y,r,0,Math.PI*2)
  ctx.fill()
  ctx.shadowColor="rgba(0,0,0,.18)"
  ctx.shadowOffsetY=scale
  ctx.shadowBlur=scale
  ctx.fillStyle="#fff"

}
function drawExportImage(title){
  const L=EXPORT_LAYOUT
  const theme=getComputedStyle(document.documentElement)
  const font=getComputedStyle(document.body).fontFamily

  const titleFont=`600 ${L.titleSize}px ${font}`

  const columns=Math.max(...lines.map(line=>line.length))
  const width=Math.ceil(Math.max(columns*(L.ball+L.gap),ctx.measureText(title).width)+L.padX*2)
  const height=L.padY*2+L.titleHeight+L.titleGap+lines.length*L.ball+(lines.length-1)*L.rowGap
  canvas.width=width*scale
  canvas.height=height*scale
  ctx.scale(scale,scale)
  ctx.fillStyle=theme.getPropertyValue("--export-base").trim()

  ctx.font=titleFont
  ctx.fillStyle=theme.getPropertyValue("--export-title").trim()

  ctx.font=`600 ${L.numberSize}px ${font}`
  const top=L.padY+L.titleHeight+L.titleGap
  lines.forEach((line,row)=>{
    const left=(width-line.length*(L.ball+L.gap))/2+L.gap/2
    line.forEach((ball,i)=>{
      drawExportBall(ctx,theme,scale,ball.color,ball.number,left+i*(L.ball+L.gap)+L.ball/2,top+row*(L.ball+L.rowGap)+L.ball/2,L.ball/2)

}

// 监听系统设置（深浅模式、减弱动态效果、降低透明度）的变化；iOS 13 及更早只有 addListener
function onMediaChange(mql,fn,options){

// 液态背景：整屏流动的彩色液体。多层正弦扭曲坐标（domain warp）做出丝绸般的流动，
// 六种颜色按扭曲后的坐标平滑混合，任何时刻都铺满全屏，没有液滴的边界
// 扭曲和配色的相位都由随机速度推动，速度每隔几秒随机变化并平滑过渡，
// 所以每次打开都不同，也不会循环重复
// 着色公式在 WebGL 着色器（fieldSrc）和 2D 兜底画法（shade）里各写了一份，改动时两边要保持一致
const liquidBackdrop=(function(){
  const backdrop=document.querySelector(".backdrop")
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  // 液体很平滑，低分辨率计算后放大即可：兜底画法每个画布像素对应 6 个 CSS 像素
  const FALLBACK_SCALE=6
  // 五层扭曲的幅度和频率：低频大幅度决定大的流向，高频小幅度带出细的涟漪
  const WARP=[[.9,1],[.6,1.45],[.42,2.1],[.3,3],[.2,4.3]]
  // 坐标缩放（每个短边长度内的波数）、配色条纹频率、配色锐度、丝绸褶皱的明暗幅度
  const SHAPE=[2.4,1.6,5,.1]
  const warps=WARP.map(()=>{
    const tx=rand(-.3,.3)
    const ty=rand(-.3,.3)
    return {px:rand(0,6.28),py:rand(0,6.28),vx:tx,vy:ty,tx,ty,turn:rand(3,7)}
  })
  const tints=[0,1,2,3,4,5].map(()=>{
    const a=rand(0,6.28)
    const tv=rand(-.25,.25)
    return {dx:Math.cos(a),dy:Math.sin(a),p:rand(0,6.28),v:tv,tv,turn:rand(3,7)}
  })
  let width=backdrop.clientWidth
  let height=backdrop.clientHeight
  let colors=[]
  let chroma=[]
  let tone=[1,0]
  let active=false
  let canvas=null
  let ctx=null
  let image=null
  let raf=0
  let lastStep=performance.now()
  let lastDraw=0
  function rand(a,b){
    return a+Math.random()*(b-a)
  }
  function hex(s){
    s=s.trim().replace("#","")
    return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16)/255)
  }
  function readTheme(){
    const cs=getComputedStyle(document.documentElement)
    colors=[1,2,3,4,5,6].map(i=>hex(cs.getPropertyValue(`--liquid-${i}`)))
    // 每种颜色的饱和度（到同亮度灰色的距离），混色后用来补回饱和度
    chroma=colors.map(c=>{
      const l=luma(c)
      return Math.hypot(c[0]-l,c[1]-l,c[2]-l)
    })

  }
  function luma(c){

  }
  function step(now){
    const dt=Math.min((now-lastStep)/1000,.1)
    lastStep=now
    if(reduceMotion.matches||dt<=0) return
    const ease=Math.min(1,dt*.5)
    warps.forEach(w=>{
      w.turn-=dt
      if(w.turn<=0){

        w.ty=rand(-.3,.3)
        w.turn=rand(3,7)
      }

      w.vy+=(w.ty-w.vy)*ease
      w.px+=w.vx*dt
      w.py+=w.vy*dt
    })

      c.turn-=dt
      if(c.turn<=0){
        c.tv=rand(-.25,.25)
        c.turn=rand(3,7)
      }
      c.v+=(c.tv-c.v)*ease
      c.p+=c.v*dt
    })

  // 着色器用到的参数：spec 只在尺寸或主题变化时更新，phases 逐帧更新
  function spec(){
    return {
      warp:WARP.flat(),
      tintDir:tints.flatMap(c=>[c.dx,c.dy]),

      tone

  function phases(){
    return {warp:warps.flatMap(w=>[w.px,w.py]),tint:tints.map(c=>c.p)}
  }

  function shade(qx,qy){
    for(let i=0;i<WARP.length;i++){
      const [a,f]=WARP[i]
      const nx=qx+a*Math.sin(qy*f+warps[i].px)
      qy+=a*Math.sin(qx*f+warps[i].py)
      qx=nx
    }
    let r=0,g=0,b=0,w=0,ch=0
    for(let k=0;k<6;k++){
      const t=tints[k]
      const s=Math.pow(Math.max(.5+.5*Math.sin((qx*t.dx+qy*t.dy)*SHAPE[1]+t.p),0),SHAPE[2])
      const c=colors[k]
      r+=c[0]*s
      g+=c[1]*s
      b+=c[2]*s
      ch+=chroma[k]*s
      w+=s
    }
    w=Math.max(w,1e-6)
    r/=w
    g/=w
    b/=w
    // 互补色平均会互相抵消、发灰（橙 + 蓝 ≈ 灰），按参与混合的颜色的平均饱和度补回来
    const l=luma([r,g,b])
    const boost=Math.min(ch/w/Math.max(Math.hypot(r-l,g-l,b-l),1e-4),2.5)
    const fold=1+SHAPE[3]*Math.sin(qx*2.3-qy*1.7)
    return [(l+(r-l)*boost)*fold,(l+(g-l)*boost)*fold,(l+(b-l)*boost)*fold]
  }
  function resize(){
    width=backdrop.clientWidth
    height=backdrop.clientHeight
    if(canvas&&active){
      canvas.width=Math.ceil(width/FALLBACK_SCALE)
      canvas.height=Math.ceil(height/FALLBACK_SCALE)
      image=ctx.createImageData(canvas.width,canvas.height)
      drawFallback()
    }

  // 不支持 WebGL 时，在低分辨率 2D 画布上逐像素算出同样的液体，再由浏览器平滑放大
  function drawFallback(){
    const data=image.data
    const inv=SHAPE[0]/Math.min(width,height)
    const [mul,white]=tone
    let o=0
    for(let j=0;j<canvas.height;j++){
      const y=(j+.5)*FALLBACK_SCALE*inv
      for(let i=0;i<canvas.width;i++){
        const c=shade((i+.5)*FALLBACK_SCALE*inv,y)

        data[o+1]=255*Math.min(1,Math.max(0,c[1])*mul*(1-white)+white)
        data[o+2]=255*Math.min(1,Math.max(0,c[2])*mul*(1-white)+white)
        data[o+3]=255
        o+=4
      }
    }
    ctx.putImageData(image,0,0)
  }
  // 30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw<33) return
    lastDraw=now
    step(now)
    drawFallback()
  }
  function start(){
    active=true
    if(!canvas){
      canvas=document.createElement("canvas")
      backdrop.appendChild(canvas)
      ctx=canvas.getContext("2d")
    }
    resize()
    lastStep=performance.now()
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  function stop(){
    active=false
    cancelAnimationFrame(raf)
    raf=0
  }

  window.addEventListener("resize",resize)

  }).observe(backdrop)
  onMediaChange(matchMedia("(prefers-color-scheme: dark)"),()=>{
    readTheme()
    if(active) drawFallback()
  })
  onMediaChange(reduceMotion,()=>{
    if(!active) return

  })
  return {step,spec,phases,start,stop,readTheme}
})()
// WebGL 先在低分辨率纹理里算出液态背景，再整屏放大，并画出玻璃面板：
// 边缘透镜折射、色散、轻度磨砂、高光和投影
// 创建失败时返回 null；成功时返回 {destroy}，WebGL 上下文丢失时调用 onLost
function createLiquidGlass(onLost){
  const canvas=document.createElement("canvas")
  canvas.className="lg-canvas"
  canvas.setAttribute("aria-hidden","true")
  const gl=canvas.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:"low-power"})
  if(!gl) return null
  // 液体纹理每个像素对应 4 个 CSS 像素
  const FIELD_SCALE=4
  const vertSrc=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`
  const fieldSrc=`
precision highp float;
uniform vec2 uFieldRes;
uniform float uFieldScale;
uniform vec4 uShape;
uniform vec2 uWarp[5];
uniform vec2 uWarpP[5];
uniform vec2 uTintD[6];
uniform float uTintP[6];
uniform vec3 uCol[6];
uniform float uChroma[6];
uniform vec2 uTone;
const vec3 LUMA=vec3(.2126,.7152,.0722);
void main(){
  vec2 q=vec2(gl_FragCoord.x,uFieldRes.y-gl_FragCoord.y)*uFieldScale*uShape.x;
  for(int i=0;i<5;i++){
    q+=uWarp[i].x*vec2(sin(q.y*uWarp[i].y+uWarpP[i].x),sin(q.x*uWarp[i].y+uWarpP[i].y));
  }
  vec3 c=vec3(0.);
  float w=0.;
  float ch=0.;
  for(int k=0;k<6;k++){
    float s=pow(max(.5+.5*sin(dot(q,uTintD[k])*uShape.y+uTintP[k]),0.),uShape.z);
    c+=uCol[k]*s;
    ch+=uChroma[k]*s;
    w+=s;
  }
  w=max(w,1e-6);
  c/=w;
  // 互补色平均会互相抵消、发灰（橙 + 蓝 ≈ 灰），按参与混合的颜色的平均饱和度补回来
  float l=dot(c,LUMA);
  vec3 dc=c-l;
  c=(l+dc*min(ch/w/max(length(dc),1e-4),2.5))*(1.+uShape.w*sin(q.x*2.3-q.y*1.7));
  gl_FragColor=vec4(clamp(mix(max(c,0.)*uTone.x,vec3(1.),uTone.y),0.,1.),1.);
}`
  const glassSrc=`
precision highp float;
uniform sampler2D uField;
uniform vec2 uFieldSize;
uniform vec2 uRes;
uniform float uDpr;
uniform vec4 uPanel[2];
uniform float uPanelR[2];
uniform int uPanelN;
uniform vec4 uTint;
uniform vec4 uLook;
uniform vec4 uShadow;
const float SAT=1.1;
const float BEZEL=24.;
const float REFRACT=28.;
const float DISPERSE=.15;
const vec2 LIGHT=vec2(-.61,-.79);
vec3 bg(vec2 p){
  return texture2D(uField,vec2(p.x/uFieldSize.x,1.-p.y/uFieldSize.y)).rgb;
}
// 九点采样的轻度磨砂
vec3 frost(vec2 p,float r){
  vec2 a=vec2(r,0.);
  vec2 b=vec2(.7071*r,.7071*r);
  vec2 c=vec2(-b.x,b.y);
  return bg(p)*.2+(bg(p+a)+bg(p-a)+bg(p+a.yx)+bg(p-a.yx)+bg(p+b)+bg(p-b)+bg(p+c)+bg(p-c))*.1;
}
float sdBox(vec2 q,vec2 b,float r){
  vec2 k=abs(q)-b+r;
  return length(max(k,0.))+min(max(k.x,k.y),0.)-r;
}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  vec3 col=bg(p);
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    float ds=sdBox(p-uPanel[i].xy-vec2(0.,12.),uPanel[i].zw,uPanelR[i]);
    col=mix(col,uShadow.rgb,(1.-smoothstep(-14.,30.,ds))*uShadow.a);
  }
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    vec2 q=p-uPanel[i].xy;
    vec2 b=uPanel[i].zw;
    float r=uPanelR[i];
    float d=sdBox(q,b,r);
    if(d>1.) continue;
    vec2 n=normalize(vec2(sdBox(q+vec2(.5,0.),b,r)-sdBox(q-vec2(.5,0.),b,r),sdBox(q+vec2(0.,.5),b,r)-sdBox(q-vec2(0.,.5),b,r))+1e-6);
    float e=1.-clamp(-d/BEZEL,0.,1.);
    float lens=e*e;
    // 透镜：边缘光线向内弯折，看到的是更靠里的内容（放大），三色错开形成色散
    vec2 off=-n*REFRACT*lens;
    vec3 g;
    if(lens>.001){
      g.r=frost(p+off*(1.+DISPERSE),uLook.x).r;
      g.g=frost(p+off,uLook.x).g;
      g.b=frost(p+off*(1.-DISPERSE),uLook.x).b;
    }else{
      g=frost(p,uLook.x);
    }
    float l=dot(g,vec3(.2126,.7152,.0722));
    g=clamp(mix(vec3(l),g,SAT)*uLook.w,0.,1.);
    g=mix(g,uTint.rgb,uTint.a);
    g+=uLook.z*(1.-clamp(length((q-vec2(-.64*b.x,-b.y))/(vec2(2.4,1.7)*b))/.55,0.,1.));
    // 高光：迎光的左上边缘最亮，右下边缘有反光
    g+=uLook.y*pow(e,3.)*(max(dot(n,LIGHT),0.)+.6*max(dot(n,-LIGHT),0.));
    g=mix(g,vec3(1.),uLook.y*.1*lens);
    col=mix(col,clamp(g,0.,1.),clamp(.5-d*uDpr,0.,1.));
  }
  // 轻微抖动，避免 8 位纹理放大后的平滑渐变出现色带
  col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
  gl_FragColor=vec4(col,1.);
}`
  function compile(type,src){
    const s=gl.createShader(type)
    gl.shaderSource(s,src)
    gl.compileShader(s)
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.warn("液体玻璃着色器编译失败:",gl.getShaderInfoLog(s))
      return null
    }
    return s
  }
  function link(vs,fs,names){
    const prog=gl.createProgram()
    gl.attachShader(prog,vs)
    gl.attachShader(prog,fs)
    gl.bindAttribLocation(prog,0,"a")
    gl.linkProgram(prog)
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return null
    const u={}
    names.forEach(name=>{
      u[name]=gl.getUniformLocation(prog,name)
    })
    return {prog,u}
  }
  const vs=compile(gl.VERTEX_SHADER,vertSrc)
  const fieldFs=compile(gl.FRAGMENT_SHADER,fieldSrc)
  const glassFs=compile(gl.FRAGMENT_SHADER,glassSrc)
  if(!vs||!fieldFs||!glassFs) return null
  const field=link(vs,fieldFs,["uFieldRes","uFieldScale","uShape","uWarp","uWarpP","uTintD","uTintP","uCol","uChroma","uTone"])
  const glass=link(vs,glassFs,["uField","uFieldSize","uRes","uDpr","uPanel","uPanelR","uPanelN","uTint","uLook","uShadow"])
  if(!field||!glass) return null
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0)
  const fieldTex=gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D,fieldTex)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)
  const fbo=gl.createFramebuffer()
  const panels=[...document.querySelectorAll(".glass")].slice(0,2)
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  // 销毁时一次性移除所有监听
  const listeners=new AbortController()
  const on={signal:listeners.signal}
  const observers=[]
  let raf=0
  let lastDraw=0
  let sizeW=0
  let sizeH=0
  let sizeDpr=0
  let fieldW=1
  let fieldH=1
  function rgba(s){
    const v=(s.match(/[\d.]+/g)||[]).map(Number)
    return [(v[0]||0)/255,(v[1]||0)/255,(v[2]||0)/255,v.length>3?v[3]:1]
  }
  // 液体参数来自 liquidBackdrop，颜色和玻璃参数从 CSS 变量读取，深浅模式各一套
  function readTheme(){
    const cs=getComputedStyle(document.documentElement)
    liquidBackdrop.readTheme()
    const sp=liquidBackdrop.spec()
    gl.useProgram(field.prog)
    gl.uniform4f(field.u.uShape,sp.shape[0]/Math.min(sizeW,sizeH),sp.shape[1],sp.shape[2],sp.shape[3])
    gl.uniform2fv(field.u.uWarp,sp.warp)
    gl.uniform2fv(field.u.uTintD,sp.tintDir)
    gl.uniform3fv(field.u.uCol,sp.colors)
    gl.uniform1fv(field.u.uChroma,sp.chroma)
    gl.uniform2fv(field.u.uTone,sp.tone)
    gl.useProgram(glass.prog)
    gl.uniform4f(glass.u.uTint,...rgba(cs.getPropertyValue("--glass-bg")))
    gl.uniform4f(glass.u.uLook,...cs.getPropertyValue("--gl-look").trim().split(/\s+/).map(Number))
    gl.uniform4f(glass.u.uShadow,...rgba(cs.getPropertyValue("--gl-shadow")))
  }
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2)
    sizeW=canvas.clientWidth
    sizeH=canvas.clientHeight
    sizeDpr=dpr
    canvas.width=Math.round(sizeW*dpr)
    canvas.height=Math.round(sizeH*dpr)
    fieldW=Math.max(1,Math.ceil(sizeW/FIELD_SCALE))
    fieldH=Math.max(1,Math.ceil(sizeH/FIELD_SCALE))
    gl.bindTexture(gl.TEXTURE_2D,fieldTex)
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,fieldW,fieldH,0,gl.RGBA,gl.UNSIGNED_BYTE,null)
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo)
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fieldTex,0)
    gl.bindFramebuffer(gl.FRAMEBUFFER,null)
    gl.useProgram(field.prog)
    gl.uniform2f(field.u.uFieldRes,fieldW,fieldH)
    gl.uniform1f(field.u.uFieldScale,FIELD_SCALE)
    gl.useProgram(glass.prog)
    gl.uniform1i(glass.u.uField,0)
    gl.uniform2f(glass.u.uFieldSize,fieldW*FIELD_SCALE,fieldH*FIELD_SCALE)
    gl.uniform2f(glass.u.uRes,canvas.width,canvas.height)
    gl.uniform1f(glass.u.uDpr,dpr)
    gl.uniform1i(glass.u.uPanelN,panels.length)
    gl.uniform1fv(glass.u.uPanelR,panels.map(el=>parseFloat(getComputedStyle(el).borderTopLeftRadius)||0).concat([0,0]).slice(0,2))
    readTheme()
    draw(performance.now())
  }
  function draw(now){
    // iOS Safari 首次打开时，工具栏调整会改变画布尺寸，却不一定触发 resize 事件。
    // 尺寸不一致时画面会被拉伸，玻璃和卡片错位，所以每次绘制前都核对一遍
    if(canvas.clientWidth!==sizeW||canvas.clientHeight!==sizeH||Math.min(window.devicePixelRatio||1,2)!==sizeDpr){
      resize()
      return
    }
    liquidBackdrop.step(now)
    const ph=liquidBackdrop.phases()
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo)
    gl.viewport(0,0,fieldW,fieldH)
    gl.useProgram(field.prog)
    gl.uniform2fv(field.u.uWarpP,ph.warp)
    gl.uniform1fv(field.u.uTintP,ph.tint)
    gl.drawArrays(gl.TRIANGLES,0,3)
    gl.bindFramebuffer(gl.FRAMEBUFFER,null)
    gl.viewport(0,0,canvas.width,canvas.height)
    gl.useProgram(glass.prog)
    gl.bindTexture(gl.TEXTURE_2D,fieldTex)
    gl.uniform4fv(glass.u.uPanel,panels.flatMap(el=>{
      const r=el.getBoundingClientRect()
      return [r.left+r.width/2,r.top+r.height/2,r.width/2,r.height/2]
    }).concat([0,0,0,0,0,0,0,0]).slice(0,8))
    gl.drawArrays(gl.TRIANGLES,0,3)
    lastDraw=now
  }
  // 液体流得很慢，30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw>=33) draw(now)
  }
  function start(){
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  function stop(){
    cancelAnimationFrame(raf)
    raf=0
  }
  function destroy(){
    stop()
    listeners.abort()
    observers.forEach(o=>o.disconnect())
    canvas.remove()
    document.documentElement.classList.remove("lg-webgl")
    const lose=gl.getExtension("WEBGL_lose_context")
    if(lose&&!gl.isContextLost()) lose.loseContext()
  }
  document.body.insertBefore(canvas,document.body.firstChild)
  resize()
  // 极少数设备不能渲染到纹理，此时改用 2D 兜底画法
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo)
  const fboOk=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE
  gl.bindFramebuffer(gl.FRAMEBUFFER,null)
  if(!fboOk){
    destroy()
    return null
  }
  canvas.addEventListener("webglcontextlost",()=>{
    destroy()
    onLost()
  },on)
  document.documentElement.classList.add("lg-webgl")
  start()
  window.addEventListener("resize",resize,on)
  if(window.visualViewport) visualViewport.addEventListener("resize",resize,on)
  if(window.ResizeObserver){
    ;[document.querySelector(".container"),canvas].forEach(el=>{
      const o=new ResizeObserver(()=>draw(performance.now()))
      o.observe(el)
      observers.push(o)
    })
  }
  // 旧版 Safari 不支持用 signal 移除监听，所以回调里先确认 WebGL 仍在使用
  onMediaChange(matchMedia("(prefers-color-scheme: dark)"),()=>{
    if(listeners.signal.aborted) return
    readTheme()
    draw(performance.now())
  },on)
  onMediaChange(reduceMotion,()=>{
    if(listeners.signal.aborted) return
    stop()
    start()
    draw(performance.now())
  },on)
  return {destroy}
}
// 优先用 WebGL；不支持、上下文丢失或系统要求降低透明度时，用 2D 兜底背景和 CSS 玻璃。
// "降低透明度"可以随时切换，切换后立即生效。
// iOS Safari 常在页面切到后台后回收 WebGL 上下文，回到前台时重新创建
;(function liquidGlassController(){
  const reduceTransparency=matchMedia("(prefers-reduced-transparency: reduce)")
  let webgl=null
  let unsupported=false
  function fallback(){
    webgl=null
    liquidBackdrop.start()
  }
  function create(){
    try{
      return createLiquidGlass(fallback)
    }catch(error){
      console.warn("液体玻璃初始化失败:",error)
      document.querySelectorAll(".lg-canvas").forEach(c=>c.remove())
      document.documentElement.classList.remove("lg-webgl")
      return null
    }
  }
  function apply(){
    if(reduceTransparency.matches){
      if(webgl) webgl.destroy()
      fallback()
      return
    }
    if(webgl||unsupported) return
    webgl=create()
    if(webgl){
      liquidBackdrop.stop()
    }else{
      unsupported=true
      liquidBackdrop.start()
    }
  }
  apply()
  onMediaChange(reduceTransparency,apply)
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible") apply()
  })
})()
</script>
</body>
