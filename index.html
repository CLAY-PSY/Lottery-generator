<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>双色球 / 大乐透 随机选号</title>
<script src="./html2canvas.min.js"></script>
<style>
:root {
  color-scheme: light dark;
  --bg-page:#ffc9c2;
  --bg-canvas:linear-gradient(180deg,#fff6e9 0%,#ffe2cf 45%,#ffc9c2 100%);
  --text-main:#111827;
  --text-sub:rgba(17,24,39,.6);
  --primary:#4f46e5;
  --red:#ef4444;
  --blue:#3b82f6;
  /* 彩票风格背景：金色光晕、星光颜色、背景号码球的不透明度 */
  --lotto-glow:rgba(255,190,70,.38);
  --lotto-spark:#f5b301;
  --lotto-ball-o:.92;
  /* 液体玻璃材质（iOS 27）：透明度更低、虚化更强、外圈加深暗边、高光更亮 */
  --glass-bg:rgba(255,255,255,.08);
  --glass-bg-strong:rgba(255,255,255,.55);
  --glass-blur:blur(12px) saturate(180%) brightness(1.03);
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%);
  --glass-rim:linear-gradient(140deg,#fff,rgba(255,255,255,.4) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.45) 82%,#fff);
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1);
  --glass-border:rgba(15,23,42,.16);
  --glass-inset:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 2px 2px 4px rgba(255,255,255,.6),
    inset -2px -2px 4px rgba(255,255,255,.4),
    inset 0 0 16px rgba(255,255,255,.2);
  --glass-shadow:
    var(--glass-edge),
    var(--glass-inset),
    0 12px 32px rgba(31,41,95,.14),
    0 2px 6px rgba(31,41,95,.08);
  --rim-w:1.5px;
  --glow:rgba(255,255,255,.8);
  --tint-primary:rgba(79,70,229,.9);
  --thumb-bg:rgba(255,255,255,.88);
  --thumb-lens:rgba(255,255,255,.4);
  --overlay-bg:rgba(15,23,42,.32);
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --pad:10px;
  --ctl-h:46px;
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:#14060b;
    --bg-canvas:linear-gradient(180deg,#2b0b14 0%,#3a0c19 45%,#14060b 100%);
    --text-main:#f1f5f9;
    --text-sub:rgba(241,245,249,.6);
    --primary:#818cf8;
    --lotto-glow:rgba(220,38,38,.3);

    --glass-bg-strong:rgba(54,60,84,.74);

    --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.14) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.55));
    --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55);
    --glass-border:rgba(0,0,0,.6);
    --glass-inset:
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 2px 2px 4px rgba(255,255,255,.16),
      inset -2px -2px 4px rgba(255,255,255,.08),
      inset 0 0 16px rgba(255,255,255,.05);
    --glass-shadow:
      var(--glass-edge),
      var(--glass-inset),
      0 12px 32px rgba(0,0,0,.4),
      0 2px 6px rgba(0,0,0,.3);
    --glow:rgba(255,255,255,.26);
    --tint-primary:rgba(99,102,241,.72);
    --thumb-bg:rgba(255,255,255,.22);
    --thumb-lens:rgba(255,255,255,.1);
    --overlay-bg:rgba(0,0,0,.45);
  }
}
/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass-bg:#ffffff;
    --glass-bg-strong:#ffffff;
    --glass-blur:none;
    --glass-spec:none;
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
  :root {
    --glass-bg:#1e2333;
    --glass-bg-strong:#1e2333;
  }
}
* {box-sizing:border-box;}
  html,
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  }
  html {
  background-color: var(--bg-page);
  background-image: var(--bg-canvas);
  background-repeat: no-repeat;
  background-size: 100% 100vh;
  background-size: 100% 100lvh;
  }
  * {
  -webkit-tap-highlight-color: transparent;
  }

  .form-box,
  .result-box,
  .result-inner,
  .result-line,
  h1,
  button,

  -ms-touch-action: none;
}
.backdrop {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:100vh;
  height:100lvh;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.backdrop canvas {
  display:block;
  width:100%;
  height:100%;
}
/* WebGL 版：背景和玻璃面板由画布绘制，CSS 只保留边框、高光描边和触摸发光 */
.lg-canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  height:100lvh;
  z-index:0;
  pointer-events:none;
}
.lg-webgl .backdrop {
  visibility:hidden;
}
.lg-webgl .glass {
  background:transparent;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  box-shadow:none;
}
.container {
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
h1 {
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 4px;
}
/* 液体玻璃基础材质：半透明 + 背景模糊增饱和 + 镜面高光 + 高光边缘 */
.glass {
  position:relative;
  isolation:isolate;
  background:var(--glass-spec),var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  /* 大面板不用外侧模糊投影：Safari 给大尺寸圆角元素画外侧模糊阴影时会分块拼贴，
     圆角外会露出一块方形色块。深色细边改用边框画，内侧高光保留 */
  border:.5px solid var(--glass-border);
  box-shadow:var(--glass-inset);
}
.glass::before,
button::before,
.segmented-thumb::before,
.ios-save-modal::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:var(--rim-w);
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
/* 触摸发光：光从手指处向外扩散，并带亮所在的玻璃面板 */
.glass::after,
button::after,
.segmented-thumb::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:radial-gradient(circle var(--glow-size,90px) at var(--lx,50%) var(--ly,50%),var(--glow),transparent);
  opacity:0;
  transition:opacity .6s ease;
  pointer-events:none;
}
.glass::after {
  --glow-size:150px;
}
.lit::after {
  opacity:1;
  transition-duration:.15s;
}
.glass.lit::after {
  opacity:.55;
}
.form-box {
  border-radius:var(--radius-outer);
  padding:var(--pad);
}
.segmented {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  height:var(--ctl-h);
  padding:4px;
  border-radius:calc(var(--ctl-h) / 2);
  background:rgba(118,118,128,.14);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.segmented input {
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.segmented label {
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  font-weight:500;
  color:var(--text-sub);
  cursor:pointer;
  transition:color .25s;
}
#type-ssq:checked ~ label[for="type-ssq"],
#type-dlt:checked ~ label[for="type-dlt"] {
  color:var(--text-main);
  font-weight:600;
}
.segmented-thumb {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  border-radius:calc(var(--ctl-h) / 2 - 4px);
  isolation:isolate;
  background-image:var(--glass-spec);
  background-color:var(--thumb-bg);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.8),
    0 3px 10px rgba(0,0,0,.12),
    0 1px 2px rgba(0,0,0,.08);
  translate:var(--thumb-x,0) 0;
  scale:var(--thumb-s,1);
  transition:translate .5s cubic-bezier(.34,1.56,.64,1),scale .4s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s,opacity .25s;
}
@supports not (translate:0) {
  .segmented-thumb {
    transform:translateX(var(--thumb-x,0)) scale(var(--thumb-s,1));
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,opacity .25s;
  }
}
@supports (translate:0) {
  .segmented-thumb.morph {
    animation:lg-morph .55s ease;
  }
}
@keyframes lg-morph {
  0% {transform:none;}
  35% {transform:scale(1.1,.9);}
  70% {transform:scale(.98,1.03);}
  100% {transform:none;}
}
#type-dlt:checked ~ .segmented-thumb {
  --thumb-x:100%;
}
.segmented:active input:enabled ~ .segmented-thumb {
  --thumb-s:1.1;
  background-color:var(--thumb-lens);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 2px 2px 4px rgba(255,255,255,.55),
    inset -2px -2px 4px rgba(255,255,255,.4),
    0 8px 20px rgba(0,0,0,.16);
}
.segmented input:focus-visible ~ .segmented-thumb {
  outline:2px solid var(--primary);
  outline-offset:2px;
}
.segmented input:disabled ~ label {
  cursor:not-allowed;
}
.button-group {
  display:flex;
  gap:var(--pad);
  margin-top:var(--pad);
}
button {
  position:relative;
  isolation:isolate;
  flex:1;
  height:var(--ctl-h);
  padding:0 12px;
  font-size:1rem;
  font-weight:600;
  font-family:inherit;
  border-radius:calc(var(--ctl-h) / 2);
  border:none;
  background:var(--glass-spec),var(--glass-bg-strong);
  color:var(--primary);
  cursor:pointer;
  box-shadow:var(--glass-shadow);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .25s,background-color .25s;
}
button.prominent {
  --glow:rgba(255,255,255,.35);
  background:var(--glass-spec),var(--tint-primary);
  color:#fff;
}
button:active {
  transform:scale(1.07);
  filter:brightness(1.1) saturate(1.1);
}
/* 生成过程中只禁止点击，外观保持不变 */
button:disabled {
  opacity:1;
  filter:none;
  transform:none;
  cursor:not-allowed;
}
.result-box {
  border-radius:var(--radius-outer);
  padding:14px;
  width:100%;
  height:210px;
  overflow-y:hidden;
  flex-shrink:0;
}
.result-inner {
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  width:100%;
  gap:10px;
}
.result-line {
  display:flex;
  justify-content:center;
  height:28px;
}
/* 号码球：带高光的着色玻璃珠 */
.ball {
  width:28px;
  height:28px;
  margin:0 4px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.85rem;
  font-weight:600;
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -2px 3px rgba(0,0,0,.12),
    0 2px 5px rgba(15,23,42,.18);
}
/* html2canvas 不能正确绘制内阴影，导出图片时去掉 */
.capture .ball {box-shadow:none;}
.red {background:radial-gradient(circle at 32% 26%,#ff8a8a 0%,var(--red) 55%,#d22f2f 100%);}
.blue {background:radial-gradient(circle at 32% 26%,#8ab8ff 0%,var(--blue) 55%,#2563d9 100%);}
@media (max-width:360px) {
  :root {--ctl-h:42px;--pad:8px;}
  .ball {width:24px;height:24px;font-size:.75rem;}
  button,
  .segmented label {font-size:.9rem;}
}
.ios-save-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--overlay-bg);
  opacity: 0;
  transition: opacity 0.22s ease;
  isolation: isolate;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  touch-action: none;
}
.ios-save-overlay.show {
  opacity: 1;
}
.ios-save-modal {
  position: relative;
  width: min(340px, 85vw);
  max-height: 80vh;
  padding: 14px;
  background: var(--glass-spec), var(--glass-bg-strong);
  border-radius: 32px;
  border: .5px solid var(--glass-border);
  box-shadow: var(--glass-inset);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  -webkit-transform: translateZ(0) scale(.9);
  transform: translateZ(0) scale(.9);
  -webkit-filter: blur(10px);
  filter: blur(10px);
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .3s ease, -webkit-filter .3s ease;
}
.ios-save-overlay.show .ios-save-modal {
  -webkit-transform: translateZ(0) scale(1);
  transform: translateZ(0) scale(1);
  -webkit-filter: none;
  filter: none;

.ios-save-preview {
  display: block;
  width: 100%;
  height: auto;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 18px;

  -webkit-touch-callout: default;

.ios-save-tip {
  margin-top: 10px;
  font-size: 13px;
  line-height: 20px;
  color: var(--text-sub);
  text-align: center;

.ios-save-close {
  flex: none;
  width: 100%;
  margin-top: 10px;
  background: var(--glass-spec), var(--tint-primary);
  color: #fff;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="container">
  <h1>双色球 / 大乐透 随机选号</h1>
  <div class="form-box glass">
    <div class="segmented" role="radiogroup" aria-label="彩种">
      <input type="radio" name="type" id="type-ssq" value="ssq" checked>
      <input type="radio" name="type" id="type-dlt" value="dlt">
      <span class="segmented-thumb" aria-hidden="true"></span>
      <label for="type-ssq">双色球</label>
      <label for="type-dlt">大乐透</label>
    </div>
    <div class="button-group">
      <button id="generate-btn" class="prominent">生成号码</button>
      <button id="save-btn" class="prominent">保存图片</button>
    </div>
  </div>
  <div class="result-box glass">
    <div class="result-inner" id="result-inner"></div>
  </div>
</div>
<script>
  (function disableZoom() {
  let lastTouchEnd = 0;
  document.addEventListener(
    "gesturestart",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gesturechange",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gestureend",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "touchstart",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      const now = Date.now();
      if (now - lastTouchEnd < 350) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchmove",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      if (
        typeof isRolling !== "undefined" &&
        isRolling
      ) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchend",
    function () {
      lastTouchEnd = Date.now();
    },
    { passive: false }
  );
  document.addEventListener(
    "dblclick",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
})();
const resultInner=document.getElementById("result-inner")
const typeInputs=document.querySelectorAll('input[name="type"]')
let isRolling=false
function getType(){
  return document.querySelector('input[name="type"]:checked').value
}
const segmentedThumb=document.querySelector(".segmented-thumb")
typeInputs.forEach(input=>input.addEventListener('change',()=>{
  segmentedThumb.classList.remove("morph")
  void segmentedThumb.offsetWidth
  segmentedThumb.classList.add("morph")
  if(!isRolling){
    resultInner.innerHTML=''
  }
}))
segmentedThumb.addEventListener("animationend",()=>segmentedThumb.classList.remove("morph"))
;(function liquidGlassTouchLight(){
  let lit=[]
  function place(el,e){
    const r=el.getBoundingClientRect()
    el.style.setProperty("--lx",`${e.clientX-r.left}px`)
    el.style.setProperty("--ly",`${e.clientY-r.top}px`)
  }
  function release(){
    lit.forEach(el=>el.classList.remove("lit"))
    lit=[]
  }
  document.addEventListener("pointerdown",e=>{
    release()
    const ctl=e.target.closest("button,.segmented")
    if(!ctl) return
    if(ctl.matches(".segmented")&&typeInputs[0].disabled) return
    if(ctl.disabled) return
    const surface=ctl.matches(".segmented")?segmentedThumb:ctl
    lit=[surface]
    const panel=ctl.closest(".glass")
    if(panel) lit.push(panel)
    lit.forEach(el=>{
      place(el,e)
      el.classList.add("lit")
    })
  })
  document.addEventListener("pointermove",e=>{
    lit.forEach(el=>place(el,e))
  })
  document.addEventListener("pointerup",release)
  document.addEventListener("pointercancel",release)
})()
function randomIntUnbiased(max){
  if(max<=0) throw new Error("max must be positive")
  const bytes=new Uint8Array(128)
  const maxBig=BigInt(max)
  const range=1n<<1024n
  const limit=range-(range%maxBig)
  let x
  do{
    crypto.getRandomValues(bytes)
    x=0n
    for(const b of bytes){
      x=(x<<8n)|BigInt(b)
    }
  }while(x>=limit)
  return Number(x%maxBig)
}
function randomNums(min,max,count){
  const pool=Array.from({length:max-min+1},(_,i)=>i+min)
  for(let i=pool.length-1;i>0;i--){
    const j=randomIntUnbiased(i+1)
    ;[pool[i],pool[j]]=[pool[j],pool[i]]
  }
  return pool.slice(0,count).sort((a,b)=>a-b)
}
function createBall(n,color){
  const span=document.createElement("span")
  span.className=`ball ${color}`
  span.textContent=String(n).padStart(2,"0")
  return span
}
function toggleButtons(disabled){
  document.getElementById("generate-btn").disabled=disabled
  document.getElementById("save-btn").disabled=disabled
  typeInputs.forEach(input=>input.disabled=disabled)
}
function generateRolling(){
  if(isRolling) return
  const type=getType()
  const count=5
  isRolling=true
  toggleButtons(true)
  const duration=10000
  const start=performance.now()
  function frame(now){
    resultInner.innerHTML=''
    for(let i=0;i<count;i++){
      const line=document.createElement("div")
      line.className="result-line"
      if(type==="ssq"){
        randomNums(1,33,6).forEach(n=>line.appendChild(createBall(n,"red")))
        line.appendChild(createBall(randomNums(1,16,1)[0],"blue"))
      }else{
        randomNums(1,35,5).forEach(n=>line.appendChild(createBall(n,"red")))
        randomNums(1,12,2).forEach(n=>line.appendChild(createBall(n,"blue")))
      }
      resultInner.appendChild(line)
    }
    if(now-start<duration){
      requestAnimationFrame(frame)
    }else{
      isRolling=false
      toggleButtons(false)
    }
  }
  requestAnimationFrame(frame)
}
function formatDateLocal(date){
  const y=date.getFullYear()
  const m=String(date.getMonth()+1).padStart(2,"0")
  const d=String(date.getDate()).padStart(2,"0")
  const h=String(date.getHours()).padStart(2,"0")
  const min=String(date.getMinutes()).padStart(2,"0")
  const s=String(date.getSeconds()).padStart(2,"0")
  return `${y}-${m}-${d}_${h}${min}${s}`
}

 }else{

// 彩票风格背景：暖色渐变底 + 金色光晕 + 漂浮的号码球 + 闪烁的星光
// 画在 2D 画布上：WebGL 版把它当作贴图做折射；不支持 WebGL 时直接显示这张画布
// x、y 为屏幕宽高比例，r 为短边的百分比；c：r 红球、b 蓝球、g 金球
const lottoBalls=[
  {x:.13,y:.09,r:13,c:"r",n:"07"},
  {x:.86,y:.07,r:9,c:"b",n:"12"},
  {x:.54,y:.05,r:5,c:"g",n:"★"},
  {x:.36,y:.19,r:7,c:"r",n:"23"},
  {x:.72,y:.21,r:6,c:"b",n:"05"},
  {x:.97,y:.37,r:10,c:"r",n:"18"},
  {x:.03,y:.43,r:8,c:"b",n:"09"},
  {x:.5,y:.475,r:5,c:"r",n:"31"},
  {x:.92,y:.53,r:4,c:"g",n:"★"},
  {x:.01,y:.63,r:11,c:"b",n:"16"},
  {x:.99,y:.72,r:9,c:"r",n:"02"},
  {x:.17,y:.88,r:12,c:"r",n:"26"},
  {x:.82,y:.9,r:10,c:"b",n:"03"},
  {x:.5,y:.82,r:6,c:"g",n:"★"},
  {x:.62,y:.96,r:4,c:"r",n:"15"}
]
const lottoSparks=[[.24,.04],[.68,.13],[.92,.24],[.08,.28],[.44,.3],[.83,.45],[.12,.79],[.6,.78],[.3,.84],[.9,.8],[.06,.95],[.4,.92]]
const lottoBackdrop=(function(){
  const backdrop=document.querySelector(".backdrop")
  const canvas=document.createElement("canvas")
  backdrop.appendChild(canvas)
  const ctx=canvas.getContext("2d")
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  // 与 .red、.blue 号码球同一套配色：高光、主色、暗部
  const tones={r:["#ff8a8a","#ef4444","#d22f2f"],b:["#8ab8ff","#3b82f6","#2563d9"],g:["#ffe39a","#f5b301","#c98a00"]}
  let width=0
  let height=0
  let dpr=1
  let base=null
  let glow=null
  let spark=""
  let ballO=1
  let sprites=[]
  let driven=false
  let raf=0
  let lastDraw=0
  function readTheme(){
    const cs=getComputedStyle(document.documentElement)
    const bg=cs.getPropertyValue("--bg-canvas")
    const angle=parseFloat((bg.match(/([\d.]+)deg/)||[0,180])[1])*Math.PI/180
    const dx=Math.sin(angle)
    const dy=-Math.cos(angle)
    const half=(Math.abs(width*dx)+Math.abs(height*dy))/2
    base=ctx.createLinearGradient(width/2-dx*half,height/2-dy*half,width/2+dx*half,height/2+dy*half)
    for(const m of bg.matchAll(/(#[0-9a-f]{6})\s+([\d.]+)%/gi)) base.addColorStop(parseFloat(m[2])/100,m[1])
    const glowColor=cs.getPropertyValue("--lotto-glow").trim()
    glow=ctx.createRadialGradient(width/2,height*.56,0,width/2,height*.56,Math.max(width,height)*.55)
    glow.addColorStop(0,glowColor)
    glow.addColorStop(1,glowColor.replace(/[\d.]+\)$/,"0)"))
    spark=cs.getPropertyValue("--lotto-spark").trim()
    ballO=parseFloat(cs.getPropertyValue("--lotto-ball-o"))||1
  }
  // 每个球预先画成小图，逐帧只做平移和旋转
  function makeSprite(ball){
    const r=ball.r*Math.min(width,height)/100
    const size=r*2.6
    const c=size/2
    const s=document.createElement("canvas")
    s.width=s.height=Math.ceil(size*dpr)
    const g=s.getContext("2d")
    g.scale(dpr,dpr)
    const [hi,mid,lo]=tones[ball.c]
    const shadow=g.createRadialGradient(c,c+r*.18,r*.6,c,c+r*.18,r*1.28)
    shadow.addColorStop(0,"rgba(60,10,20,.22)")
    shadow.addColorStop(1,"rgba(60,10,20,0)")
    g.fillStyle=shadow
    g.fillRect(0,0,size,size)
    const body=g.createRadialGradient(c-r*.36,c-r*.48,0,c-r*.36,c-r*.48,r*2.01)
    body.addColorStop(0,hi)
    body.addColorStop(.55,mid)
    body.addColorStop(1,lo)
    g.fillStyle=body
    g.beginPath()
    g.arc(c,c,r,0,Math.PI*2)
    g.fill()
    g.textAlign="center"
    g.textBaseline="middle"
    g.font=`700 ${Math.round(r*(ball.n.length>1?.82:.95))}px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Arial,sans-serif`
    g.fillStyle="rgba(0,0,0,.18)"
    g.fillText(ball.n,c,c+r*.07)
    g.fillStyle="#fff"
    g.fillText(ball.n,c,c+r*.03)
    return {canvas:s,size}
  }
  function draw(now){
    const t=reduceMotion.matches?0:now/1000
    ctx.setTransform(dpr,0,0,dpr,0,0)
    ctx.globalAlpha=1
    ctx.fillStyle=base
    ctx.fillRect(0,0,width,height)
    ctx.fillStyle=glow
    ctx.fillRect(0,0,width,height)
    ctx.fillStyle=spark
    lottoSparks.forEach(([x,y],i)=>{
      const s=4+(i*3)%5
      ctx.globalAlpha=.35+.65*(.5+.5*Math.sin(t*(1.1+(i%4)*.35)+i*2.3))
      ctx.save()
      ctx.translate(x*width,y*height)
      ctx.beginPath()
      ctx.moveTo(0,-s)
      ctx.quadraticCurveTo(0,0,s,0)
      ctx.quadraticCurveTo(0,0,0,s)
      ctx.quadraticCurveTo(0,0,-s,0)
      ctx.quadraticCurveTo(0,0,0,-s)
      ctx.fill()
      ctx.restore()
    })
    ctx.globalAlpha=ballO
    lottoBalls.forEach((b,i)=>{
      const sp=sprites[i]
      const x=b.x*width+(6+(i*7)%14)*Math.sin(t*2*Math.PI/(18+(i*3)%14)+i*1.7)
      const y=b.y*height+(8+(i*5)%16)*Math.sin(t*2*Math.PI/(22+(i*5)%17)+i*2.9)
      ctx.save()
      ctx.translate(x,y)
      ctx.rotate(.12*Math.sin(t*2*Math.PI/(26+(i*4)%13)+i))
      ctx.drawImage(sp.canvas,-sp.size/2,-sp.size/2,sp.size,sp.size)
      ctx.restore()
    })
    ctx.globalAlpha=1
    lastDraw=now
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2)
    width=backdrop.clientWidth
    height=backdrop.clientHeight
    canvas.width=Math.round(width*dpr)
    canvas.height=Math.round(height*dpr)
    readTheme()
    sprites=lottoBalls.map(makeSprite)
    draw(performance.now())
  }
  // 球漂得很慢，30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw>=33) draw(now)
  }
  // 没有 WebGL 时由这里自己驱动动画；有 WebGL 时由 WebGL 逐帧调用 draw
  function start(){
    driven=true
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  function stop(){
    driven=false
    cancelAnimationFrame(raf)
    raf=0
  }
  resize()
  window.addEventListener("resize",resize)
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",resize)
  reduceMotion.addEventListener("change",()=>{
    const wasDriven=driven
    stop()
    if(wasDriven) start()
    draw(performance.now())
  })
  return {canvas,draw,start,stop}
})()
const liquidGlassOn=(function liquidGlassWebGL(){
  // 用 WebGL 把背景当作贴图，画出玻璃面板：边缘透镜折射、色散、磨砂、高光和投影
  // 不支持 WebGL 或系统要求降低透明度时，保留 CSS 版本
  if(matchMedia("(prefers-reduced-transparency: reduce)").matches) return false
  const canvas=document.createElement("canvas")
  canvas.className="lg-canvas"
  canvas.setAttribute("aria-hidden","true")
  const gl=canvas.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:"low-power"})
  if(!gl) return false
  const vertSrc=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`
  const fragSrc=`
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uDpr;
uniform vec2 uView;
uniform vec4 uPanel[2];
uniform float uPanelR[2];
uniform int uPanelN;
uniform vec4 uTint;
uniform float uSat;
uniform float uBright;
uniform float uFrost;
uniform float uSpec;
uniform float uSheen;
uniform vec4 uShadow;
const float BEZEL=24.;
const float REFRACT=28.;
const float DISPERSE=.15;
vec3 bg(vec2 p){
  return texture2D(uTex,clamp(p/uView,0.,1.)).rgb;
}
// 九点采样的轻度磨砂
vec3 frost(vec2 p,float r){
  vec2 a=vec2(r,0.);
  vec2 b=vec2(.7071*r,.7071*r);
  vec2 c=vec2(-b.x,b.y);
  return bg(p)*.2+(bg(p+a)+bg(p-a)+bg(p+a.yx)+bg(p-a.yx)+bg(p+b)+bg(p-b)+bg(p+c)+bg(p-c))*.1;
}
float sdBox(vec2 q,vec2 b,float r){
  vec2 k=abs(q)-b+r;
  return length(max(k,0.))+min(max(k.x,k.y),0.)-r;
}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  vec3 col=bg(p);
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    float ds=sdBox(p-uPanel[i].xy-vec2(0.,12.),uPanel[i].zw,uPanelR[i]);
    col=mix(col,uShadow.rgb,(1.-smoothstep(-14.,30.,ds))*uShadow.a);
  }
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    vec2 q=p-uPanel[i].xy;
    vec2 b=uPanel[i].zw;
    float r=uPanelR[i];
    float d=sdBox(q,b,r);
    if(d>1.) continue;
    vec2 n=normalize(vec2(sdBox(q+vec2(.5,0.),b,r)-sdBox(q-vec2(.5,0.),b,r),sdBox(q+vec2(0.,.5),b,r)-sdBox(q-vec2(0.,.5),b,r))+1e-6);
    float e=1.-clamp(-d/BEZEL,0.,1.);
    float lens=e*e;
    // 透镜：边缘光线向内弯折，看到的是更靠里的内容（放大），三色错开形成色散
    vec2 off=-n*REFRACT*lens;
    vec3 g;
    if(lens>.001){
      g.r=frost(p+off*(1.+DISPERSE),uFrost).r;
      g.g=frost(p+off,uFrost).g;
      g.b=frost(p+off*(1.-DISPERSE),uFrost).b;
    }else{
      g=frost(p,uFrost);
    }
    float l=dot(g,vec3(.2126,.7152,.0722));
    g=clamp(mix(vec3(l),g,uSat)*uBright,0.,1.);
    g=mix(g,uTint.rgb,uTint.a);
    g+=uSheen*(1.-clamp(length((q-vec2(-.64*b.x,-b.y))/(vec2(2.4,1.7)*b))/.55,0.,1.));
    // 高光：迎光的左上边缘最亮，右下边缘有反光
    vec2 L=normalize(vec2(-1.,-1.3));
    g+=uSpec*pow(e,3.)*(max(dot(n,L),0.)+.6*max(dot(n,-L),0.));
    g=mix(g,vec3(1.),uSpec*.18*lens);
    col=mix(col,clamp(g,0.,1.),clamp(.5-d*uDpr,0.,1.));
  }
  gl_FragColor=vec4(col,1.);
}`
  function compile(type,src){
    const s=gl.createShader(type)
    gl.shaderSource(s,src)
    gl.compileShader(s)
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.warn("液体玻璃着色器编译失败:",gl.getShaderInfoLog(s))
      return null
    }
    return s
  }
  const vs=compile(gl.VERTEX_SHADER,vertSrc)
  const fs=compile(gl.FRAGMENT_SHADER,fragSrc)
  if(!vs||!fs) return false
  const prog=gl.createProgram()
  gl.attachShader(prog,vs)
  gl.attachShader(prog,fs)
  gl.linkProgram(prog)
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return false
  gl.useProgram(prog)
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW)
  const aLoc=gl.getAttribLocation(prog,"a")
  gl.enableVertexAttribArray(aLoc)
  gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0)
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture())
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE)
  const u={}
  ;["uTex","uRes","uDpr","uView","uPanel","uPanelR","uPanelN","uTint","uSat","uBright","uFrost","uSpec","uSheen","uShadow"].forEach(name=>{
    u[name]=gl.getUniformLocation(prog,name)
  })
  gl.uniform1i(u.uTex,0)
  const panels=[...document.querySelectorAll(".glass")].slice(0,2)
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  const darkScheme=matchMedia("(prefers-color-scheme: dark)")
  let raf=0
  let lastDraw=0
  function rgba(s){
    const v=(s.match(/[\d.]+/g)||[]).map(Number)
    return [(v[0]||0)/255,(v[1]||0)/255,(v[2]||0)/255,v.length>3?v[3]:1]
  }
  function readTheme(){
    const cs=getComputedStyle(document.documentElement)
    const dark=darkScheme.matches
    gl.uniform4f(u.uTint,...rgba(cs.getPropertyValue("--glass-bg")))
    gl.uniform1f(u.uSat,dark?1.5:1.25)
    gl.uniform1f(u.uBright,dark?1:1.03)
    gl.uniform1f(u.uFrost,dark?6:5)
    gl.uniform1f(u.uSpec,dark?.3:.38)
    gl.uniform1f(u.uSheen,dark?.08:.12)
    gl.uniform4f(u.uShadow,...(dark?[0,0,0,.4]:[110/255,30/255,40/255,.14]))
  }
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2)
    canvas.width=Math.round(canvas.clientWidth*dpr)
    canvas.height=Math.round(canvas.clientHeight*dpr)
    gl.viewport(0,0,canvas.width,canvas.height)
    gl.uniform2f(u.uRes,canvas.width,canvas.height)
    gl.uniform1f(u.uDpr,dpr)
    gl.uniform2f(u.uView,canvas.clientWidth,canvas.clientHeight)
    gl.uniform1iv(u.uPanelN,[panels.length])
    gl.uniform1fv(u.uPanelR,panels.map(el=>parseFloat(getComputedStyle(el).borderTopLeftRadius)||0).concat([0,0]).slice(0,2))
    readTheme()
    draw(performance.now())
  }
  function draw(now){
    lottoBackdrop.draw(now)
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,lottoBackdrop.canvas)
    gl.uniform4fv(u.uPanel,panels.flatMap(el=>{
      const r=el.getBoundingClientRect()
      return [r.left+r.width/2,r.top+r.height/2,r.width/2,r.height/2]
    }).concat([0,0,0,0,0,0,0,0]).slice(0,8))
    gl.drawArrays(gl.TRIANGLES,0,3)
    lastDraw=now
  }
  // 背景动得很慢，30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw>=33) draw(now)
  }
  function start(){
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  function stop(){
    cancelAnimationFrame(raf)
    raf=0
  }
  canvas.addEventListener("webglcontextlost",e=>{
    e.preventDefault()
    stop()
    canvas.remove()
    document.documentElement.classList.remove("lg-webgl")
    lottoBackdrop.start()
  })
  document.body.insertBefore(canvas,document.body.firstChild)
  resize()
  document.documentElement.classList.add("lg-webgl")
  start()
  window.addEventListener("resize",resize)
  if(window.visualViewport) visualViewport.addEventListener("resize",resize)
  if(window.ResizeObserver) new ResizeObserver(()=>draw(performance.now())).observe(document.querySelector(".container"))
  darkScheme.addEventListener("change",()=>{
    readTheme()
    draw(performance.now())
  })
  reduceMotion.addEventListener("change",()=>{
    stop()
    start()
    draw(performance.now())
  })
  return true
})()
if(!liquidGlassOn) lottoBackdrop.start()
document.getElementById("generate-btn").onclick=generateRolling
document.getElementById("save-btn").onclick=saveAsImage
</script>
