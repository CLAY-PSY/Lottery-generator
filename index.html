<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07081a">
<title>双色球 / 大乐透 随机选号</title>
<script src="./html2canvas.min.js"></script>
<style>
:root {
  /* 只用深色模式，不跟随系统切换浅色 */
  color-scheme: dark;
  --bg-page:#0b1026;
  --bg-canvas:linear-gradient(180deg,#07081a 0%,#0b1026 100%);
  --text-main:#f1f5f9;
  --text-sub:rgba(241,245,249,.6);
  --primary:#818cf8;
  --red:#ef4444;
  --blue:#3b82f6;
  /* 液态背景：六种液体颜色 */
  --liquid-1:#3d6bff;
  --liquid-2:#8b3dff;
  --liquid-3:#ff3d8f;
  --liquid-4:#ff8a24;
  --liquid-5:#1fb8b0;
  --liquid-6:#5a4dff;
  --title-glow:0 0 14px rgba(0,0,0,.7);
  /* 液体玻璃材质（iOS 27 通透）：几乎全透，靠边缘高光、暗边和折射勾出轮廓 */
  --glass-bg:rgba(20,22,40,.08);
  --glass-bg-strong:rgba(54,60,84,.74);
  --glass-blur:blur(5px) saturate(140%);
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);
  --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.14) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.55));
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55);
  --glass-border:rgba(0,0,0,.6);
  --glass-inset:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 2px 2px 4px rgba(255,255,255,.16),
    inset -2px -2px 4px rgba(255,255,255,.08),
    inset 0 0 16px rgba(255,255,255,.05);
  --glass-shadow:
    var(--glass-edge),
    var(--glass-inset),
    0 12px 32px rgba(0,0,0,.4),
    0 2px 6px rgba(0,0,0,.3);
  --rim-w:1.5px;
  --glow:rgba(255,255,255,.26);
  --tint-primary:rgba(99,102,241,.72);
  --thumb-bg:rgba(255,255,255,.22);
  --thumb-lens:rgba(255,255,255,.1);
  --overlay-bg:rgba(0,0,0,.45);
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --pad:10px;
  --ctl-h:46px;
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad));
}
/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass-bg:#1e2333;
    --glass-bg-strong:#1e2333;
    --glass-blur:none;
    --glass-spec:none;
  }
}
* {box-sizing:border-box;}
  html,
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  }
  html {
  background-color: var(--bg-page);
  background-image: var(--bg-canvas);
  background-repeat: no-repeat;
  background-size: 100% 100vh;
  background-size: 100% 100lvh;
  }
  * {
  -webkit-tap-highlight-color: transparent;
  }
  .container,
  .form-box,
  .result-box,
  .result-inner,
  .result-line,
  h1,
  button,
  .segmented,
  .segmented label {
  touch-action: none;
  -ms-touch-action: none;
}
.backdrop {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:100vh;
  height:100lvh;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.backdrop canvas {
  display:block;
  width:100%;
  height:100%;
}
/* WebGL 版：背景和玻璃面板由画布绘制，CSS 只保留边框、高光描边和触摸发光 */
.lg-canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  height:100lvh;
  z-index:0;
  pointer-events:none;
}
.lg-webgl .backdrop {
  visibility:hidden;
}
.lg-webgl .glass {
  background:transparent;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  box-shadow:none;
}
.container {
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
h1 {
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 4px;
  /* 液体随机流过标题后面时，保证文字清楚 */
  text-shadow:var(--title-glow);
}
/* 液体玻璃基础材质：半透明 + 背景模糊增饱和 + 镜面高光 + 高光边缘 */
.glass {
  position:relative;
  isolation:isolate;
  background:var(--glass-spec),var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  /* 大面板不用外侧模糊投影：Safari 给大尺寸圆角元素画外侧模糊阴影时会分块拼贴，
     圆角外会露出一块方形色块。深色细边改用边框画，内侧高光保留 */
  border:.5px solid var(--glass-border);
  box-shadow:var(--glass-inset);
}
.glass::before,
button::before,
.segmented-thumb::before,
.ios-save-modal::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:var(--rim-w);
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
/* 触摸发光：光从手指处向外扩散，并带亮所在的玻璃面板 */
.glass::after,
button::after,
.segmented-thumb::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:radial-gradient(circle var(--glow-size,90px) at var(--lx,50%) var(--ly,50%),var(--glow),transparent);
  opacity:0;
  transition:opacity .6s ease;
  pointer-events:none;
}
.glass::after {
  --glow-size:150px;
}
.lit::after {
  opacity:1;
  transition-duration:.15s;
}
.glass.lit::after {
  opacity:.55;
}
.form-box {
  border-radius:var(--radius-outer);
  padding:var(--pad);
}
.segmented {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  height:var(--ctl-h);
  padding:4px;
  border-radius:calc(var(--ctl-h) / 2);
  background:rgba(118,118,128,.14);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.segmented input {
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.segmented label {
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  font-weight:500;
  color:var(--text-sub);
  cursor:pointer;
  transition:color .25s;
}
#type-ssq:checked ~ label[for="type-ssq"],
#type-dlt:checked ~ label[for="type-dlt"] {
  color:var(--text-main);
  font-weight:600;
}
.segmented-thumb {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  border-radius:calc(var(--ctl-h) / 2 - 4px);
  isolation:isolate;
  background-image:var(--glass-spec);
  background-color:var(--thumb-bg);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.8),
    0 3px 10px rgba(0,0,0,.12),
    0 1px 2px rgba(0,0,0,.08);
  translate:var(--thumb-x,0) 0;
  scale:var(--thumb-s,1);
  transition:translate .5s cubic-bezier(.34,1.56,.64,1),scale .4s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s,opacity .25s;
}
@supports not (translate:0) {
  .segmented-thumb {
    transform:translateX(var(--thumb-x,0)) scale(var(--thumb-s,1));
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,opacity .25s;
  }
}
@supports (translate:0) {
  .segmented-thumb.morph {
    animation:lg-morph .55s ease;
  }
}
@keyframes lg-morph {
  0% {transform:none;}
  35% {transform:scale(1.1,.9);}
  70% {transform:scale(.98,1.03);}
  100% {transform:none;}
}
#type-dlt:checked ~ .segmented-thumb {
  --thumb-x:100%;
}
.segmented:active input:enabled ~ .segmented-thumb {
  --thumb-s:1.1;
  background-color:var(--thumb-lens);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 2px 2px 4px rgba(255,255,255,.55),
    inset -2px -2px 4px rgba(255,255,255,.4),
    0 8px 20px rgba(0,0,0,.16);
}
.segmented input:focus-visible ~ .segmented-thumb {
  outline:2px solid var(--primary);
  outline-offset:2px;
}
.segmented input:disabled ~ label {
  cursor:not-allowed;
}
.button-group {
  display:flex;
  gap:var(--pad);
  margin-top:var(--pad);
}
button {
  position:relative;
  isolation:isolate;
  flex:1;
  height:var(--ctl-h);
  padding:0 12px;
  font-size:1rem;
  font-weight:600;
  font-family:inherit;
  border-radius:calc(var(--ctl-h) / 2);
  border:none;
  background:var(--glass-spec),var(--glass-bg-strong);
  color:var(--primary);
  cursor:pointer;
  box-shadow:var(--glass-shadow);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .25s,background-color .25s;
}
button.prominent {
  --glow:rgba(255,255,255,.35);
  background:var(--glass-spec),var(--tint-primary);
  color:#fff;
}
button:active {
  transform:scale(1.07);
  filter:brightness(1.1) saturate(1.1);
}
/* 生成过程中只禁止点击，外观保持不变 */
button:disabled {
  opacity:1;
  filter:none;
  transform:none;
  cursor:not-allowed;
}
.result-box {
  border-radius:var(--radius-outer);
  padding:14px;
  width:100%;
  height:210px;
  overflow-y:hidden;
  flex-shrink:0;
}
.result-inner {
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  width:100%;
  gap:10px;
}
.result-line {
  display:flex;
  justify-content:center;
  height:28px;
}
/* 号码球：带高光的着色玻璃珠 */
.ball {
  width:28px;
  height:28px;
  margin:0 4px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.85rem;
  font-weight:600;
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -2px 3px rgba(0,0,0,.12),
    0 2px 5px rgba(15,23,42,.18);
}
/* html2canvas 不能正确绘制内阴影，导出图片时去掉 */
.capture .ball {box-shadow:none;}
.red {background:radial-gradient(circle at 32% 26%,#ff8a8a 0%,var(--red) 55%,#d22f2f 100%);}
.blue {background:radial-gradient(circle at 32% 26%,#8ab8ff 0%,var(--blue) 55%,#2563d9 100%);}
@media (max-width:360px) {
  :root {--ctl-h:42px;--pad:8px;}
  .ball {width:24px;height:24px;font-size:.75rem;}
  button,
  .segmented label {font-size:.9rem;}
}
.ios-save-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--overlay-bg);
  opacity: 0;
  transition: opacity 0.22s ease;
  isolation: isolate;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  touch-action: none;
}
.ios-save-overlay.show {
  opacity: 1;
}
.ios-save-modal {
  position: relative;
  width: min(340px, 85vw);
  max-height: 80vh;
  padding: 14px;
  background: var(--glass-spec), var(--glass-bg-strong);
  border-radius: 32px;
  border: .5px solid var(--glass-border);
  box-shadow: var(--glass-inset);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  -webkit-transform: translateZ(0) scale(.9);
  transform: translateZ(0) scale(.9);
  -webkit-filter: blur(10px);
  filter: blur(10px);
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .3s ease, -webkit-filter .3s ease;
}
.ios-save-overlay.show .ios-save-modal {
  -webkit-transform: translateZ(0) scale(1);
  transform: translateZ(0) scale(1);
  -webkit-filter: none;
  filter: none;
}
.ios-save-preview {
  display: block;
  width: 100%;
  height: auto;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 18px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: default;
}
.ios-save-tip {
  margin-top: 10px;
  font-size: 13px;
  line-height: 20px;
  color: var(--text-sub);
  text-align: center;
}
.ios-save-close {
  flex: none;
  width: 100%;
  margin-top: 10px;
  background: var(--glass-spec), var(--tint-primary);
  color: #fff;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="container">
  <h1>双色球 / 大乐透 随机选号</h1>
  <div class="form-box glass">
    <div class="segmented" role="radiogroup" aria-label="彩种">
      <input type="radio" name="type" id="type-ssq" value="ssq" checked>
      <input type="radio" name="type" id="type-dlt" value="dlt">
      <span class="segmented-thumb" aria-hidden="true"></span>
      <label for="type-ssq">双色球</label>
      <label for="type-dlt">大乐透</label>
    </div>
    <div class="button-group">
      <button id="generate-btn" class="prominent">生成号码</button>
      <button id="save-btn" class="prominent">保存图片</button>
    </div>
  </div>
  <div class="result-box glass">
    <div class="result-inner" id="result-inner"></div>
  </div>
</div>
<script>
  (function disableZoom() {
  let lastTouchEnd = 0;
  document.addEventListener(
    "gesturestart",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gesturechange",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gestureend",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "touchstart",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      const now = Date.now();
      if (now - lastTouchEnd < 350) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchmove",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      if (
        typeof isRolling !== "undefined" &&
        isRolling
      ) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchend",
    function () {
      lastTouchEnd = Date.now();
    },
    { passive: false }
  );
  document.addEventListener(
    "dblclick",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
})();
const resultInner=document.getElementById("result-inner")
const typeInputs=document.querySelectorAll('input[name="type"]')
let isRolling=false
function getType(){
  return document.querySelector('input[name="type"]:checked').value
}
const segmentedThumb=document.querySelector(".segmented-thumb")
typeInputs.forEach(input=>input.addEventListener('change',()=>{
  segmentedThumb.classList.remove("morph")
  void segmentedThumb.offsetWidth
  segmentedThumb.classList.add("morph")
  if(!isRolling){
    resultInner.innerHTML=''
  }
}))
segmentedThumb.addEventListener("animationend",()=>segmentedThumb.classList.remove("morph"))
;(function liquidGlassTouchLight(){
  let lit=[]
  function place(el,e){
    const r=el.getBoundingClientRect()
    el.style.setProperty("--lx",`${e.clientX-r.left}px`)
    el.style.setProperty("--ly",`${e.clientY-r.top}px`)
  }
  function release(){
    lit.forEach(el=>el.classList.remove("lit"))
    lit=[]
  }
  document.addEventListener("pointerdown",e=>{
    release()
    const ctl=e.target.closest("button,.segmented")
    if(!ctl) return
    if(ctl.matches(".segmented")&&typeInputs[0].disabled) return
    if(ctl.disabled) return
    const surface=ctl.matches(".segmented")?segmentedThumb:ctl
    lit=[surface]
    const panel=ctl.closest(".glass")
    if(panel) lit.push(panel)
    lit.forEach(el=>{
      place(el,e)
      el.classList.add("lit")
    })
  })
  document.addEventListener("pointermove",e=>{
    lit.forEach(el=>place(el,e))
  })
  document.addEventListener("pointerup",release)
  document.addEventListener("pointercancel",release)
})()
function randomIntUnbiased(max){
  if(max<=0) throw new Error("max must be positive")
  const bytes=new Uint8Array(128)
  const maxBig=BigInt(max)
  const range=1n<<1024n
  const limit=range-(range%maxBig)
  let x
  do{
    crypto.getRandomValues(bytes)
    x=0n
    for(const b of bytes){
      x=(x<<8n)|BigInt(b)
    }
  }while(x>=limit)
  return Number(x%maxBig)
}
function randomNums(min,max,count){
  const pool=Array.from({length:max-min+1},(_,i)=>i+min)
  for(let i=pool.length-1;i>0;i--){
    const j=randomIntUnbiased(i+1)
    ;[pool[i],pool[j]]=[pool[j],pool[i]]
  }
  return pool.slice(0,count).sort((a,b)=>a-b)
}
function createBall(n,color){
  const span=document.createElement("span")
  span.className=`ball ${color}`
  span.textContent=String(n).padStart(2,"0")
  return span
}
function toggleButtons(disabled){
  document.getElementById("generate-btn").disabled=disabled
  document.getElementById("save-btn").disabled=disabled
  typeInputs.forEach(input=>input.disabled=disabled)
}
function generateRolling(){
  if(isRolling) return
  const type=getType()
  const count=5
  isRolling=true
  toggleButtons(true)
  const duration=10000
  const start=performance.now()
  function frame(now){
    resultInner.innerHTML=''
    for(let i=0;i<count;i++){
      const line=document.createElement("div")
      line.className="result-line"
      if(type==="ssq"){
        randomNums(1,33,6).forEach(n=>line.appendChild(createBall(n,"red")))
        line.appendChild(createBall(randomNums(1,16,1)[0],"blue"))
      }else{
        randomNums(1,35,5).forEach(n=>line.appendChild(createBall(n,"red")))
        randomNums(1,12,2).forEach(n=>line.appendChild(createBall(n,"blue")))
      }
      resultInner.appendChild(line)
    }
    if(now-start<duration){
      requestAnimationFrame(frame)
    }else{
      isRolling=false
      toggleButtons(false)
    }
  }
  requestAnimationFrame(frame)
}
function formatDateLocal(date){
  const y=date.getFullYear()
  const m=String(date.getMonth()+1).padStart(2,"0")
  const d=String(date.getDate()).padStart(2,"0")
  const h=String(date.getHours()).padStart(2,"0")
  const min=String(date.getMinutes()).padStart(2,"0")
  const s=String(date.getSeconds()).padStart(2,"0")
  return `${y}-${m}-${d}_${h}${min}${s}`
}

// 液态背景：十团彩色液体加六颗小液滴随机游动、靠近时相互融合（metaball），边缘清楚，经过玻璃边缘时能看出折射
// 运动由随机力推动（带阻尼和回复力的随机游走），每次打开都不同，也不会循环重复
// 着色公式在 WebGL 着色器和兜底的 2D 画法里各写了一份，改动时两边要保持一致
const liquidBackdrop=(function(){
  const backdrop=document.querySelector(".backdrop")
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  // 兜底画法逐像素计算，每个画布像素对应 3 个 CSS 像素，没有 WebGL 的老设备也跑得动
  const FALLBACK_SCALE=3
  const blobs=[]
  let width=backdrop.clientWidth
  let height=backdrop.clientHeight
  let colors=[]
  let base=[]
  let canvas=null
  let ctx=null
  let image=null
  let raf=0
  let lastStep=0
  let lastDraw=0
  function rand(a,b){
    return a+Math.random()*(b-a)
  }
  function hex(s){
    s=s.trim().replace("#","")
    return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16)/255)
  }
  function readTheme(){
    const cs=getComputedStyle(document.documentElement)
    colors=[1,2,3,4,5,6].map(i=>hex(cs.getPropertyValue(`--liquid-${i}`)))
    base=[...cs.getPropertyValue("--bg-canvas").matchAll(/#[0-9a-f]{6}/gi)].map(m=>hex(m[0]))
  }
  // 十团大液体按 2×5 网格分布再随机打散，避免挤在一起留下空白；六颗小液滴随机放。r 为短边的百分比
  for(let i=0;i<16;i++){
    const big=i<10
    const b={
      hx:Math.min(.92,Math.max(.08,big?(i%2+.5)/2+rand(-.18,.18):rand(.1,.9))),
      hy:Math.min(.95,Math.max(.05,big?(Math.floor(i/2)+.5)/5+rand(-.07,.07):rand(.06,.94))),
      vx:0,vy:0,fx:0,fy:0,tx:0,ty:0,turn:0,
      r:big?rand(14,20):rand(4,8),
      breath:rand(0,6.28),breathRate:rand(.2,.5),
      color:i%6
    }
    b.x=b.hx*width
    b.y=b.hy*height
    blobs.push(b)
  }
  // 每隔几秒随机换一次推力方向并平滑过渡；回复力把液体拉向它的家，家本身也在缓慢随机漂移
  function step(now){
    const dt=Math.min((now-lastStep)/1000,.1)
    lastStep=now
    if(reduceMotion.matches||dt<=0) return
    blobs.forEach(b=>{
      b.turn-=dt
      if(b.turn<=0){
        b.tx=rand(-1,1)*22
        b.ty=rand(-1,1)*22
        b.breathRate=rand(.2,.5)
        b.turn=rand(2.5,6)
      }
      b.fx+=(b.tx-b.fx)*Math.min(1,dt*.8)
      b.fy+=(b.ty-b.fy)*Math.min(1,dt*.8)
      b.hx=Math.min(.92,Math.max(.08,b.hx+rand(-1,1)*.02*dt))
      b.hy=Math.min(.95,Math.max(.05,b.hy+rand(-1,1)*.02*dt))
      b.vx+=(b.fx-(b.x-b.hx*width)*.12-b.vx*.9)*dt
      b.vy+=(b.fy-(b.y-b.hy*height)*.12-b.vy*.9)*dt
      b.x+=b.vx*dt
      b.y+=b.vy*dt
      b.breath+=b.breathRate*dt
    })
  }
  // 当前每团液体的圆心和半径（px），半径随呼吸轻微变化
  function shapes(){
    const unit=Math.min(width,height)/100
    return blobs.map(b=>[b.x,b.y,b.r*unit*(1+.08*Math.sin(b.breath))])
  }
  function resize(){
    const sx=backdrop.clientWidth/(width||1)
    const sy=backdrop.clientHeight/(height||1)
    width=backdrop.clientWidth
    height=backdrop.clientHeight
    blobs.forEach(b=>{
      b.x*=sx
      b.y*=sy
    })
    if(canvas){
      canvas.width=Math.ceil(width/FALLBACK_SCALE)
      canvas.height=Math.ceil(height/FALLBACK_SCALE)
      image=ctx.createImageData(canvas.width,canvas.height)
      drawFallback()
    }
  }
  // 不支持 WebGL 时，在 2D 画布上逐像素算出和着色器相同的融合液体，再由浏览器平滑放大
  function drawFallback(){
    const cw=canvas.width
    const ch=canvas.height
    const data=image.data
    const sh=shapes()
    const n=sh.length
    const cols=blobs.map(b=>colors[b.color])
    const top=base[0]
    const bottom=base[base.length-1]
    const aa=FALLBACK_SCALE/2
    let o=0
    for(let j=0;j<ch;j++){
      const y=(j+.5)*FALLBACK_SCALE
      const ty=Math.min(1,y/height)
      const br=top[0]+(bottom[0]-top[0])*ty
      const bgc=top[1]+(bottom[1]-top[1])*ty
      const bb=top[2]+(bottom[2]-top[2])*ty
      for(let i=0;i<cw;i++){
        const x=(i+.5)*FALLBACK_SCALE
        let f=0,gx=0,gy=0,cr=0,cg=0,cb=0,w=0
        for(let k=0;k<n;k++){
          const s=sh[k]
          const dx=x-s[0]
          const dy=y-s[1]
          const d2=Math.max(dx*dx+dy*dy,1)
          const q=s[2]*s[2]/d2
          const q2=2*q/d2
          const qq=q*q
          const c=cols[k]
          f+=q
          gx-=q2*dx
          gy-=q2*dy
          cr+=c[0]*qq
          cg+=c[1]*qq
          cb+=c[2]*qq
          w+=qq
        }
        const gn=Math.max(Math.sqrt(gx*gx+gy*gy),1e-6)
        const t=1/Math.sqrt(Math.max(f,1e-6))
        const d=(1-t)/Math.max(.5*t*t*t*gn,1e-6)
        const shade=.9+.18*Math.min(1,Math.max(0,d/90))
        const rim=.4*Math.exp(-Math.max(d,0)/3)*Math.max((-gx*-.61-gy*-.79)/gn,0)
        const e=Math.min(1,Math.max(0,(d+aa)/(2*aa)))
        const m=e*e*(3-2*e)
        w=Math.max(w,1e-6)
        data[o]=255*(br+(Math.min(1,cr/w*shade+rim)-br)*m)
        data[o+1]=255*(bgc+(Math.min(1,cg/w*shade+rim)-bgc)*m)
        data[o+2]=255*(bb+(Math.min(1,cb/w*shade+rim)-bb)*m)
        data[o+3]=255
        o+=4
      }
    }
    ctx.putImageData(image,0,0)
  }
  // 30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw<33) return
    lastDraw=now
    step(now)
    drawFallback()
  }
  function start(){
    if(!canvas){
      canvas=document.createElement("canvas")
      backdrop.appendChild(canvas)
      ctx=canvas.getContext("2d")
      resize()
    }
    lastStep=performance.now()
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  readTheme()
  window.addEventListener("resize",resize)
  reduceMotion.addEventListener("change",()=>{
    if(!canvas) return
    cancelAnimationFrame(raf)
    raf=0
    start()
    drawFallback()
  })
  return {step,shapes,start,colors:()=>colors,base:()=>base,blobColor:i=>blobs[i].color}
})()
const liquidGlassOn=(function liquidGlassWebGL(){
  // WebGL 直接计算液态背景，并画出玻璃面板：边缘透镜折射、色散、轻度磨砂、高光和投影
  // 不支持 WebGL 或系统要求降低透明度时，用 2D 兜底画法和 CSS 玻璃
  if(matchMedia("(prefers-reduced-transparency: reduce)").matches) return false
  const canvas=document.createElement("canvas")
  canvas.className="lg-canvas"
  canvas.setAttribute("aria-hidden","true")
  const gl=canvas.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:"low-power"})
  if(!gl) return false
  const vertSrc=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`
  const fragSrc=`
precision highp float;
uniform vec2 uRes;
uniform float uDpr;
uniform vec2 uView;
uniform vec3 uBase[2];
uniform vec3 uBlob[16];
uniform vec3 uBlobCol[16];
uniform vec4 uPanel[2];
uniform float uPanelR[2];
uniform int uPanelN;
uniform vec4 uTint;
const float SAT=1.1;
const float FROST=2.5;
const float SPEC=.3;
const float SHEEN=.04;
const vec4 SHADOW=vec4(0.,0.,0.,.25);
const float BEZEL=24.;
const float REFRACT=28.;
const float DISPERSE=.15;
const vec2 LIGHT=vec2(-.61,-.79);
// 液态背景：metaball 场 f=Σr²/d²，f=1 处为液面。用 t=1/√f 估算到液面的距离（px）：
// 单团液体时 t=d/r，(1-t)/|∇t| 正好等于 r-d，在液体中心也准确。边缘按这个距离抗锯齿，
// blur 加宽边缘，等效于磨砂。颜色按各团的贡献平滑混合
vec3 liquid(vec2 p,float blur){
  float f=0.;
  vec2 g=vec2(0.);
  vec3 c=vec3(0.);
  float w=0.;
  for(int i=0;i<16;i++){
    vec2 dv=p-uBlob[i].xy;
    float d2=max(dot(dv,dv),1.);
    float k=uBlob[i].z*uBlob[i].z/d2;
    f+=k;
    g-=2.*k/d2*dv;
    c+=uBlobCol[i]*k*k;
    w+=k*k;
  }
  c/=max(w,1e-6);
  float gn=max(length(g),1e-6);
  float t=inversesqrt(max(f,1e-6));
  float d=(1.-t)/max(.5*t*t*t*gn,1e-6);
  vec3 back=mix(uBase[0],uBase[1],clamp(p.y/uView.y,0.,1.));
  // 液体表面：越往里越亮一点；迎光的边缘有一道细高光
  vec3 lc=c*(.9+.18*clamp(d/90.,0.,1.));
  lc+=.4*exp(-max(d,0.)/(3.+blur))*max(dot(-g/gn,LIGHT),0.);
  return mix(back,min(lc,1.),smoothstep(-.6-blur,.6+blur,d));
}
float sdBox(vec2 q,vec2 b,float r){
  vec2 k=abs(q)-b+r;
  return length(max(k,0.))+min(max(k.x,k.y),0.)-r;
}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  vec3 col=liquid(p,0.);
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    float ds=sdBox(p-uPanel[i].xy-vec2(0.,12.),uPanel[i].zw,uPanelR[i]);
    col=mix(col,SHADOW.rgb,(1.-smoothstep(-14.,30.,ds))*SHADOW.a);
  }
  for(int i=0;i<2;i++){
    if(i>=uPanelN) break;
    vec2 q=p-uPanel[i].xy;
    vec2 b=uPanel[i].zw;
    float r=uPanelR[i];
    float d=sdBox(q,b,r);
    if(d>1.) continue;
    vec2 n=normalize(vec2(sdBox(q+vec2(.5,0.),b,r)-sdBox(q-vec2(.5,0.),b,r),sdBox(q+vec2(0.,.5),b,r)-sdBox(q-vec2(0.,.5),b,r))+1e-6);
    float e=1.-clamp(-d/BEZEL,0.,1.);
    float lens=e*e;
    // 透镜：边缘光线向内弯折，看到的是更靠里的内容（放大），三色错开形成色散
    vec2 off=-n*REFRACT*lens;
    vec3 g;
    if(lens>.001){
      g.r=liquid(p+off*(1.+DISPERSE),FROST).r;
      g.g=liquid(p+off,FROST).g;
      g.b=liquid(p+off*(1.-DISPERSE),FROST).b;
    }else{
      g=liquid(p,FROST);
    }
    float l=dot(g,vec3(.2126,.7152,.0722));
    g=clamp(mix(vec3(l),g,SAT),0.,1.);
    g=mix(g,uTint.rgb,uTint.a);
    g+=SHEEN*(1.-clamp(length((q-vec2(-.64*b.x,-b.y))/(vec2(2.4,1.7)*b))/.55,0.,1.));
    // 高光：迎光的左上边缘最亮，右下边缘有反光
    g+=SPEC*pow(e,3.)*(max(dot(n,LIGHT),0.)+.6*max(dot(n,-LIGHT),0.));
    g=mix(g,vec3(1.),SPEC*.1*lens);
    col=mix(col,clamp(g,0.,1.),clamp(.5-d*uDpr,0.,1.));
  }
  gl_FragColor=vec4(col,1.);
}`
  function compile(type,src){
    const s=gl.createShader(type)
    gl.shaderSource(s,src)
    gl.compileShader(s)
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.warn("液体玻璃着色器编译失败:",gl.getShaderInfoLog(s))
      return null
    }
    return s
  }
  const vs=compile(gl.VERTEX_SHADER,vertSrc)
  const fs=compile(gl.FRAGMENT_SHADER,fragSrc)
  if(!vs||!fs) return false
  const prog=gl.createProgram()
  gl.attachShader(prog,vs)
  gl.attachShader(prog,fs)
  gl.linkProgram(prog)
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return false
  gl.useProgram(prog)
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW)
  const aLoc=gl.getAttribLocation(prog,"a")
  gl.enableVertexAttribArray(aLoc)
  gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0)
  const u={}
  ;["uRes","uDpr","uView","uBase","uBlob","uBlobCol","uPanel","uPanelR","uPanelN","uTint"].forEach(name=>{
    u[name]=gl.getUniformLocation(prog,name)
  })
  const panels=[...document.querySelectorAll(".glass")].slice(0,2)
  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)")
  let raf=0
  let lastDraw=0
  function rgba(s){
    const v=(s.match(/[\d.]+/g)||[]).map(Number)
    return [(v[0]||0)/255,(v[1]||0)/255,(v[2]||0)/255,v.length>3?v[3]:1]
  }
  function readTheme(){
    const base=liquidBackdrop.base()
    const colors=liquidBackdrop.colors()
    gl.uniform3fv(u.uBase,[...base[0],...base[base.length-1]])
    gl.uniform3fv(u.uBlobCol,liquidBackdrop.shapes().flatMap((s,i)=>colors[liquidBackdrop.blobColor(i)]))
    gl.uniform4f(u.uTint,...rgba(getComputedStyle(document.documentElement).getPropertyValue("--glass-bg")))
  }
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2)
    canvas.width=Math.round(canvas.clientWidth*dpr)
    canvas.height=Math.round(canvas.clientHeight*dpr)
    gl.viewport(0,0,canvas.width,canvas.height)
    gl.uniform2f(u.uRes,canvas.width,canvas.height)
    gl.uniform1f(u.uDpr,dpr)
    gl.uniform2f(u.uView,canvas.clientWidth,canvas.clientHeight)
    gl.uniform1iv(u.uPanelN,[panels.length])
    gl.uniform1fv(u.uPanelR,panels.map(el=>parseFloat(getComputedStyle(el).borderTopLeftRadius)||0).concat([0,0]).slice(0,2))
    draw(performance.now())
  }
  function draw(now){
    liquidBackdrop.step(now)
    gl.uniform3fv(u.uBlob,liquidBackdrop.shapes().flat())
    gl.uniform4fv(u.uPanel,panels.flatMap(el=>{
      const r=el.getBoundingClientRect()
      return [r.left+r.width/2,r.top+r.height/2,r.width/2,r.height/2]
    }).concat([0,0,0,0,0,0,0,0]).slice(0,8))
    gl.drawArrays(gl.TRIANGLES,0,3)
    lastDraw=now
  }
  // 液体流得很慢，30 帧足够，省电
  function loop(now){
    raf=requestAnimationFrame(loop)
    if(now-lastDraw>=33) draw(now)
  }
  function start(){
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop)
  }
  function stop(){
    cancelAnimationFrame(raf)
    raf=0
  }

    e.preventDefault()
    stop()
    canvas.remove()
    document.documentElement.classList.remove("lg-webgl")

  })
  document.body.insertBefore(canvas,document.body.firstChild)
  readTheme()
  resize()
  document.documentElement.classList.add("lg-webgl")
  start()

  if(window.visualViewport) visualViewport.addEventListener("resize",resize)
  if(window.ResizeObserver) new ResizeObserver(()=>draw(performance.now())).observe(document.querySelector(".container"))
  reduceMotion.addEventListener("change",()=>{
    stop()
    start()
    draw(performance.now())
  })
  return true
})()
if(!liquidGlassOn) liquidBackdrop.start()

document.getElementById("save-btn").onclick=saveAsImage
