<!DOCTYPE html> <!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN"> <!-- 根元素，页面语言为简体中文 -->
<head> <!-- 文档头：放元信息和样式 -->
<meta charset="UTF-8"> <!-- 字符编码使用 UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"> <!-- 视口：宽度等于设备宽度，禁止缩放，内容延伸到刘海和圆角区域 -->
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)"> <!-- 浅色模式下浏览器状态栏的颜色 -->
<meta name="theme-color" content="#07081a" media="(prefers-color-scheme: dark)"> <!-- 深色模式下浏览器状态栏的颜色 -->
<!-- 添加到主屏幕：以独立 App 的样子全屏打开，有自己的图标和名字 -->
<meta name="apple-mobile-web-app-capable" content="yes"> <!-- 从 iPhone 主屏幕打开时全屏显示，不显示 Safari 的地址栏和工具栏（iOS 16.3 及更早靠这一项） -->
<meta name="mobile-web-app-capable" content="yes"> <!-- 同上，标准写法（安卓 Chrome 等） -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- 状态栏透明，液体背景一直延伸到状态栏下面 -->
<meta name="apple-mobile-web-app-title" content="随机选号"> <!-- 主屏幕图标下面显示的名字 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"> <!-- iPhone、iPad 主屏幕图标（180×180） -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"> <!-- 浏览器标签页图标 -->
<link rel="manifest" href="manifest.webmanifest"> <!-- 网页应用清单：名字、图标、全屏显示（iOS 16.4 起和安卓都读它） -->
<script> // 主屏幕 App 底部白边修正（放在页面最前面，第一帧就生效）
  // iOS 26 主屏幕 App 的问题（WebKit Bug 301108）：页面本身比屏幕矮时，iOS 把可视区域缩短一个状态栏的高度，
  // 固定定位的背景也画到那条边为止，底部露出一条与状态栏等高的空白（灵动岛机型 59px）。
  // 页面原来是 height:100%，而 100% 在这种情况下正好少了状态栏的高度，所以页面“比屏幕矮”。
  // 解决：在 iOS 主屏幕 App 里让页面至少和屏幕一样高（--screen-h，用 JS 量屏幕高度，
  // 不用 env(safe-area-inset-top)：iOS 26.1 起它可能返回 0）。见 html.ios-app 样式
  (function fitScreen(){ // 立即执行：判断是否为主屏幕 App，并在尺寸变化时更新
    const root=document.documentElement // 根元素
    const ua=navigator.userAgent // 浏览器标识
    const isIOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1) // 是否 iOS / iPadOS（iPadOS 伪装成 Mac，用触摸点数区分）
    const probe=document.createElement("div") // 用来量 CSS 的 100lvh 实际有多高
    probe.style.cssText="position:fixed;top:0;left:0;width:0;height:100vh;height:100lvh;visibility:hidden;pointer-events:none" // 不可见、不占布局；不支持 lvh 时用 vh
    function update(){ // 更新
      if(!isIOS) return // 只处理 iOS
      const landscape=innerWidth>innerHeight // 是否横屏
      const screenH=landscape?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height) // 当前方向下屏幕的高度（iOS 的 screen 尺寸固定按竖屏给出）
      root.appendChild(probe) // 放进页面才能量
      const view=Math.min(innerHeight,probe.offsetHeight||innerHeight) // 视口高度：CSS 和 JS 给的取较小者
      probe.remove() // 量完移除
      const gap=screenH-view // 屏幕比视口高出的部分
      // 三种迹象任一出现就当作主屏幕 App：系统标记、显示模式、视口正好比屏幕矮一个状态栏（1～80px，再大是 Safari 工具栏或 iPad 分屏）
      const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches // 系统给出的主屏幕 App 标记
      // 一旦认定就不再撤销：页面撑高后缺口会消失，撤销会让页面又变矮、来回跳
      if(standalone||(gap>0&&gap<=80)) root.classList.add("ios-app") // 认定为主屏幕 App
      root.style.setProperty("--screen-h",`${screenH}px`) // 当前方向的屏幕高度
      root.style.setProperty("--screen-extra",`${gap>0&&gap<=80?gap:0}px`) // 视口比屏幕矮的部分：固定背景层再往下多铺这么多（保险）
    }
    update() // 先算一次
    addEventListener("resize",update) // 旋转屏幕等尺寸变化时重新计算
  })() // 立即执行函数结束
</script> <!-- 主屏幕 App 底部白边修正结束 -->
<title>双色球 / 大乐透 随机选号</title> <!-- 页面标题 -->
<style> /* 页面样式开始 */
:root { /* 全局变量（浅色模式的默认值） */
  /* 浅色、深色跟随系统切换 */
  color-scheme: light dark; /* 让浏览器自带控件也跟随系统深浅模式 */
  --bg-page:#eef2ff; /* 页面加载前和背景画布出现前的底色 */
  --bg-canvas:linear-gradient(180deg,#f7f3ff 0%,#eef2ff 100%); /* 页面底层的渐变底色 */
  --text-main:#111827; /* 主要文字颜色 */
  --text-sub:rgba(17,24,39,.78); /* 次要文字颜色（半透明）：分段控件未选中的选项，在彩色液体上也要看得清 */

  --red:#ef4444; /* 红球主色 */
  --red-lo:#d22f2f; /* 红球暗部色 */
  --blue-hi:#8ab8ff; /* 蓝球高光色 */
  --blue:#3b82f6; /* 蓝球主色 */
  --blue-lo:#2563d9; /* 蓝球暗部色 */
  /* 液态背景：十种液体颜色 */
  --liquid-1:#5b8cff; /* 液体颜色 1：蓝 */
  --liquid-2:#a35bff; /* 液体颜色 2：紫 */
  --liquid-3:#ff6fb1; /* 液体颜色 3：粉 */
  --liquid-4:#ff9f45; /* 液体颜色 4：橙 */
  --liquid-5:#3fd0c9; /* 液体颜色 5：青 */
  --liquid-6:#7b6cff; /* 液体颜色 6：靛 */
  --liquid-7:#ffd166; /* 液体颜色 7：金黄 */
  --liquid-8:#5ee6a0; /* 液体颜色 8：薄荷绿 */
  --liquid-9:#ff7a7a; /* 液体颜色 9：珊瑚红 */
  --liquid-10:#4cc9ff; /* 液体颜色 10：天蓝 */
  /* 整屏液体的调色：颜色倍率 混白比例 */
  --liquid-tone:1 .12; /* 浅色：颜色倍率 1，混入 12% 白色：柔和但仍饱满，玻璃的折射和彩边才看得出来（混白太多整屏发粉、玻璃显得发白） */
  --title-glow:0 0 14px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.8); /* 标题外发光：白色光晕让标题在彩色液体上更清楚 */
  --label-glow:0 0 8px rgba(255,255,255,.8),0 0 2px rgba(255,255,255,.6); /* 分段控件文字的光晕：液体颜色较深时也看得清 */
  /* 液体玻璃材质（iOS 27 通透）：几乎全透，靠边缘高光、暗边和折射勾出轮廓 */
  --glass-bg:rgba(255,255,255,.03); /* 玻璃底色：3% 白，几乎全透明 */
  --glass-bg-strong:rgba(255,255,255,.55); /* 较实的玻璃底色（普通按钮用） */
  --glass-blur:blur(4px) saturate(140%) brightness(1.02); /* CSS 玻璃的背景模糊、提饱和、提亮（不用 WebGL 时） */
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%); /* 玻璃左上角的镜面反光 */
  --glass-rim:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.42) 20%,rgba(255,255,255,.22) 42%,rgba(255,255,255,.22) 62%,rgba(255,255,255,.42) 82%,rgba(255,255,255,.9)); /* 玻璃边缘高光描边的渐变：左上和右下最亮，中段保留 22% 白，右上角和左下角的描边不会断开；整体不用纯白，浅背景上不显得发白 */
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1); /* 玻璃外圈深色细边：两层 0.5px 模糊阴影叠加 */
  --glass-border:rgba(15,23,42,.16); /* 大面板的深色细边颜色（用 border 画） */
  --glass-inset: /* 玻璃内侧高光（多行取值，下面每行一层） */
    inset 0 1px 0 rgba(255,255,255,.95), /* 顶部一条 1px 白色亮线 */
    inset 2px 2px 4px rgba(255,255,255,.6), /* 左上内侧透镜光带 */
    inset -2px -2px 4px rgba(255,255,255,.4), /* 右下内侧透镜光带 */
    inset 0 0 16px rgba(255,255,255,.2); /* 内侧整圈柔光 */
  --glass-shadow: /* 小控件的完整玻璃阴影（多行取值） */
    var(--glass-edge), /* 深色细边 */
    var(--glass-inset), /* 内侧高光 */
    0 12px 32px rgba(31,41,95,.14), /* 远处柔和投影 */
    0 2px 6px rgba(31,41,95,.08); /* 近处清晰投影 */
  /* WebGL 玻璃：磨砂半径 高光 顶部反光 提亮；玻璃底色；边缘反光的取色；面板投影颜色 */
  --gl-look:2 .3 .035 1; /* 浅色：磨砂半径 2、高光 0.3、顶部反光 0.035、不提亮（提亮会让玻璃像一层乳白膜） */
  --gl-tint:rgba(20,22,40,.03); /* 浅色 WebGL 玻璃底色：3% 深蓝灰，与深色模式同一思路，玻璃略深于背景，显得通透 */
  --gl-sheen:.6; /* 浅色：边缘反光 60% 取玻璃里背景的颜色（在浅背景上纯白反光会把边缘洗成白雾） */
  --gl-shadow:rgba(40,30,90,.08); /* WebGL 画的面板投影颜色 */
  --rim-w:1.5px; /* 高光描边宽度 */
  --glow:rgba(255,255,255,.8); /* 触摸发光的颜色 */
  --tint-primary:rgba(79,70,229,.9); /* 主按钮的靛蓝底色 */
  --thumb-bg:rgba(255,255,255,.88); /* 分段控件滑块的底色 */
  --thumb-lens:rgba(255,255,255,.4); /* 按住滑块时的透镜底色（更透） */
  /* 保存弹窗：遮罩、玻璃底色、背景模糊、提示文字 */
  --overlay-bg:rgba(15,23,42,.25); /* 保存弹窗遮罩的颜色 */
  --glass-modal:rgba(255,255,255,.22); /* 保存弹窗的玻璃底色 */
  --modal-filter:blur(12px) saturate(160%) brightness(1.08); /* 保存弹窗的背景模糊、提饱和、提亮 */
  --modal-tip:rgba(17,24,39,.78); /* 弹窗提示文字颜色 */
  --modal-tip-shadow:0 1px 6px rgba(255,255,255,.7); /* 弹窗提示文字的光晕 */
  /* 导出图片：背景、画布底色、标题颜色 */
  --export-bg:linear-gradient(160deg,#ffffff 0%,#f4f2ff 55%,#eef3ff 100%); /* 导出图片的背景渐变 */
  --export-base:#f4f2ff; /* 导出图片的画布底色 */
  --export-title:#111827; /* 导出图片标题颜色 */
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --screen-extra:0px; /* iOS 主屏幕 App 里屏幕比视口高出的部分（由页面开头的脚本计算），背景层多延伸这么多，底部不露白边 */
  --strip:#a99af0; /* iOS 主屏幕 App 底部系统色条的颜色（浅色）：中紫，与液体和靛蓝按钮协调，不显白 */
  --pad:10px; /* 卡片内边距 */
  --ctl-h:46px; /* 按钮、分段控件的高度 */
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad)); /* 卡片外圆角 = 控件半高 + 内边距，内外圆角同心 */
}

    --export-bg:linear-gradient(160deg,#151b3d 0%,#0b1026 55%,#1c1033 100%); /* 深色导出图片背景渐变 */

/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) { /* 系统开启“降低透明度”时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#ffffff; /* 玻璃改为白色实底 */
    --glass-bg-strong:#ffffff; /* 较实的玻璃也改为白色实底 */
    --glass-modal:#ffffff; /* 弹窗改为白色实底 */
    --glass-blur:none; /* 不做背景模糊 */
    --glass-spec:none; /* 去掉镜面反光 */
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) { /* 降低透明度且为深色模式时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#1e2333; /* 玻璃改为深色实底 */
    --glass-bg-strong:#1e2333; /* 较实的玻璃改为深色实底 */
    --glass-modal:#1e2333; /* 弹窗改为深色实底 */
  }
}
* {box-sizing:border-box;} /* 所有元素的宽高包含内边距和边框 */
  html, /* 根元素和 */
  body { /* 页面主体的共同样式 */
  margin: 0; /* 去掉默认外边距 */
  padding: 0; /* 去掉默认内边距 */

  (function disableZoom() { // 立即执行：禁止页面缩放

;(function liquidGlassTouchLight(){ // 立即执行：触摸发光

    lit.forEach(el=>el.classList.remove("lit")) // 去掉 lit 类

    release() // 先熄灭上一次的
    const ctl=e.target.closest("button,.segmented") // 找到按下的按钮或分段控件
    if(!ctl) return // 不是控件就不处理
    const isSeg=ctl.matches(".segmented") // 是不是分段控件
    if(isSeg&&ctl.querySelector("input").disabled) return // 分段控件禁用时不发光
    if(ctl.disabled) return // 按钮禁用时不发光

    lit=[surface] // 记入列表
    const panel=ctl.closest(".glass") // 所在的玻璃面板
    if(panel) lit.push(panel) // 面板也一起带亮
    lit.forEach(el=>{ // 每个要亮的元素
      place(el,e) // 光晕移到手指位置
      el.classList.add("lit") // 亮起

// 取 [0,max) 内的无偏随机整数：crypto 生成 32 位随机数，丢弃尾部不能整除的部分（拒绝采样）
const randomWord=new Uint32Array(1) // 存放一个 32 位随机数的缓冲区，重复使用
function randomIntUnbiased(max){ // 取 [0,max) 内的无偏随机整数
  if(!(max>0&&max<=0x100000000)) throw new Error("max must be in (0, 2^32]") // max 必须在 1 到 2^32 之间
  const limit=0x100000000-0x100000000%max // 不超过 2^32 的最大的 max 整数倍，超出部分会造成偏差
  let x // 随机数
  do{ // 循环
    crypto.getRandomValues(randomWord) // 用浏览器的加密随机数生成器填充
    x=randomWord[0] // 取出这个 32 位随机数
  }while(x>=limit) // 落在尾部不能整除的区间就重取
  return x%max // 取余，得到 [0,max) 的无偏结果
}
function randomNums(min,max,count){ // 从 min 到 max 中随机取 count 个不重复的数，从小到大排序
  const pool=Array.from({length:max-min+1},(_,i)=>i+min) // 号码池：min, min+1, ..., max
  for(let i=pool.length-1;i>0;i--){ // 从后往前洗牌（Fisher–Yates）
    const j=randomIntUnbiased(i+1) // 在 [0,i] 中随机选一个位置
    ;[pool[i],pool[j]]=[pool[j],pool[i]] // 与当前位置交换
  }
  return pool.slice(0,count).sort((a,b)=>a-b) // 取前 count 个并从小到大排序
}

// ===== 深度思考：用神经网络学习开奖历史选号 =====
// 开奖是独立随机事件，任何号码组合的中奖概率都一样，历史统计不能提高中奖概率。
// 这里做的是：在页面里用开奖历史现场训练两个小型神经网络（红球、蓝球各一个），按网络给每个号码的评分加权抽取，
// 再筛掉历史上很少出现的组合形态（和值、奇偶、大小、区间、连号），并避开历史上开出过的头奖组合。每次结果都不同，仅供参考和娱乐
const DEEP_RULES={ // 两种彩票的规则
  ssq:{name:"双色球",red:[6,33],blue:[1,16],zones:[[1,11],[12,22],[23,33]],maxShare:3}, // 双色球：6 红（1～33）+ 1 蓝（1～16），红球分三区；5 注之间最多共用 3 个红球
  dlt:{name:"大乐透",red:[5,35],blue:[2,12],zones:[[1,12],[13,24],[25,35]],maxShare:2}, // 大乐透：5 红（1～35）+ 2 蓝（1～12）；最多共用 2 个红球
}
const NN={features:10,hidden:16,epochs:6,train:1100,valid:100,sharp:3} // 神经网络设置：每个号码 10 项特征、隐藏层 16 个神经元、训练 6 轮、用 1100 期训练、近 100 期验证、抽号时把评分差距放大（3 次方）
const historyCache={} // 已读取的开奖历史：彩种 → 数据
async function loadHistory(type){ // 读取开奖历史（data/ssq.json、data/dlt.json，每期：[期号, 日期, 红球, 蓝球]，新的在前）
  if(historyCache[type]) return historyCache[type] // 读过就直接用
  const response=await fetch(`data/${type}.json`,{cache:"no-cache"}) // 向服务器确认最新版本
  if(!response.ok) throw new Error(`HTTP ${response.status}`) // 读取失败
  const data=await response.json() // 解析 JSON
  if(!Array.isArray(data.draws)||data.draws.length<50) throw new Error("数据不完整") // 数据太少
  historyCache[type]=data // 缓存
  return data // 返回
}
function randomFloat(){ // [0,1) 内的随机小数（用加密随机数）
  return randomIntUnbiased(0x100000000)/0x100000000 // 32 位随机整数除以 2^32
}
function weightedPick(weights,count){ // 按权重不放回地抽 count 个号码（weights[n] 是号码 n 的权重），从小到大返回
  const pool=weights.map((w,n)=>[n,w]).filter(([n])=>n>0) // 号码和权重（下标 0 不用）
  const picked=[] // 抽中的号码
  while(picked.length<count){ // 抽够为止
    const total=pool.reduce((sum,[,w])=>sum+w,0) // 剩余号码的权重之和
    let r=randomFloat()*total // 在总权重里随机落一个点
    let i=0 // 落点所在的号码
    while(i<pool.length-1&&(r-=pool[i][1])>=0) i++ // 依次减去权重，找到落点所在的号码
    picked.push(pool[i][0]) // 抽中
    pool.splice(i,1) // 不放回
  }
  return picked.sort((a,b)=>a-b) // 从小到大
}
function nnTrainSpan(total){ // 训练用几期：最多 1100 期，前面至少留 100 期用来算特征
  return Math.max(100,Math.min(NN.train,total-NN.valid-100)) // 期数
}
function nnSamples(draws,col,k,max){ // 把开奖历史整理成样本：每一期的每个号码一个样本（10 项特征 → 这一期有没有开出）
  const F=NN.features // 特征个数
  const ch=draws.slice().reverse() // 按时间从早到晚排列
  const T=ch.length // 总期数
  const valid=NN.valid // 验证期数
  const train=nnTrainSpan(T) // 训练期数
  const start=T-train-valid // 第一个样本所在的期
  const W=max+1 // 每期一行（下标 0 不用）
  const pre=new Int32Array((T+1)*W) // 前缀和：pre[t*W+n] 是前 t 期里号码 n 开出的次数
  for(let t=0;t<T;t++){ // 每一期
    for(let n=1;n<=max;n++) pre[(t+1)*W+n]=pre[t*W+n] // 先抄上一行
    for(const n of ch[t][col]) pre[(t+1)*W+n]++ // 这一期开出的号码加一
  }
  const count=(t,w,n)=>pre[t*W+n]-pre[Math.max(0,t-w)*W+n] // 第 t 期之前 w 期里号码 n 开出的次数
  const expect=w=>w*k/max // w 期里每个号码平均开出的次数
  const rows=(T-start+1)*max // 样本数：训练 + 验证 + 最后一组（下一期，用来预测）
  const X=new Float32Array(rows*F) // 特征
  const Y=new Uint8Array(rows) // 答案：这一期开出了就是 1
  const last=new Int32Array(W).fill(-1) // 每个号码最近一次开出的期
  for(let t=0;t<=T;t++){ // 每一期（t=T 是还没开奖的下一期）
    if(t>=start) for(let n=1;n<=max;n++){ // 进入样本范围后的每个号码
      const r=(t-start)*max+n-1 // 样本序号
      const o=r*F // 这个样本的特征从这里开始
      const all=pre[t*W+n] // 之前一共开出几次
      const gap=last[n]<0?t:t-1-last[n] // 遗漏：已经连续几期没开出
      X[o]=count(t,5,n)/expect(5) // 近 5 期热度（1 为平均）
      X[o+1]=count(t,10,n)/expect(10) // 近 10 期热度
      X[o+2]=count(t,30,n)/expect(30) // 近 30 期热度
      X[o+3]=count(t,100,n)/expect(100) // 近 100 期热度
      X[o+4]=all/expect(t) // 长期频率
      X[o+5]=Math.min(gap*Math.max(all,1)/t,5) // 遗漏 ÷ 平均间隔（最多按 5 算）
      X[o+6]=Math.min(gap,60)/60 // 遗漏期数（最多按 60 算）
      X[o+7]=t>=1&&ch[t-1][col].includes(n)?1:0 // 上一期开出过
      X[o+8]=t>=2&&ch[t-2][col].includes(n)?1:0 // 上上期开出过
      X[o+9]=(n-1)/(max-1) // 号码本身的大小
      Y[r]=t<T&&ch[t][col].includes(n)?1:0 // 这一期有没有开出
    }
    if(t<T) for(const n of ch[t][col]) last[n]=t // 记下最近开出的期
  }
  const nTrain=train*max // 训练样本数（排在最前面）
  for(let f=0;f<F;f++){ // 每项特征按训练样本标准化：减平均、除标准差，网络更好学
    let mean=0,sq=0 // 平均值、平方和
    for(let i=0;i<nTrain;i++) mean+=X[i*F+f] // 求和
    mean/=nTrain // 平均值
    for(let i=0;i<nTrain;i++) sq+=(X[i*F+f]-mean)**2 // 平方和
    const sd=Math.sqrt(sq/nTrain)||1 // 标准差（全一样时按 1 算）
    for(let i=0;i<rows;i++) X[i*F+f]=(X[i*F+f]-mean)/sd // 标准化全部样本
  }
  return {X,Y,k,max,train,valid,nTrain,predictAt:(T-start)*max} // 样本、号码规则、训练和验证期数、下一期样本的位置
}
async function trainNet(s,onEpoch,sliceMs=12){ // 训练一个小型神经网络：10 个输入 → 16 个神经元（tanh）→ 1 个输出（这个号码这一期开出的概率）；在主线程上每算 sliceMs 毫秒让一下
  const F=NN.features,H=NN.hidden // 输入个数、隐藏层神经元个数
  const W2=H*F,B1=W2+H,B2=B1+H,size=B2+1 // 参数排布：[输入→隐藏的权重 | 隐藏→输出的权重 | 隐藏层偏置 | 输出偏置]，共 size 个
  const w=new Float64Array(size),m=new Float64Array(size),v=new Float64Array(size),g=new Float64Array(size) // 参数、Adam 的一阶和二阶动量、梯度
  for(let i=0;i<B1;i++) w[i]=(randomFloat()*2-1)*Math.sqrt(6/(i<W2?F+H:H+1)) // 权重随机起步（Xavier 初始化），所以每次训练出的网络都略有不同
  const base=s.k/s.max // 平均开出概率
  w[B2]=Math.log(base/(1-base)) // 输出偏置从平均概率起步
  const X=s.X,h=new Float64Array(H) // 特征、隐藏层输出
  const forward=i=>{ // 前向计算第 i 个样本，返回开出的概率
    let z=w[B2] // 输出层从偏置开始
    for(let j=0;j<H;j++){ // 每个隐藏神经元
      let a=w[B1+j] // 偏置
      for(let f=0;f<F;f++) a+=w[j*F+f]*X[i*F+f] // 加权求和
      h[j]=Math.tanh(a) // 激活
      z+=w[W2+j]*h[j] // 汇总到输出
    }
    return 1/(1+Math.exp(-z)) // sigmoid 转成概率
  }
  const order=Array.from({length:s.nTrain},(_,i)=>i) // 训练样本的顺序
  const BATCH=128,LR=.005 // 每批样本数、学习率
  let step=0,loss=0,slice=performance.now() // Adam 步数、本轮误差、这一段计算的开始时间
  for(let e=1;e<=NN.epochs;e++){ // 每一轮
    for(let i=order.length-1;i>0;i--){ // 打乱样本顺序
      const j=randomIntUnbiased(i+1) // 随机位置
      ;[order[i],order[j]]=[order[j],order[i]] // 交换
    }
    loss=0 // 本轮误差清零
    for(let b=0;b<order.length;b+=BATCH){ // 每一批
      g.fill(0) // 梯度清零
      const end=Math.min(b+BATCH,order.length) // 这一批的结尾
      for(let q=b;q<end;q++){ // 批里的每个样本
        const i=order[q],p=forward(i),y=s.Y[i] // 样本、预测概率、答案
        loss-=Math.log(Math.max(y?p:1-p,1e-12)) // 交叉熵误差
        const dz=p-y // 输出层的误差信号
        g[B2]+=dz // 输出偏置的梯度
        for(let j=0;j<H;j++){ // 反向传播到每个隐藏神经元
          g[W2+j]+=dz*h[j] // 隐藏→输出权重的梯度
          const dh=dz*w[W2+j]*(1-h[j]*h[j]) // 隐藏神经元的误差信号（tanh 的导数）
          g[B1+j]+=dh // 隐藏层偏置的梯度
          for(let f=0;f<F;f++) g[j*F+f]+=dh*X[i*F+f] // 输入→隐藏权重的梯度
        }
      }
      step++ // Adam 步数加一
      const n=end-b,c1=1-.9**step,c2=1-.999**step // 批大小、动量的偏差修正
      for(let p=0;p<size;p++){ // 用 Adam 更新每个参数
        const gr=g[p]/n // 平均梯度
        m[p]=.9*m[p]+.1*gr // 一阶动量
        v[p]=.999*v[p]+.001*gr*gr // 二阶动量
        w[p]-=LR*(m[p]/c1)/(Math.sqrt(v[p]/c2)+1e-8) // 更新
      }
      if(performance.now()-slice>sliceMs){ // 连续算了 sliceMs 毫秒
        await new Promise(r=>setTimeout(r)) // 让一下，液体动画和页面不卡
        slice=performance.now() // 重新计时
      }
    }
    loss/=order.length // 本轮平均误差
    await onEpoch(e,loss) // 报告进度
    slice=performance.now() // 重新计时
  }
  return {forward,loss} // 网络（前向计算）和最后一轮的误差
}
function nnResult(net,s){ // 用训练好的网络：检验近 100 期的命中，并给下一期每个号码打分
  const {k,max}=s // 每期开出几个、号码范围
  const probsAt=base=>Array.from({length:max},(_,n)=>net.forward(base+n)) // 某一期每个号码的概率
  let hits=0 // 验证期里的命中个数
  for(let t=0;t<s.valid;t++){ // 验证的每一期（网络训练时没见过）
    const base=s.nTrain+t*max // 这一期样本的位置
    const p=probsAt(base) // 网络给的概率
    const top=p.map((x,n)=>n).sort((x,y)=>p[y]-p[x]).slice(0,k) // 网络最看好的 k 个号码
    hits+=top.filter(n=>s.Y[base+n]).length // 其中真正开出的个数
  }
  const probs=[0,...probsAt(s.predictAt)] // 下一期每个号码的概率（下标就是号码）
  const mean=k/max // 平均概率
  return {probs,weights:probs.map((p,n)=>n?(p/mean)**NN.sharp:0),hits:hits/s.valid} // 概率、抽号权重（差距放大）、验证期平均命中个数
}
let nnWorkerUrl=null // 后台线程的脚本地址（只生成一次）
function nnWorkerURL(){ // 把上面几个函数拼成后台线程（Web Worker）的脚本：训练在后台跑，液体动画完全不受影响
  if(!nnWorkerUrl) nnWorkerUrl=URL.createObjectURL(new Blob([[ // 生成脚本地址
    `const NN=${JSON.stringify(NN)}`, // 网络设置
    "const randomWord=new Uint32Array(1)", // 随机数缓冲区
    randomIntUnbiased,randomFloat,nnTrainSpan,nnSamples,trainNet,nnResult, // 直接用页面里同一份函数代码
    `let resume=null
onmessage=async event=>{
  if(event.data==="next"){resume&&resume();return}
  const {draws,col,k,max}=event.data
  const s=nnSamples(draws,col,k,max)
  const net=await trainNet(s,(epoch,loss)=>new Promise(r=>{resume=r;postMessage({epoch,loss})}),1e9)
  postMessage({done:true,loss:net.loss,...nnResult(net,s)})
}`, // 收到开奖数据就训练；每轮报告进度，等页面说“next”再继续
  ].join("\n")],{type:"text/javascript"})) // 脚本类型
  return nnWorkerUrl // 返回地址
}
async function runNet(draws,col,k,max,onEpoch){ // 训练一个网络并给下一期打分：优先放到后台线程，不支持时在主线程上分段算
  const onMainThread=async()=>{ // 在主线程上训练
    const s=nnSamples(draws,col,k,max) // 样本
    const net=await trainNet(s,onEpoch) // 训练
    return {...nnResult(net,s),loss:net.loss} // 结果
  }
  let worker // 后台线程
  try{ worker=new Worker(nnWorkerURL()) }catch(error){ return onMainThread() } // 创建不了就在主线程上算
  return new Promise((resolve,reject)=>{ // 等后台线程算完
    worker.onmessage=async event=>{ // 收到后台线程的消息
      const d=event.data // 消息内容
      if(d.done){ worker.terminate(); resolve(d); return } // 训练完成：关掉线程，返回结果
      try{ await onEpoch(d.epoch,d.loss) }catch(error){ worker.terminate(); reject(error); return } // 显示这一轮的进度
      worker.postMessage("next") // 让后台线程继续下一轮
    }
    worker.onerror=event=>{ // 后台线程出错（例如浏览器不允许）
      event.preventDefault() // 不在控制台报错
      worker.terminate() // 关掉线程
      onMainThread().then(resolve,reject) // 改在主线程上算
    }
    worker.postMessage({draws,col,k,max}) // 把开奖数据交给后台线程
  })
}
function commonSet(values){ // 历史上最常见的取值，合计占到 85% 为止
  const counts={} // 每个取值出现的次数
  values.forEach(v=>{counts[v]=(counts[v]||0)+1}) // 计数
  const order=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]) // 按次数从多到少
  const keep=new Set() // 保留的取值
  let covered=0 // 已覆盖的期数
  for(const v of order){ // 从最常见的开始
    keep.add(v) // 保留
    covered+=counts[v] // 累计
    if(covered>=values.length*.85) break // 覆盖 85% 就够了
  }
  return keep // 返回
}
function shapeOf(reds,rule){ // 一注红球的形态：和值、奇数个数、大号个数、每区个数、最长连号
  const half=rule.red[1]/2 // 大小分界：大于一半的算大号
  let run=1,longest=1 // 当前连号长度、最长连号长度
  for(let i=1;i<reds.length;i++){ // 逐个比较相邻号码
    run=reds[i]===reds[i-1]+1?run+1:1 // 连着就加一，否则重新算
    longest=Math.max(longest,run) // 记下最长
  }
  return { // 返回
    sum:reds.reduce((a,b)=>a+b,0), // 和值
    odd:reds.filter(n=>n%2).length, // 奇数个数
    big:reds.filter(n=>n>half).length, // 大号个数
    zoneMax:Math.max(...rule.zones.map(([lo,hi])=>reds.filter(n=>n>=lo&&n<=hi).length)), // 号码最多的那个区有几个
    longest, // 最长连号
  }
}
function analyze(type,data){ // 分析开奖历史，得到加权和筛选条件
  const rule=DEEP_RULES[type] // 规则
  const draws=data.draws // 全部开奖（新的在前）
  const shapes=draws.map(d=>shapeOf(d[2],rule)) // 每期红球的形态
  const sums=shapes.map(x=>x.sum).sort((a,b)=>a-b) // 和值从小到大
  const pct=q=>sums[Math.floor((sums.length-1)*q)] // 百分位数
  const zoneLimit=Math.max(...commonSet(shapes.map(x=>x.zoneMax))) // 历史 85% 的开奖里，单区最多几个号
  const runLimit=Math.max(...commonSet(shapes.map(x=>x.longest))) // 历史 85% 的开奖里，最长连号
  return { // 返回
    rule,draws, // 规则、开奖
    sumRange:[pct(.1),pct(.9)], // 历史 80% 的开奖落在这个和值范围里
    oddSet:commonSet(shapes.map(x=>x.odd)), // 常见的奇数个数
    bigSet:commonSet(shapes.map(x=>x.big)), // 常见的大号个数
    zoneLimit,runLimit, // 单区上限、连号上限
    jackpots:new Set(draws.map(d=>d[2].join(",")+"|"+d[3].join(","))), // 开出过的头奖组合
  }
}
function fitsHistory(reds,a){ // 这注红球的形态是不是历史上常见的
  const x=shapeOf(reds,a.rule) // 形态
  return x.sum>=a.sumRange[0]&&x.sum<=a.sumRange[1]&&a.oddSet.has(x.odd)&&a.bigSet.has(x.big)&&x.zoneMax<=a.zoneLimit&&x.longest<=a.runLimit // 和值、奇偶、大小、区间、连号都在常见范围内
}
function deepTickets(a,count){ // 生成 count 注
  const tickets=[] // 结果
  for(let tries=0;tickets.length<count&&tries<5000;tries++){ // 最多尝试 5000 次
    const reds=weightedPick(a.redWeights,a.rule.red[0]) // 按神经网络的评分抽红球
    if(!fitsHistory(reds,a)) continue // 形态不常见就重抽
    const loose=tries>3000 // 试了很多次还不够就放宽“5 注之间不要太像”的要求
    if(!loose&&tickets.some(t=>t.red.filter(n=>reds.includes(n)).length>a.rule.maxShare)) continue // 与已选的某注共用太多红球就重抽
    const blues=weightedPick(a.blueWeights,a.rule.blue[0]) // 按神经网络的评分抽蓝球
    if(a.jackpots.has(reds.join(",")+"|"+blues.join(","))) continue // 开出过的头奖组合不要
    if(tickets.some(t=>t.red.join()===reds.join()&&t.blue.join()===blues.join())) continue // 与已选的完全相同就不要
    tickets.push({red:reds,blue:blues}) // 选中
  }
  return tickets // 返回
}
function pad2(n){ // 号码补零成两位
  return String(n).padStart(2,"0") // 例如 7 → 07
}
function topBy(arr,count,desc){ // 按数值取前几个号码（desc=true 取最大的）
  return arr.map((v,n)=>[n,v]).filter(([n])=>n>0).sort((x,y)=>desc?y[1]-x[1]:x[1]-y[1]).slice(0,count) // [号码, 数值]
}

function formatDateLocal(date){ // 时间格式化为 2026-10-30_123456
  const y=date.getFullYear() // 年
  const m=String(date.getMonth()+1).padStart(2,"0") // 月，补零
  const d=String(date.getDate()).padStart(2,"0") // 日，补零
  const h=String(date.getHours()).padStart(2,"0") // 时，补零
  const min=String(date.getMinutes()).padStart(2,"0") // 分，补零
  const s=String(date.getSeconds()).padStart(2,"0") // 秒，补零
  return `${y}-${m}-${d}_${h}${min}${s}` // 拼成字符串
}
// 导出图片直接用 Canvas 画：版式与原来的截图一致，配色随当前深浅模式。
// 不用 html2canvas 截图：它按自己估算的字体基线画字，iPhone 的苹方、SF 字体上数字会明显偏下
const EXPORT_LAYOUT={ball:28,gap:8,rowGap:12,padX:16,padY:20,titleSize:16,titleHeight:22,titleGap:16,numberSize:13.6} // 导出图片的版式：球直径、球间距、行间距、左右留白、上下留白、标题字号、标题行高、标题与号码的间距、数字字号
// 按字形实际的上下边界垂直居中，不依赖各字体不同的基线和行高
function fillTextCentered(ctx,text,x,cy){ // 在 (x, cy) 处画文字，按字形上下边界垂直居中
  ctx.textBaseline="alphabetic" // 以字母基线为准
  const m=ctx.measureText(text) // 量出文字的尺寸
  if(m.actualBoundingBoxAscent!==undefined){ // 浏览器支持字形的实际上下边界时
    ctx.fillText(text,x,cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2) // 基线下移半个（上沿高度 − 下沿深度），让字形正好居中
  }else{ // 不支持时
    ctx.textBaseline="middle" // 退回以行框中线为准
    ctx.fillText(text,x,cy) // 画文字
  }
}
// 把 CSS 的 linear-gradient(角度, 颜色 位置%, ...) 换成 Canvas 渐变，渐变线长度与 CSS 的算法相同
function canvasLinearGradient(ctx,css,width,height){ // CSS 线性渐变 → Canvas 渐变
  const angle=parseFloat((css.match(/([\d.]+)deg/)||[0,180])[1])*Math.PI/180 // 取角度并换成弧度，没写时默认 180 度（从上到下）
  const dx=Math.sin(angle) // 渐变方向的 x 分量（CSS 0 度朝上，顺时针）
  const dy=-Math.cos(angle) // 渐变方向的 y 分量
  const half=(Math.abs(width*dx)+Math.abs(height*dy))/2 // 渐变线的半长：让渐变刚好覆盖整个矩形的角
  const g=ctx.createLinearGradient(width/2-dx*half,height/2-dy*half,width/2+dx*half,height/2+dy*half) // 从中心沿方向往两边各延伸半长，建立渐变
  for(const m of css.matchAll(/(#[0-9a-f]{3,8}|rgba?\([^)]*\))\s+([\d.]+)%/gi)) g.addColorStop(parseFloat(m[2])/100,m[1]) // 逐个取出“颜色 位置%”，加为色标
  return g // 返回渐变
}
// 与 .red、.blue 的 radial-gradient(circle at 32% 26%, ...) 相同，半径到最远的角；投影与页面上的号码球相同
function drawExportBall(ctx,theme,scale,color,number,x,y,r){ // 画一个导出图片里的号码球
  const gx=x-r+2*r*.32 // 高光中心 x：球左边 + 32% 直径
  const gy=y-r+2*r*.26 // 高光中心 y：球上边 + 26% 直径
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.hypot(x+r-gx,y+r-gy)) // 径向渐变，半径到最远的角（右下角）
  g.addColorStop(0,theme.getPropertyValue(`--${color}-hi`).trim()) // 0%：高光色
  g.addColorStop(.55,theme.getPropertyValue(`--${color}`).trim()) // 55%：主色
  g.addColorStop(1,theme.getPropertyValue(`--${color}-lo`).trim()) // 100%：暗部色
  ctx.save() // 保存画布状态（阴影设置之后恢复）
  // Canvas 的阴影参数不随缩放变化，按导出倍数换算
  ctx.shadowColor="rgba(15,23,42,.18)" // 投影颜色
  ctx.shadowOffsetY=2*scale // 投影向下 2px
  ctx.shadowBlur=5*scale // 投影模糊 5px
  ctx.fillStyle=g // 用渐变填充
  ctx.beginPath() // 开始画路径
  ctx.arc(x,y,r,0,Math.PI*2) // 圆
  ctx.fill() // 填充球
  ctx.shadowColor="rgba(0,0,0,.18)" // 数字阴影颜色
  ctx.shadowOffsetY=scale // 数字阴影向下 1px
  ctx.shadowBlur=scale // 数字阴影模糊 1px
  ctx.fillStyle="#fff" // 白色数字
  fillTextCentered(ctx,number,x,y) // 在球心画数字，按字形居中
  ctx.restore() // 恢复画布状态，去掉阴影
}
function drawExportImage(title){ // 画出导出图片，返回画布
  const L=EXPORT_LAYOUT // 版式参数的简写
  const theme=getComputedStyle(document.documentElement) // 当前深浅模式下的 CSS 变量
  const font=getComputedStyle(document.body).fontFamily // 页面使用的字体
  const lines=[...resultInner.children].map(line=>[...line.children].map(ball=>({ // 从页面读出每行的号码球
    number:ball.textContent, // 号码文字
    color:ball.classList.contains("blue")?"blue":"red" // 颜色：有 blue 类就是蓝球，否则是红球
  })))
  // 至少 2 倍；iPhone 等 3 倍屏按 3 倍导出，图片更清晰
  const scale=Math.min(Math.max(window.devicePixelRatio||1,2),3) // 导出倍数：至少 2，最多 3，跟随屏幕像素密度
  const canvas=document.createElement("canvas") // 新建画布
  const ctx=canvas.getContext("2d") // 取 2D 绘图上下文
  const titleFont=`600 ${L.titleSize}px ${font}` // 标题字体：粗体 16px
  ctx.font=titleFont // 先设好字体，用来量标题宽度
  const columns=Math.max(...lines.map(line=>line.length)) // 最多一行有几个球
  const width=Math.ceil(Math.max(columns*(L.ball+L.gap),ctx.measureText(title).width)+L.padX*2) // 图片宽度：号码行和标题取较宽者，再加左右留白
  const height=L.padY*2+L.titleHeight+L.titleGap+lines.length*L.ball+(lines.length-1)*L.rowGap // 图片高度：上下留白 + 标题 + 间距 + 各行号码 + 行间距
  canvas.width=width*scale // 画布实际像素宽度
  canvas.height=height*scale // 画布实际像素高度
  ctx.scale(scale,scale) // 之后按 CSS 像素坐标作画
  ctx.fillStyle=theme.getPropertyValue("--export-base").trim() // 底色
  ctx.fillRect(0,0,width,height) // 先铺底色
  ctx.fillStyle=canvasLinearGradient(ctx,theme.getPropertyValue("--export-bg"),width,height) // 背景渐变
  ctx.fillRect(0,0,width,height) // 再铺渐变
  ctx.textAlign="center" // 文字水平居中
  ctx.font=titleFont // 标题字体
  ctx.fillStyle=theme.getPropertyValue("--export-title").trim() // 标题颜色
  fillTextCentered(ctx,title,width/2,L.padY+L.titleHeight/2) // 画标题，在标题行内垂直居中
  ctx.font=`600 ${L.numberSize}px ${font}` // 号码数字字体：粗体 13.6px
  const top=L.padY+L.titleHeight+L.titleGap // 第一行号码的顶部位置
  lines.forEach((line,row)=>{ // 每一行
    const left=(width-line.length*(L.ball+L.gap))/2+L.gap/2 // 这一行最左边球的左边缘，让整行水平居中
    line.forEach((ball,i)=>{ // 这一行的每个球
      drawExportBall(ctx,theme,scale,ball.color,ball.number,left+i*(L.ball+L.gap)+L.ball/2,top+row*(L.ball+L.rowGap)+L.ball/2,L.ball/2) // 画球：圆心 x、圆心 y、半径
    })
  })
  return canvas // 返回画好的画布
}

  // iPadOS 默认伪装成 Mac 的 UA，用触摸点数区分
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1) // 是否 iOS：UA 含 iPad/iPhone/iPod，或者是带多点触摸的“Mac”（iPadOS）
  if(isIOS){ // iOS 上

  canvas.toBlob(blob=>{ // 其他设备：把画布转成 PNG 文件

    document.body.removeChild(a) // 移除链接
    setTimeout(()=>{ // 稍后

  },"image/png") // 输出 PNG 格式
}
// iOS 不能直接下载到相册：弹出预览，长按图片保存
function showSavePreview(src,alt){ // 弹出保存预览：src 为图片地址，alt 为图片的文字说明
  // 关闭后把焦点还给触发保存的按钮
  const opener=document.activeElement // 当前获得焦点的元素（保存按钮）
  const overlay=document.createElement("div") // 遮罩
  overlay.className="ios-save-overlay" // 遮罩样式
  const modal=document.createElement("div") // 弹窗
  modal.className="ios-save-modal" // 弹窗样式
  modal.setAttribute("role","dialog") // 读屏软件当作对话框
  modal.setAttribute("aria-modal","true") // 对话框打开时，背后的内容不可操作
  modal.setAttribute("aria-label","保存图片") // 对话框的名称
  const preview=document.createElement("img") // 预览图
  preview.className="ios-save-preview" // 预览图样式
  preview.alt=alt // 图片的文字说明
  preview.src=src // 图片内容
  const tip=document.createElement("div") // 提示文字
  tip.className="ios-save-tip" // 提示文字样式
  tip.textContent="长按图片即可保存到相册" // 提示内容
  const closeBtn=document.createElement("button") // 关闭按钮
  closeBtn.type="button" // 普通按钮，不提交表单
  closeBtn.className="ios-save-close" // 关闭按钮样式
  closeBtn.textContent="关闭" // 按钮文字
  let closing=false // 是否正在关闭（防止重复关闭）
  function onKey(e){ // 键盘按下时
    if(e.key==="Escape") closePreview() // 按 Esc 关闭
  }
  function closePreview(){ // 关闭弹窗
    if(closing) return // 已经在关闭就忽略
    closing=true // 标记为正在关闭
    document.removeEventListener("keydown",onKey) // 不再监听键盘
    overlay.classList.remove("show") // 开始淡出
    setTimeout(()=>{ // 等淡出动画结束
      if(overlay.parentNode){ // 遮罩还在页面里
        overlay.parentNode.removeChild(overlay) // 移除遮罩和弹窗
      }
      if(opener&&opener.focus) opener.focus() // 把焦点还给保存按钮
    },230) // 230 毫秒，比淡出动画稍长
  }
  document.addEventListener("keydown",onKey) // 监听键盘
  closeBtn.addEventListener("click",closePreview) // 点关闭按钮时关闭
  overlay.addEventListener("click",e=>{ // 点击遮罩时
    if(e.target===overlay) closePreview() // 点在弹窗外面才关闭
  })
  modal.addEventListener("click",e=>e.stopPropagation()) // 点击弹窗内部不往外传，不触发关闭
  modal.appendChild(preview) // 放入预览图
  modal.appendChild(tip) // 放入提示文字
  modal.appendChild(closeBtn) // 放入关闭按钮
  overlay.appendChild(modal) // 弹窗放进遮罩
  document.body.appendChild(overlay) // 遮罩放进页面
  requestAnimationFrame(()=>{ // 等下一帧
    requestAnimationFrame(()=>{ // 再等一帧，确保初始样式已生效，淡入动画才会播放
      overlay.classList.add("show") // 显示，开始淡入
      closeBtn.focus({preventScroll:true}) // 焦点移到关闭按钮，不滚动页面
    })
  })
}

// 液态背景：整屏流动的彩色液体。多层正弦扭曲坐标（domain warp）做出丝绸般的流动，

const LIQUID_COUNT=10 // 液体颜色的种类数

  const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)") // 系统“减弱动态效果”设置

  const WARP=[[.9,1],[.6,1.45],[.42,2.1],[.3,3],[.2,4.3]] // 每层扭曲：[幅度, 频率]

    const ty=rand(-WARP_SPEED,WARP_SPEED) // 初始 y 方向速度，随机
    return {px:rand(0,6.28),py:rand(0,6.28),vx:tx,vy:ty,tx,ty,turn:rand(3,7)} // 相位随机；当前速度、目标速度；距下次换方向 3～7 秒

  let height=backdrop.clientHeight // 背景高度
  let colors=[] // 各种液体颜色（0～1 的 RGB）
  let chroma=[] // 各种颜色各自的饱和度
  let tone=[1,0] // 调色：颜色倍率、混白比例

  let lastStep=performance.now() // 上一次更新运动的时间

  function luma(c){ // 颜色的亮度（Rec.709 系数）

        w.ty=rand(-WARP_SPEED,WARP_SPEED) // 随机新的 y 方向目标速度
        w.turn=rand(3,7) // 下次换方向在 3～7 秒后
      }
      w.vx+=(w.tx-w.vx)*ease // x 速度平滑靠向目标
      w.vy+=(w.ty-w.vy)*ease // y 速度平滑靠向目标

uniform vec3 uCol[${LIQUID_COUNT}]; // 各种液体颜色
uniform vec2 uTone; // 调色：颜色倍率、混白比例

vec3 bg(vec2 p){ // 取背景纹理在 CSS 坐标 p 处的颜色

// 九点采样的轻度磨砂
vec3 frost(vec2 p,float r){ // 磨砂：在 p 周围半径 r 处取 8 个点加中心点做加权平均

}
float sdBox(vec2 q,vec2 b,float r){ // 圆角矩形的有向距离：q 相对中心的坐标，b 为半宽高，r 为圆角；里面为负、外面为正
  vec2 k=abs(q)-b+r; // 到圆角内收矩形的距离分量
  return length(max(k,0.))+min(max(k.x,k.y),0.)-r; // 外面用欧氏距离，里面用最近边的距离，再减去圆角

    float e=1.-clamp(-d/BEZEL,0.,1.); // 离边缘多近：边缘处为 1，进入 28px 后为 0
    float lens=e*e; // 透镜强度，越靠边缘越强（用于磨砂和高光）
    // 真实厚玻璃的边缘：视线在斜面上向里折射。最外一圈把一段背景压成一条细线，往里是一段被压缩、倒过来的背景，再往里放大后逐渐恢复正常

      vec3 D=h*THICK*tan(th-asin(sin(th)/IOR)); // 斯涅尔定律：三色视线进入玻璃后偏离竖直方向，穿过这里的玻璃厚度落到背景上，偏移多少（px）

    }else{ // 在中间的平面上
      g=frost(p,uLook.x); // 不折射，只做轻度磨砂
    }
    float l=dot(g,vec3(.2126,.7152,.0722)); // 亮度
    g=clamp(mix(vec3(l),g,SAT)*uLook.w,0.,1.); // 略微提饱和，再按参数提亮
    g=mix(g,uTint.rgb,uTint.a); // 叠上玻璃底色
    // 反光的颜色：深色下为白光；浅色下带上玻璃里背景的颜色（同色相、最亮的那个颜色），提亮但不洗白
    vec3 sheen=mix(vec3(1.),g/max(max(g.r,max(g.g,g.b)),.001),uSheen); // 反光颜色
    g+=uLook.z*(1.-smoothstep(0.,.55,length((q-vec2(-.64*b.x,-b.y))/(vec2(2.4,1.7)*b))))*sheen; // 左上角的顶部反光：椭圆形的柔光，边界平滑淡出（线性淡出会在面板中间留下一圈椭圆形的边）

    col=mix(col,clamp(g,0.,1.),clamp(.5-d*uDpr,0.,1.)); // 把玻璃颜色画到面板范围内，边缘按 1 个像素抗锯齿

  gl_FragColor=vec4(col,1.); // 输出像素颜色

  function compile(type,src){ // 编译着色器
    const s=gl.createShader(type) // 新建着色器
    gl.shaderSource(s,src) // 设置源码
    gl.compileShader(s) // 编译
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ // 编译失败时
      console.warn("液体玻璃着色器编译失败:",gl.getShaderInfoLog(s)) // 在控制台输出错误信息
      return null // 返回 null
    }
    return s // 返回着色器
  }
  function link(vs,fs,names){ // 链接着色器程序，并取出 names 中各个 uniform 的位置

    gl.attachShader(prog,vs) // 附加顶点着色器
    gl.attachShader(prog,fs) // 附加片元着色器
    gl.bindAttribLocation(prog,0,"a") // 顶点属性 a 固定在位置 0，两个程序共用同一个顶点缓冲
    gl.linkProgram(prog) // 链接
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) return null // 链接失败就返回 null
    const u={} // uniform 位置表
    names.forEach(name=>{ // 每个 uniform 名称
      u[name]=gl.getUniformLocation(prog,name) // 取出位置
    })
    return {prog,u} // 返回程序和位置表
  }

  const fieldFs=compile(gl.FRAGMENT_SHADER,fieldSrc) // 编译液体着色器
  const glassFs=compile(gl.FRAGMENT_SHADER,glassSrc) // 编译玻璃着色器
  if(!vs||!fieldFs||!glassFs) return null // 任一编译失败就返回 null
  const field=link(vs,fieldFs,["uFieldRes","uFieldScale","uShape","uWarp","uWarpP","uTint","uCol","uTone"]) // 液体程序和它的 uniform
  const glass=link(vs,glassFs,["uField","uFieldSize","uRes","uDpr","uPanel","uPanelR","uPanelN","uTint","uLook","uShadow","uSheen"]) // 玻璃程序和它的 uniform

  const on={signal:listeners.signal} // 带上 signal 的监听选项
  const observers=[] // 尺寸观察器列表

  let sizeH=0 // 画布当前的 CSS 高度
  let sizeDpr=0 // 画布当前的像素密度

  function rgba(s){ // 解析 CSS 颜色 rgb(a)(...) → [r,g,b,a]（0～1）
    const v=(s.match(/[\d.]+/g)||[]).map(Number) // 取出所有数字
    return [(v[0]||0)/255,(v[1]||0)/255,(v[2]||0)/255,v.length>3?v[3]:1] // 前三个除以 255，第四个是不透明度，没有就是 1
  }
  // 液体参数来自 liquidBackdrop，颜色和玻璃参数从 CSS 变量读取，深浅模式各一套
  function readTheme(){ // 读取颜色和玻璃参数，设置到着色器
    const cs=getComputedStyle(document.documentElement) // 根元素的样式
    liquidBackdrop.readTheme() // 先让液态背景模块重新读取颜色
    const sp=liquidBackdrop.spec() // 取液体参数
    gl.useProgram(field.prog) // 切换到液体程序
    gl.uniform4f(field.u.uShape,sp.shape[0]/Math.min(sizeW,sizeH),sp.shape[1],sp.shape[2],sp.shape[3]) // 形状参数：坐标缩放按屏幕短边换算
    gl.uniform2fv(field.u.uWarp,sp.warp) // 扭曲的幅度和频率
    for(let k=0;k<LIQUID_COUNT;k++){ // 每种颜色条纹：方向和饱和度不常变，记在 tintBuf 里，相位逐帧填入
      tintBuf[k*4]=sp.tintDir[k*2] // 方向 x
      tintBuf[k*4+1]=sp.tintDir[k*2+1] // 方向 y
      tintBuf[k*4+3]=sp.chroma[k] // 饱和度
    }

    gl.uniform4f(glass.u.uTint,...rgba(cs.getPropertyValue("--gl-tint"))) // 玻璃底色
    gl.uniform4f(glass.u.uLook,...cs.getPropertyValue("--gl-look").trim().split(/\s+/).map(Number)) // 玻璃参数
    gl.uniform4f(glass.u.uShadow,...rgba(cs.getPropertyValue("--gl-shadow"))) // 面板投影颜色

  }
  function resize(){ // 画布尺寸变化时重新设置
    const dpr=Math.min(window.devicePixelRatio||1,2) // 像素密度，最高 2 倍（再高看不出差别，只会更耗电）
    sizeW=canvas.clientWidth // 记下 CSS 宽度
    sizeH=canvas.clientHeight // 记下 CSS 高度
    sizeDpr=dpr // 记下像素密度
    canvas.width=Math.round(sizeW*dpr) // 画布像素宽度
    canvas.height=Math.round(sizeH*dpr) // 画布像素高度
    fieldW=Math.max(1,Math.ceil(sizeW/FIELD_SCALE)) // 液体纹理宽度
    fieldH=Math.max(1,Math.ceil(sizeH/FIELD_SCALE)) // 液体纹理高度

    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,fieldW,fieldH,0,gl.RGBA,fieldType,null) // 按新尺寸分配纹理（不填内容）

    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fieldTex,0) // 把纹理接到帧缓冲上，之后画进帧缓冲就是画进纹理

    raf=0 // 清空帧编号
  }
  function destroy(){ // 销毁 WebGL：停止动画、移除监听、释放资源
    stop() // 停止动画
    listeners.abort() // 移除所有带 signal 的监听
    observers.forEach(o=>o.disconnect()) // 断开所有尺寸观察器
    canvas.remove() // 移除画布
    document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记，CSS 玻璃恢复
    const lose=gl.getExtension("WEBGL_lose_context") // 取“主动丢弃上下文”扩展
    if(lose&&!gl.isContextLost()) lose.loseContext() // 上下文还在就主动丢弃，立即释放显存
  }
  document.body.insertBefore(canvas,document.body.firstChild) // 画布放到页面最前面（在内容下层）
  resize() // 设置尺寸并画第一帧
  // 极少数设备不能渲染到纹理，此时改用 2D 兜底画法
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo) // 绑定帧缓冲
  const fboOk=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE // 检查能否渲染到纹理
  gl.bindFramebuffer(gl.FRAMEBUFFER,null) // 恢复画到屏幕
  if(!fboOk){ // 不能渲染到纹理时
    destroy() // 销毁
    return null // 返回 null，改用兜底
  }
  canvas.addEventListener("webglcontextlost",()=>{ // WebGL 上下文丢失时（例如 iOS 后台回收）
    destroy() // 销毁
    onLost() // 通知控制器改用兜底
  },on) // 监听可一次性移除
  document.documentElement.classList.add("lg-webgl") // 标记 WebGL 生效，CSS 去掉玻璃底色和模糊
  start() // 开始动画
  window.addEventListener("resize",resize,on) // 窗口尺寸变化时重新设置
  if(window.visualViewport) visualViewport.addEventListener("resize",resize,on) // 可视区域尺寸变化时（iOS 工具栏收起展开）重新设置
  if(window.ResizeObserver){ // 浏览器支持 ResizeObserver 时
    ;[document.querySelector(".container"),canvas].forEach(el=>{ // 观察内容容器（面板位置变化）和画布（画布尺寸变化）
      const o=new ResizeObserver(()=>draw(performance.now())) // 尺寸变化时重画
      o.observe(el) // 开始观察
      observers.push(o) // 记入列表，销毁时断开
    })
  }
  // 旧版 Safari 不支持用 signal 移除监听，所以回调里先确认 WebGL 仍在使用
  onMediaChange(matchMedia("(prefers-color-scheme: dark)"),()=>{ // 系统深浅模式切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    readTheme() // 重新读取颜色
    draw(performance.now()) // 重画
  },on) // 监听可一次性移除
  onMediaChange(reduceMotion,()=>{ // 系统“减弱动态效果”切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    stop() // 先停止
    start() // 按新设置重新开始
    draw(performance.now()) // 立即画一帧
  },on) // 监听可一次性移除
  return {destroy} // 返回销毁接口
}
// 优先用 WebGL；不支持、上下文丢失或系统要求降低透明度时，用 2D 兜底背景和 CSS 玻璃。
// "降低透明度"可以随时切换，切换后立即生效。
// iOS Safari 常在页面切到后台后回收 WebGL 上下文，回到前台时重新创建
;(function liquidGlassController(){ // 立即执行：决定用 WebGL 还是兜底
  const reduceTransparency=matchMedia("(prefers-reduced-transparency: reduce)") // 系统“降低透明度”设置
  // WebGL 创建失败或运行中丢失时，先用兜底背景顶上，再按这些间隔自动重试；用完后等下次回到前台再试。
  // iOS 刚启动或从后台切回时偶尔建不起来，原来失败一次就再也不试，只剩没有折射的磨砂玻璃
  const RETRY_DELAYS=[500,1500,4000,10000] // 第 1～4 次重试前等待的毫秒数
  let webgl=null // 当前的 WebGL 实例
  let retries=0 // 已经安排过几次重试（WebGL 成功运行或回到前台时清零）
  let retryTimer=0 // 下一次重试的计时器
  function scheduleRetry(){ // 安排下一次重试
    clearTimeout(retryTimer) // 取消已安排的重试
    if(retries>=RETRY_DELAYS.length) return // 次数用完：等下次回到前台再试
    retryTimer=setTimeout(apply,RETRY_DELAYS[retries++]) // 依次等 0.5、1.5、4、10 秒再试
  }
  function onLost(){ // WebGL 运行中丢失时（例如 iOS 回收显存）
    webgl=null // 清掉 WebGL 实例
    liquidBackdrop.start() // 先用兜底背景顶上
    scheduleRetry() // 稍后重建
  }
  function create(){ // 创建 WebGL，出错时清理干净
    try{ // 尝试
      return createLiquidGlass(onLost) // 创建，丢失时调用 onLost
    }catch(error){ // 初始化出错时
      console.warn("液体玻璃初始化失败:",error) // 在控制台记录
      document.querySelectorAll(".lg-canvas").forEach(c=>c.remove()) // 移除可能残留的画布
      document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记
      return null // 返回 null
    }
  }
  function apply(){ // 根据当前设置选择 WebGL 或兜底
    clearTimeout(retryTimer) // 这次就是在处理，取消已安排的重试
    if(reduceTransparency.matches){ // 开启了降低透明度
      if(webgl) webgl.destroy() // 有 WebGL 就销毁
      webgl=null // 清掉 WebGL 实例
      liquidBackdrop.start() // 改用兜底（实底玻璃）
      return // 结束
    }
    if(webgl) return // WebGL 已在运行就不处理
    webgl=create() // 尝试创建 WebGL
    if(webgl){ // 创建成功
      retries=0 // 重试次数清零
      liquidBackdrop.stop() // 停止兜底背景
    }else{ // 创建失败
      liquidBackdrop.start() // 先用兜底背景
      scheduleRetry() // 稍后再试
    }
  }
  apply() // 页面加载时先选一次
  onMediaChange(reduceTransparency,apply) // 降低透明度切换时重新选
  document.addEventListener("visibilitychange",()=>{ // 页面可见性变化时
    if(document.visibilityState!=="visible") return // 切到后台时不处理
    retries=0 // 回到前台：重试次数重新算
    apply() // 重新选（WebGL 被回收后会重建）
  })
  addEventListener("pageshow",event=>{ // 页面显示时（含从后退缓存恢复）
    if(!event.persisted) return // 只处理从缓存恢复的情况，首次加载已经处理过
    retries=0 // 重试次数重新算
    apply() // 重新选
  })
})() // 立即执行函数结束
// 离线缓存：添加到主屏幕后，没有网络也能打开。只在网址为 http(s) 时注册，直接打开本地文件时跳过
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){ // 浏览器支持且通过网址打开时
  navigator.serviceWorker.register("sw.js").catch(error=>console.warn("离线缓存注册失败:",error)) // 注册离线缓存，失败不影响使用
}
