<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>双色球 / 大乐透 随机选号</title>
<script src="./html2canvas.min.js"></script>
<style>
:root {
  color-scheme: light dark;
  --bg-page:#c4d8fc;
  --bg-canvas:linear-gradient(165deg,#ffd0da 0%,#ecd3f7 32%,#d4d6fb 62%,#c4d8fc 100%);
  --text-main:#111827;
  --text-sub:rgba(17,24,39,.6);
  --primary:#4f46e5;
  --red:#ef4444;
  --blue:#3b82f6;
  /* 背景彩球：边缘清楚的色块，让玻璃的虚化看得出来 */
  --orb-1:#ff6f7d;
  --orb-2:#4f8dff;
  --orb-3:#9a86ff;
  --orb-4:#ff8fcf;
  --orb-5:#ffbe5c;
  --orb-hi:rgba(255,255,255,.45);
  --orb-o:.85;
  /* 液体玻璃材质（iOS 27）：透明度更低、虚化更强、外圈加深暗边、高光更亮 */
  --glass-bg:rgba(255,255,255,.16);
  --glass-bg-strong:rgba(255,255,255,.55);
  --glass-blur:blur(20px) saturate(180%) brightness(1.06);
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%);
  --glass-rim:linear-gradient(140deg,#fff,rgba(255,255,255,.4) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.45) 82%,#fff);
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1);
  --glass-border:rgba(15,23,42,.16);
  --glass-inset:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 2px 2px 4px rgba(255,255,255,.6),
    inset -2px -2px 4px rgba(255,255,255,.4),
    inset 0 0 16px rgba(255,255,255,.2);
  --glass-shadow:
    var(--glass-edge),
    var(--glass-inset),
    0 12px 32px rgba(31,41,95,.14),
    0 2px 6px rgba(31,41,95,.08);
  --rim-w:1.5px;
  --glow:rgba(255,255,255,.8);
  --tint-primary:rgba(79,70,229,.9);
  --thumb-bg:rgba(255,255,255,.88);
  --thumb-lens:rgba(255,255,255,.4);
  --overlay-bg:rgba(15,23,42,.32);
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --pad:10px;
  --ctl-h:46px;
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:#0b1633;
    --bg-canvas:linear-gradient(165deg,#1d0e1f 0%,#151030 40%,#0b1633 100%);
    --text-main:#f1f5f9;
    --text-sub:rgba(241,245,249,.6);
    --primary:#818cf8;
    --orb-1:#c8323f;
    --orb-2:#2563eb;
    --orb-3:#5b45d6;
    --orb-4:#b02a7f;
    --orb-5:#b8741c;
    --orb-hi:rgba(255,255,255,.18);
    --orb-o:.75;
    --glass-bg:rgba(34,38,56,.44);
    --glass-bg-strong:rgba(54,60,84,.74);
    --glass-blur:blur(32px) saturate(170%);
    --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);
    --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.14) 20%,rgba(255,255,255,0) 42%,rgba(255,255,255,0) 62%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.55));
    --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55);
    --glass-border:rgba(0,0,0,.6);
    --glass-inset:
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 2px 2px 4px rgba(255,255,255,.16),
      inset -2px -2px 4px rgba(255,255,255,.08),
      inset 0 0 16px rgba(255,255,255,.05);
    --glass-shadow:
      var(--glass-edge),
      var(--glass-inset),
      0 12px 32px rgba(0,0,0,.4),
      0 2px 6px rgba(0,0,0,.3);
    --glow:rgba(255,255,255,.26);
    --tint-primary:rgba(99,102,241,.72);
    --thumb-bg:rgba(255,255,255,.22);
    --thumb-lens:rgba(255,255,255,.1);
    --overlay-bg:rgba(0,0,0,.45);
  }
}
/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) {
  :root {
    --glass-bg:#ffffff;
    --glass-bg-strong:#ffffff;
    --glass-blur:none;
    --glass-spec:none;
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
  :root {
    --glass-bg:#1e2333;
    --glass-bg-strong:#1e2333;
  }
}
* {box-sizing:border-box;}
  html,
  body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  }
  html {
  background-color: var(--bg-page);
  background-image: var(--bg-canvas);
  background-repeat: no-repeat;
  background-size: 100% 100vh;
  background-size: 100% 100lvh;
  }
  * {
  -webkit-tap-highlight-color: transparent;
  }
  .container,
  .form-box,
  .result-box,
  .result-inner,
  .result-line,
  h1,
  button,
  .segmented,
  .segmented label {
  touch-action: none;
  -ms-touch-action: none;
}
.backdrop {
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:100vh;
  height:100lvh;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.backdrop span {
  --orb:var(--orb-1);
  position:absolute;
  border-radius:50%;
  opacity:var(--orb-o);
  background:
    radial-gradient(circle at 36% 30%,var(--orb-hi),transparent 38%),
    radial-gradient(circle,var(--orb) 0%,var(--orb) 54%,transparent 70%);
  will-change:transform;
  animation:drift 26s ease-in-out infinite alternate;
}
.backdrop span:nth-child(1) {
  width:80vmin;
  height:80vmin;
  top:-10%;
  left:-26vmin;
}
.backdrop span:nth-child(2) {
  --orb:var(--orb-2);
  width:90vmin;
  height:90vmin;
  bottom:2%;
  right:-30vmin;
  animation-duration:32s;
  animation-direction:alternate-reverse;
}
.backdrop span:nth-child(3) {
  --orb:var(--orb-3);
  width:60vmin;
  height:60vmin;
  top:26%;
  right:-20vmin;
  animation-duration:38s;
}
.backdrop span:nth-child(4) {
  --orb:var(--orb-4);
  width:56vmin;
  height:56vmin;
  top:52%;
  left:-20vmin;
  animation-duration:29s;
  animation-direction:alternate-reverse;
}
.backdrop span:nth-child(5) {
  --orb:var(--orb-5);
  width:36vmin;
  height:36vmin;
  top:9%;
  right:4vmin;
  animation-duration:34s;
}
@keyframes drift {
  0% {transform:translate3d(0,0,0) scale(1);}
  50% {transform:translate3d(6vmax,4vmax,0) scale(1.08);}
  100% {transform:translate3d(-4vmax,8vmax,0) scale(.95);}
}
@media (prefers-reduced-motion: reduce) {
  .backdrop span {animation:none;}
}
.container {
  position:relative;
  z-index:1;
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
h1 {
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 4px;
}
/* 液体玻璃基础材质：半透明 + 背景模糊增饱和 + 镜面高光 + 高光边缘 */
.glass {
  position:relative;
  isolation:isolate;
  background:var(--glass-spec),var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  /* 大面板不用外侧模糊投影：Safari 给大尺寸圆角元素画外侧模糊阴影时会分块拼贴，
     圆角外会露出一块方形色块。深色细边改用边框画，内侧高光保留 */
  border:.5px solid var(--glass-border);
  box-shadow:var(--glass-inset);
}
.glass::before,
button::before,
.segmented-thumb::before,
.ios-save-modal::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:var(--rim-w);
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
/* 触摸发光：光从手指处向外扩散，并带亮所在的玻璃面板 */
.glass::after,
button::after,
.segmented-thumb::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:radial-gradient(circle var(--glow-size,90px) at var(--lx,50%) var(--ly,50%),var(--glow),transparent);
  opacity:0;
  transition:opacity .6s ease;
  pointer-events:none;
}
.glass::after {
  --glow-size:150px;
}
.lit::after {
  opacity:1;
  transition-duration:.15s;
}
.glass.lit::after {
  opacity:.55;
}
.form-box {
  border-radius:var(--radius-outer);
  padding:var(--pad);
}
.segmented {
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  height:var(--ctl-h);
  padding:4px;
  border-radius:calc(var(--ctl-h) / 2);
  background:rgba(118,118,128,.14);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.segmented input {
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.segmented label {
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  font-weight:500;
  color:var(--text-sub);
  cursor:pointer;
  transition:color .25s;
}
#type-ssq:checked ~ label[for="type-ssq"],
#type-dlt:checked ~ label[for="type-dlt"] {
  color:var(--text-main);
  font-weight:600;
}
.segmented-thumb {
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc(50% - 4px);
  border-radius:calc(var(--ctl-h) / 2 - 4px);
  isolation:isolate;
  background-image:var(--glass-spec);
  background-color:var(--thumb-bg);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.8),
    0 3px 10px rgba(0,0,0,.12),
    0 1px 2px rgba(0,0,0,.08);
  translate:var(--thumb-x,0) 0;
  scale:var(--thumb-s,1);
  transition:translate .5s cubic-bezier(.34,1.56,.64,1),scale .4s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s,opacity .25s;
}
@supports not (translate:0) {
  .segmented-thumb {
    transform:translateX(var(--thumb-x,0)) scale(var(--thumb-s,1));
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),background-color .25s,opacity .25s;
  }
}
@supports (translate:0) {
  .segmented-thumb.morph {
    animation:lg-morph .55s ease;
  }
}
@keyframes lg-morph {
  0% {transform:none;}
  35% {transform:scale(1.1,.9);}
  70% {transform:scale(.98,1.03);}
  100% {transform:none;}
}
#type-dlt:checked ~ .segmented-thumb {
  --thumb-x:100%;
}
.segmented:active input:enabled ~ .segmented-thumb {
  --thumb-s:1.1;
  background-color:var(--thumb-lens);
  box-shadow:
    var(--glass-edge),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 2px 2px 4px rgba(255,255,255,.55),
    inset -2px -2px 4px rgba(255,255,255,.4),
    0 8px 20px rgba(0,0,0,.16);
}
.segmented input:focus-visible ~ .segmented-thumb {
  outline:2px solid var(--primary);
  outline-offset:2px;
}
.segmented input:disabled ~ label {
  cursor:not-allowed;
}
.button-group {
  display:flex;
  gap:var(--pad);
  margin-top:var(--pad);
}
button {
  position:relative;
  isolation:isolate;
  flex:1;
  height:var(--ctl-h);
  padding:0 12px;
  font-size:1rem;
  font-weight:600;
  font-family:inherit;
  border-radius:calc(var(--ctl-h) / 2);
  border:none;
  background:var(--glass-spec),var(--glass-bg-strong);
  color:var(--primary);
  cursor:pointer;
  box-shadow:var(--glass-shadow);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .25s,background-color .25s;
}
button.prominent {
  --glow:rgba(255,255,255,.35);
  background:var(--glass-spec),var(--tint-primary);
  color:#fff;
}
button:active {
  transform:scale(1.07);
  filter:brightness(1.1) saturate(1.1);
}
/* 生成过程中只禁止点击，外观保持不变 */
button:disabled {
  opacity:1;
  filter:none;
  transform:none;
  cursor:not-allowed;
}
.result-box {
  border-radius:var(--radius-outer);
  padding:14px;
  width:100%;
  height:210px;
  overflow-y:hidden;
  flex-shrink:0;
}
.result-inner {
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  width:100%;
  gap:10px;
}
.result-line {
  display:flex;
  justify-content:center;
  height:28px;
}
/* 号码球：带高光的着色玻璃珠 */
.ball {
  width:28px;
  height:28px;
  margin:0 4px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.85rem;
  font-weight:600;
  color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.18);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -2px 3px rgba(0,0,0,.12),
    0 2px 5px rgba(15,23,42,.18);
}
/* html2canvas 不能正确绘制内阴影，导出图片时去掉 */
.capture .ball {box-shadow:none;}
.red {background:radial-gradient(circle at 32% 26%,#ff8a8a 0%,var(--red) 55%,#d22f2f 100%);}
.blue {background:radial-gradient(circle at 32% 26%,#8ab8ff 0%,var(--blue) 55%,#2563d9 100%);}
@media (max-width:360px) {
  :root {--ctl-h:42px;--pad:8px;}
  .ball {width:24px;height:24px;font-size:.75rem;}
  button,
  .segmented label {font-size:.9rem;}
}
.ios-save-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--overlay-bg);
  opacity: 0;
  transition: opacity 0.22s ease;
  isolation: isolate;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  touch-action: none;
}
.ios-save-overlay.show {
  opacity: 1;
}
.ios-save-modal {
  position: relative;
  width: min(340px, 85vw);
  max-height: 80vh;
  padding: 14px;
  background: var(--glass-spec), var(--glass-bg-strong);
  border-radius: 32px;
  border: .5px solid var(--glass-border);
  box-shadow: var(--glass-inset);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  -webkit-transform: translateZ(0) scale(.9);
  transform: translateZ(0) scale(.9);
  -webkit-filter: blur(10px);
  filter: blur(10px);
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .3s ease, -webkit-filter .3s ease;
}
.ios-save-overlay.show .ios-save-modal {
  -webkit-transform: translateZ(0) scale(1);
  transform: translateZ(0) scale(1);
  -webkit-filter: none;
  filter: none;
}
.ios-save-preview {
  display: block;
  width: 100%;
  height: auto;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 18px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: default;
}
.ios-save-tip {
  margin-top: 10px;
  font-size: 13px;
  line-height: 20px;
  color: var(--text-sub);
  text-align: center;
}
.ios-save-close {
  flex: none;
  width: 100%;
  margin-top: 10px;
  background: var(--glass-spec), var(--tint-primary);
  color: #fff;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
</style>

<body>
<div class="backdrop" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div class="container">
  <h1>双色球 / 大乐透 随机选号</h1>
  <div class="form-box glass">
    <div class="segmented" role="radiogroup" aria-label="彩种">
      <input type="radio" name="type" id="type-ssq" value="ssq" checked>
      <input type="radio" name="type" id="type-dlt" value="dlt">
      <span class="segmented-thumb" aria-hidden="true"></span>
      <label for="type-ssq">双色球</label>
      <label for="type-dlt">大乐透</label>
    </div>
    <div class="button-group">
      <button id="generate-btn" class="prominent">生成号码</button>
      <button id="save-btn" class="prominent">保存图片</button>
    </div>
  </div>
  <div class="result-box glass">
    <div class="result-inner" id="result-inner"></div>
  </div>
</div>
<script>
  (function disableZoom() {
  let lastTouchEnd = 0;
  document.addEventListener(
    "gesturestart",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gesturechange",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "gestureend",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
  document.addEventListener(
    "touchstart",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      const now = Date.now();
      if (now - lastTouchEnd < 350) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchmove",
    function (e) {
      if (e.touches.length > 1) {
        e.preventDefault();
        return;
      }
      if (
        typeof isRolling !== "undefined" &&
        isRolling
      ) {
        e.preventDefault();
      }
    },
    { passive: false }
  );
  document.addEventListener(
    "touchend",
    function () {
      lastTouchEnd = Date.now();
    },
    { passive: false }
  );
  document.addEventListener(
    "dblclick",
    function (e) {
      e.preventDefault();
    },
    { passive: false }
  );
})();
const resultInner=document.getElementById("result-inner")
const typeInputs=document.querySelectorAll('input[name="type"]')
let isRolling=false
function getType(){
  return document.querySelector('input[name="type"]:checked').value
}
const segmentedThumb=document.querySelector(".segmented-thumb")
typeInputs.forEach(input=>input.addEventListener('change',()=>{
  segmentedThumb.classList.remove("morph")
  void segmentedThumb.offsetWidth
  segmentedThumb.classList.add("morph")
  if(!isRolling){
    resultInner.innerHTML=''
  }
}))
segmentedThumb.addEventListener("animationend",()=>segmentedThumb.classList.remove("morph"))
;(function liquidGlassTouchLight(){
  let lit=[]
  function place(el,e){
    const r=el.getBoundingClientRect()
    el.style.setProperty("--lx",`${e.clientX-r.left}px`)
    el.style.setProperty("--ly",`${e.clientY-r.top}px`)
  }
  function release(){
    lit.forEach(el=>el.classList.remove("lit"))
    lit=[]
  }
  document.addEventListener("pointerdown",e=>{
    release()
    const ctl=e.target.closest("button,.segmented")
    if(!ctl) return
    if(ctl.matches(".segmented")&&typeInputs[0].disabled) return
    if(ctl.disabled) return
    const surface=ctl.matches(".segmented")?segmentedThumb:ctl
    lit=[surface]
    const panel=ctl.closest(".glass")
    if(panel) lit.push(panel)
    lit.forEach(el=>{
      place(el,e)
      el.classList.add("lit")
    })
  })
  document.addEventListener("pointermove",e=>{
    lit.forEach(el=>place(el,e))
  })
  document.addEventListener("pointerup",release)
  document.addEventListener("pointercancel",release)
})()
function randomIntUnbiased(max){
  if(max<=0) throw new Error("max must be positive")
  const bytes=new Uint8Array(128)
  const maxBig=BigInt(max)
  const range=1n<<1024n
  const limit=range-(range%maxBig)
  let x
  do{
    crypto.getRandomValues(bytes)
    x=0n
    for(const b of bytes){
      x=(x<<8n)|BigInt(b)
    }
  }while(x>=limit)
  return Number(x%maxBig)
}
function randomNums(min,max,count){
  const pool=Array.from({length:max-min+1},(_,i)=>i+min)
  for(let i=pool.length-1;i>0;i--){
    const j=randomIntUnbiased(i+1)
    ;[pool[i],pool[j]]=[pool[j],pool[i]]
  }
  return pool.slice(0,count).sort((a,b)=>a-b)
}
function createBall(n,color){
  const span=document.createElement("span")
  span.className=`ball ${color}`
  span.textContent=String(n).padStart(2,"0")
  return span
}
function toggleButtons(disabled){
  document.getElementById("generate-btn").disabled=disabled
  document.getElementById("save-btn").disabled=disabled
  typeInputs.forEach(input=>input.disabled=disabled)
}
function generateRolling(){
  if(isRolling) return
  const type=getType()
  const count=5
  isRolling=true
  toggleButtons(true)
  const duration=10000
  const start=performance.now()
  function frame(now){
    resultInner.innerHTML=''
    for(let i=0;i<count;i++){
      const line=document.createElement("div")
      line.className="result-line"
      if(type==="ssq"){
        randomNums(1,33,6).forEach(n=>line.appendChild(createBall(n,"red")))
        line.appendChild(createBall(randomNums(1,16,1)[0],"blue"))
      }else{
        randomNums(1,35,5).forEach(n=>line.appendChild(createBall(n,"red")))
        randomNums(1,12,2).forEach(n=>line.appendChild(createBall(n,"blue")))
      }
      resultInner.appendChild(line)
    }
    if(now-start<duration){
      requestAnimationFrame(frame)
    }else{
      isRolling=false
      toggleButtons(false)
    }
  }
  requestAnimationFrame(frame)
}
function formatDateLocal(date){
  const y=date.getFullYear()
  const m=String(date.getMonth()+1).padStart(2,"0")
  const d=String(date.getDate()).padStart(2,"0")
  const h=String(date.getHours()).padStart(2,"0")
  const min=String(date.getMinutes()).padStart(2,"0")
  const s=String(date.getSeconds()).padStart(2,"0")
  return `${y}-${m}-${d}_${h}${min}${s}`
}
function saveAsImage(){
  if(isRolling){
    alert("请等待生成完成再保存")
    return
  }
  if(!resultInner.innerHTML.trim()){
    alert("当前没有生成结果")
    return
  }
  toggleButtons(true)
  const type=getType()
  const typeText=type==="ssq"?"双色球":"大乐透"
  const dateText=formatDateLocal(new Date())
  const wrapper=document.createElement("div")
  wrapper.className="capture"
  wrapper.style.position="absolute"
  wrapper.style.left="-9999px"
  wrapper.style.top="0"
  wrapper.style.background="#fff"
  wrapper.style.padding="20px 16px"
  wrapper.style.textAlign="center"
  wrapper.style.borderRadius="12px"
  const title=document.createElement("div")
  title.style.fontSize="16px"
  title.style.fontWeight="600"
  title.style.marginBottom="16px"
  title.style.color="#111"
  title.textContent=`${dateText}  ${typeText}`
  wrapper.appendChild(title)
  ;[...resultInner.children].forEach(line=>{
    const row=document.createElement("div")
    row.style.display="flex"
    row.style.justifyContent="center"
    row.style.marginBottom="12px"
    ;[...line.children].forEach(ball=>{
      row.appendChild(ball.cloneNode(true))
    })
    wrapper.appendChild(row)
  })
  document.body.appendChild(wrapper)
  html2canvas(wrapper,{
    backgroundColor:"#fff",
    scale:2
  }).then(canvas=>{
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)
  if(isIOS){
  const overlay=document.createElement("div")
  overlay.className="ios-save-overlay"
  const modal=document.createElement("div")
  modal.className="ios-save-modal"
  const preview=document.createElement("img")
  preview.className="ios-save-preview"
  preview.src=canvas.toDataURL("image/png")
  const tip=document.createElement("div")
  tip.className="ios-save-tip"
  tip.textContent="长按图片即可保存到相册"
  const closeBtn=document.createElement("button")
  closeBtn.className="ios-save-close"
  closeBtn.textContent="关闭"
  let closing=false
  function closePreview(){
    if(closing) return
    closing=true
    overlay.classList.remove("show")
    setTimeout(()=>{
      if(overlay.parentNode){
        overlay.parentNode.removeChild(overlay)
      }
    },230)
  }
  closeBtn.addEventListener(
    "click",
    closePreview
  )
  overlay.addEventListener(
    "click",
    function(e){
    if(e.target===overlay){
        closePreview()
      }
    }
  )
  modal.addEventListener(
    "click",
    function(e){
      e.stopPropagation()
    }
  )
  modal.appendChild(preview)
  modal.appendChild(tip)
  modal.appendChild(closeBtn)
  overlay.appendChild(modal)
  document.body.appendChild(overlay)
    requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
    overlay.classList.add("show")
    })
  })
 }else{
      canvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob)
        const a=document.createElement("a")
        a.href=url
        a.download=`lottery-${typeText}-${dateText}.png`
        document.body.appendChild(a)
        a.click()
        document.body.removeChild(a)
        setTimeout(()=>{
          URL.revokeObjectURL(url)
        },1000)
      },"image/png")
    }
    document.body.removeChild(wrapper)
    toggleButtons(false)
    }).catch(error=>{
    console.error("保存图片失败:",error)
    if(document.body.contains(wrapper)){
      document.body.removeChild(wrapper)
    }
    toggleButtons(false)
    alert("图片生成失败，请重试")
  })
}
document.getElementById("generate-btn").onclick=generateRolling
document.getElementById("save-btn").onclick=saveAsImage
</script>
