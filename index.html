<!DOCTYPE html> <!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN"> <!-- 根元素，页面语言为简体中文 -->
<head> <!-- 文档头：放元信息和样式 -->
<meta charset="UTF-8"> <!-- 字符编码使用 UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"> <!-- 视口：宽度等于设备宽度，禁止缩放，内容延伸到刘海和圆角区域 -->
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)"> <!-- 浅色模式下浏览器状态栏的颜色 -->
<meta name="theme-color" content="#07081a" media="(prefers-color-scheme: dark)"> <!-- 深色模式下浏览器状态栏的颜色 -->
<!-- 添加到主屏幕：以独立 App 的样子全屏打开，有自己的图标和名字 -->
<meta name="apple-mobile-web-app-capable" content="yes"> <!-- 从 iPhone 主屏幕打开时全屏显示，不显示 Safari 的地址栏和工具栏（iOS 16.3 及更早靠这一项） -->
<meta name="mobile-web-app-capable" content="yes"> <!-- 同上，标准写法（安卓 Chrome 等） -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- 状态栏透明，液体背景一直延伸到状态栏下面 -->
<meta name="apple-mobile-web-app-title" content="幸运选号"> <!-- 主屏幕图标下面显示的名字 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"> <!-- iPhone、iPad 主屏幕图标（180×180）；?v=2 让浏览器换掉缓存里的旧图标 -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2"> <!-- 浏览器标签页图标 -->
<link rel="preload" as="image" href="images/splash.jpg" fetchpriority="high"> <!-- 开屏图片优先下载 -->
<link rel="manifest" href="manifest.webmanifest"> <!-- 网页应用清单：名字、图标、全屏显示（iOS 16.4 起和安卓都读它） -->
<script> // 主屏幕 App 底部白边修正（放在页面最前面，第一帧就生效）
  // iOS 26 主屏幕 App 的问题（WebKit Bug 301108）：页面本身比屏幕矮时，iOS 把可视区域缩短一个状态栏的高度，
  // 固定定位的背景也画到那条边为止，底部露出一条与状态栏等高的空白（灵动岛机型 59px）。
  // 页面原来是 height:100%，而 100% 在这种情况下正好少了状态栏的高度，所以页面“比屏幕矮”。
  // 解决：在 iOS 主屏幕 App 里让页面至少和屏幕一样高（--screen-h，用 JS 量屏幕高度，
  // 不用 env(safe-area-inset-top)：iOS 26.1 起它可能返回 0）。见 html.ios-app 样式
  (function fitScreen(){ // 立即执行：判断是否为主屏幕 App，并在尺寸变化时更新
    const root=document.documentElement // 根元素
    const ua=navigator.userAgent // 浏览器标识
    const isIOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1) // 是否 iOS / iPadOS（iPadOS 伪装成 Mac，用触摸点数区分）
    const probe=document.createElement("div") // 用来量 CSS 的 100lvh 实际有多高
    probe.style.cssText="position:fixed;top:0;left:0;width:0;height:100vh;height:100lvh;visibility:hidden;pointer-events:none" // 不可见、不占布局；不支持 lvh 时用 vh
    function update(){ // 更新
      if(!isIOS) return // 只处理 iOS
      const landscape=innerWidth>innerHeight // 是否横屏
      const screenH=landscape?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height) // 当前方向下屏幕的高度（iOS 的 screen 尺寸固定按竖屏给出）
      root.appendChild(probe) // 放进页面才能量
      const view=Math.min(innerHeight,probe.offsetHeight||innerHeight) // 视口高度：CSS 和 JS 给的取较小者
      probe.remove() // 量完移除
      const gap=screenH-view // 屏幕比视口高出的部分
      // 三种迹象任一出现就当作主屏幕 App：系统标记、显示模式、视口正好比屏幕矮一个状态栏（1～80px，再大是 Safari 工具栏或 iPad 分屏）
      const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches // 系统给出的主屏幕 App 标记
      // 一旦认定就不再撤销：页面撑高后缺口会消失，撤销会让页面又变矮、来回跳
      if(standalone||(gap>0&&gap<=80)) root.classList.add("ios-app") // 认定为主屏幕 App
      root.style.setProperty("--screen-h",`${screenH}px`) // 当前方向的屏幕高度
      root.style.setProperty("--screen-extra",`${gap>0&&gap<=80?gap:0}px`) // 视口比屏幕矮的部分：固定背景层再往下多铺这么多（保险）
    }
    update() // 先算一次
    addEventListener("resize",update) // 旋转屏幕等尺寸变化时重新计算
  })() // 立即执行函数结束
</script> <!-- 主屏幕 App 底部白边修正结束 -->
<title>双色球 / 大乐透 随机选号</title> <!-- 页面标题 -->
<style> /* 页面样式开始 */
:root { /* 全局变量（浅色模式的默认值） */
  /* 浅色、深色跟随系统切换 */
  color-scheme: light dark; /* 让浏览器自带控件也跟随系统深浅模式 */
  --bg-page:#eef2ff; /* 页面加载前和背景画布出现前的底色 */
  --bg-canvas:linear-gradient(180deg,#f7f3ff 0%,#eef2ff 100%); /* 页面底层的渐变底色 */
  --text-main:#111827; /* 主要文字颜色 */
  --text-sub:rgba(17,24,39,.78); /* 次要文字颜色（半透明）：分段控件未选中的选项，在彩色液体上也要看得清 */
  --primary:#4f46e5; /* 主题色：焦点框等 */
  /* 号码球：高光、主色、暗部（页面和导出图片共用） */
  --red-hi:#ff8a8a; /* 红球高光色 */
  --red:#ef4444; /* 红球主色 */
  --red-lo:#d22f2f; /* 红球暗部色 */
  --blue-hi:#8ab8ff; /* 蓝球高光色 */
  --blue:#3b82f6; /* 蓝球主色 */
  --blue-lo:#2563d9; /* 蓝球暗部色 */
  /* 液态背景：十种液体颜色 */
  --liquid-1:#5b8cff; /* 液体颜色 1：蓝 */
  --liquid-2:#a35bff; /* 液体颜色 2：紫 */
  --liquid-3:#ff6fb1; /* 液体颜色 3：粉 */
  --liquid-4:#ff9f45; /* 液体颜色 4：橙 */
  --liquid-5:#3fd0c9; /* 液体颜色 5：青 */
  --liquid-6:#7b6cff; /* 液体颜色 6：靛 */
  --liquid-7:#ffd166; /* 液体颜色 7：金黄 */
  --liquid-8:#5ee6a0; /* 液体颜色 8：薄荷绿 */
  --liquid-9:#ff7a7a; /* 液体颜色 9：珊瑚红 */
  --liquid-10:#4cc9ff; /* 液体颜色 10：天蓝 */
  /* 整屏液体的调色：颜色倍率 混白比例 */
  --liquid-tone:1 .12; /* 浅色：颜色倍率 1，混入 12% 白色：柔和但仍饱满，玻璃的折射和彩边才看得出来（混白太多整屏发粉、玻璃显得发白） */
  --title-glow:0 0 14px rgba(255,255,255,.9),0 0 2px rgba(255,255,255,.8); /* 标题外发光：白色光晕让标题在彩色液体上更清楚 */
  --label-glow:0 0 8px rgba(255,255,255,.8),0 0 2px rgba(255,255,255,.6); /* 分段控件文字的光晕：液体颜色较深时也看得清 */
  /* 液体玻璃材质（iOS 27 通透）：几乎全透，靠边缘高光、暗边和折射勾出轮廓 */
  --glass-bg:rgba(255,255,255,.03); /* 玻璃底色：3% 白，几乎全透明 */
  --glass-bg-strong:rgba(255,255,255,.55); /* 较实的玻璃底色（普通按钮用） */
  --glass-blur:blur(4px) saturate(140%) brightness(1.02); /* CSS 玻璃的背景模糊、提饱和、提亮（不用 WebGL 时） */
  --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%); /* 玻璃左上角的镜面反光 */
  --glass-rim:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.42) 20%,rgba(255,255,255,.22) 42%,rgba(255,255,255,.22) 62%,rgba(255,255,255,.42) 82%,rgba(255,255,255,.9)); /* 玻璃边缘高光描边的渐变：左上和右下最亮，中段保留 22% 白，右上角和左下角的描边不会断开；整体不用纯白，浅背景上不显得发白 */
  /* 不用扩散值（spread）：Safari 26 遇到大圆角 + 扩散值的阴影会在元素后面画出方形色块 */
  --glass-edge:0 0 .5px rgba(15,23,42,.3),0 0 .5px rgba(15,23,42,.3),0 0 2px rgba(15,23,42,.1); /* 玻璃外圈深色细边：两层 0.5px 模糊阴影叠加 */
  --glass-border:rgba(15,23,42,.16); /* 大面板的深色细边颜色（用 border 画） */
  --glass-inset: /* 玻璃内侧高光（多行取值，下面每行一层） */
    inset 0 1px 0 rgba(255,255,255,.95), /* 顶部一条 1px 白色亮线 */
    inset 2px 2px 4px rgba(255,255,255,.6), /* 左上内侧透镜光带 */
    inset -2px -2px 4px rgba(255,255,255,.4), /* 右下内侧透镜光带 */
    inset 0 0 16px rgba(255,255,255,.2); /* 内侧整圈柔光 */
  --glass-shadow: /* 小控件的完整玻璃阴影（多行取值） */
    var(--glass-edge), /* 深色细边 */
    var(--glass-inset), /* 内侧高光 */
    0 12px 32px rgba(31,41,95,.14), /* 远处柔和投影 */
    0 2px 6px rgba(31,41,95,.08); /* 近处清晰投影 */
  /* WebGL 玻璃：磨砂半径 高光 顶部反光 提亮；玻璃底色；边缘反光的取色；面板投影颜色 */
  --gl-look:2 .3 .035 1; /* 浅色：磨砂半径 2、高光 0.3、顶部反光 0.035、不提亮（提亮会让玻璃像一层乳白膜） */
  --gl-tint:rgba(20,22,40,.03); /* 浅色 WebGL 玻璃底色：3% 深蓝灰，与深色模式同一思路，玻璃略深于背景，显得通透 */
  --gl-sheen:.6; /* 浅色：边缘反光 60% 取玻璃里背景的颜色（在浅背景上纯白反光会把边缘洗成白雾） */
  --gl-shadow:rgba(40,30,90,.08); /* WebGL 画的面板投影颜色 */
  --rim-w:1.5px; /* 高光描边宽度 */
  --glow:rgba(255,255,255,.8); /* 触摸发光的颜色 */
  --tint-primary:rgba(79,70,229,.9); /* 主按钮的靛蓝底色 */
  --thumb-bg:rgba(255,255,255,.88); /* 分段控件滑块的底色 */
  --thumb-lens:rgba(255,255,255,.4); /* 按住滑块时的透镜底色（更透） */
  /* 保存弹窗：遮罩、玻璃底色、背景模糊、提示文字 */
  --overlay-bg:rgba(15,23,42,.25); /* 保存弹窗遮罩的颜色 */
  --scrim-filter:blur(18px) saturate(120%); /* 保存弹窗后面的页面：模糊并略提饱和 */
  --glass-modal:rgba(255,255,255,.22); /* 保存弹窗的玻璃底色 */
  --modal-filter:blur(12px) saturate(160%) brightness(1.08); /* 保存弹窗的背景模糊、提饱和、提亮 */
  --modal-tip:rgba(17,24,39,.78); /* 弹窗提示文字颜色 */
  --modal-tip-shadow:0 1px 6px rgba(255,255,255,.7); /* 弹窗提示文字的光晕 */
  /* 导出图片：背景、画布底色、标题颜色 */
  --export-bg:linear-gradient(160deg,#ffffff 0%,#f4f2ff 55%,#eef3ff 100%); /* 导出图片的背景渐变 */
  --export-base:#f4f2ff; /* 导出图片的画布底色 */
  --export-title:#111827; /* 导出图片标题颜色 */
  /* 同心圆角：外圆角 = 控件半高 + 内边距 */
  --screen-extra:0px; /* iOS 主屏幕 App 里屏幕比视口高出的部分（由页面开头的脚本计算），背景层多延伸这么多，底部不露白边 */
  --strip:#a99af0; /* iOS 主屏幕 App 底部系统色条的颜色（浅色）：中紫，与液体和靛蓝按钮协调，不显白 */
  --pad:10px; /* 卡片内边距 */
  --ctl-h:46px; /* 按钮、分段控件的高度 */
  --radius-outer:calc(var(--ctl-h) / 2 + var(--pad)); /* 卡片外圆角 = 控件半高 + 内边距，内外圆角同心 */
}
@media (prefers-color-scheme: dark) { /* 系统为深色模式时覆盖下面的变量 */
  :root { /* 深色模式的变量 */
    --bg-page:#0b1026; /* 深色底色 */
    --bg-canvas:linear-gradient(180deg,#07081a 0%,#0b1026 100%); /* 深色渐变底色 */

    --text-sub:rgba(241,245,249,.75); /* 深色模式次要文字：在彩色液体上也要看得清 */
    --primary:#818cf8; /* 深色模式主题色：浅靛 */
    --liquid-1:#3d6bff; /* 深色液体颜色 1：蓝 */
    --liquid-2:#8b3dff; /* 深色液体颜色 2：紫 */
    --liquid-3:#ff3d8f; /* 深色液体颜色 3：玫红 */
    --liquid-4:#ff8a24; /* 深色液体颜色 4：橙 */
    --liquid-5:#1fb8b0; /* 深色液体颜色 5：青 */
    --liquid-6:#5a4dff; /* 深色液体颜色 6：靛 */
    --liquid-7:#ffb020; /* 深色液体颜色 7：金黄 */

    --liquid-10:#1ea7ff; /* 深色液体颜色 10：天蓝 */

    --label-glow:0 0 8px rgba(0,0,0,.72),0 0 2px rgba(0,0,0,.55); /* 深色分段控件文字的光晕：黑色（金黄、绿色等亮色液体上也看得清） */
    --glass-bg:rgba(20,22,40,.08); /* 深色玻璃底色：8% 深蓝灰 */
    --glass-bg-strong:rgba(54,60,84,.74); /* 深色较实的玻璃底色 */

    --glass-spec:radial-gradient(120% 85% at 18% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%); /* 深色镜面反光（更弱） */
    --glass-rim:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.2) 20%,rgba(255,255,255,.1) 42%,rgba(255,255,255,.1) 62%,rgba(255,255,255,.18) 82%,rgba(255,255,255,.55)); /* 深色高光描边（更弱），中段保留 10% 白，描边不断开 */
    --glass-edge:0 0 .5px #000,0 0 .5px #000,0 0 2px rgba(0,0,0,.55); /* 深色外圈黑色细边 */
    --glass-border:rgba(0,0,0,.6); /* 深色大面板细边颜色 */
    --glass-inset: /* 深色内侧高光（多行取值） */
      inset 0 1px 0 rgba(255,255,255,.3), /* 顶部亮线（更弱） */
      inset 2px 2px 4px rgba(255,255,255,.16), /* 左上透镜光带 */
      inset -2px -2px 4px rgba(255,255,255,.08), /* 右下透镜光带 */
      inset 0 0 16px rgba(255,255,255,.05); /* 内侧柔光 */
    --glass-shadow: /* 深色小控件的玻璃阴影（多行取值） */
      var(--glass-edge), /* 深色细边 */

    --modal-filter:blur(12px) saturate(160%) brightness(1.3); /* 深色弹窗背景模糊，提亮更多 */
    --modal-tip:rgba(241,245,249,.85); /* 深色弹窗提示文字 */
    --modal-tip-shadow:0 1px 6px rgba(0,0,0,.5); /* 深色弹窗提示文字的阴影 */
    --export-bg:linear-gradient(160deg,#151b3d 0%,#0b1026 55%,#1c1033 100%); /* 深色导出图片背景渐变 */
    --export-base:#0b1026; /* 深色导出图片画布底色 */

  }

/* 系统“降低透明度”时改用实底材质 */
@media (prefers-reduced-transparency: reduce) { /* 系统开启“降低透明度”时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#ffffff; /* 玻璃改为白色实底 */
    --glass-bg-strong:#ffffff; /* 较实的玻璃也改为白色实底 */
    --glass-modal:#ffffff; /* 弹窗改为白色实底 */
    --glass-blur:none; /* 不做背景模糊 */
    --scrim-filter:none; /* 弹窗后面的页面只压暗、不模糊 */
    --overlay-bg:rgba(15,23,42,.55); /* 不模糊时压得更暗，背后的内容不抢眼 */
    --glass-spec:none; /* 去掉镜面反光 */
  }
}
@media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) { /* 降低透明度且为深色模式时 */
  :root { /* 覆盖玻璃变量 */
    --glass-bg:#1e2333; /* 玻璃改为深色实底 */

  mask-image:linear-gradient(to bottom,transparent,#000 18px); /* 顶部 18px 渐隐 */
}
.deep-log.fade-bottom { /* 下面还有内容没显示：底部渐隐，提示可以往下滑 */
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent); /* 底部 18px 渐隐（Safari） */
  mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent); /* 底部 18px 渐隐 */
}
.deep-log.fade-top.fade-bottom { /* 上下都还有内容：两头都渐隐 */
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 18px),transparent); /* 上下各 18px 渐隐（Safari） */
  mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 18px),transparent); /* 上下各 18px 渐隐 */
}
.deep-p { /* 思考过程的一段 */
  margin:0 0 6px; /* 段落间距 */
}
.deep-step { /* 每段开头加粗的小标题，例如“第二步｜回测” */
  font-weight:700; /* 加粗 */
  margin-right:6px; /* 和正文的间距 */
}
.deep-p.live { /* 实时更新的一段（神经网络训练进度） */
  color:var(--text-sub); /* 颜色淡一点 */
  font-variant-numeric:tabular-nums; /* 数字等宽 */
}
/* 随机选号过程：剩下的号码淡一点，抽中的号码醒目 */
.draw-pool { /* 剩下的号码 */
  color:var(--text-sub); /* 次要文字颜色 */
  font-variant-numeric:tabular-nums; /* 数字等宽，排得整齐 */
}
.draw-hit { /* 抽中的号码 */
  font-weight:700; /* 加粗 */
  color:var(--primary); /* 主题色 */
}
/* 一注卡片：表单和过程窗口之间单独一块玻璃卡片，只放选出的一注（随机选号、深度思考都是） */
.pick-box { /* 一注卡片 */
  flex-shrink:0; /* 不被压缩 */
  border-radius:var(--radius-outer); /* 外圆角，和其他卡片一致 */
  padding:14px; /* 内边距，和结果卡片一致 */
}
.pick-line { /* 一注号码 */
  display:flex; /* 横排 */
  justify-content:center; /* 居中 */
  height:34px; /* 球的直径 */
}
.pick-line .ball { /* 一注里的号码球：比结果区的大一点，更醒目 */
  width:34px; /* 宽 */
  height:34px; /* 高 */
  margin:0 4px; /* 左右各留 4px */
  font-size:1rem; /* 字号 */
}
.ball.ghost { /* 还没算出来的球：只有淡淡的颜色和一圈细边 */
  background:none; /* 不要球的渐变 */
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45); /* 细边 */
}
.ball.ghost.red {background-color:rgba(239,68,68,.22);} /* 红球位置：淡红 */
.ball.ghost.blue {background-color:rgba(59,130,246,.24);} /* 蓝球位置：淡蓝 */
.pick-line.thinking .ghost { /* 思考中：空球依次呼吸 */
  animation:ghost-breathe 1.4s ease-in-out infinite; /* 1.4 秒一次 */
}
@keyframes ghost-breathe { /* 呼吸 */
  50% {opacity:.45;transform:scale(.88);} /* 中间变淡、缩小 */
}
.pick-line .ball.reveal { /* 算出来的号码：一个个弹出来 */
  animation:pick-in .45s cubic-bezier(.34,1.56,.64,1) both; /* 带回弹 */
}
@keyframes pick-in { /* 弹出 */
  from {opacity:0;transform:scale(.4);} /* 开始：透明、很小 */
  to {opacity:1;transform:none;} /* 结束：原样 */
}
@keyframes think-pulse { /* 闪动 */
  50% {opacity:.25;} /* 中间变淡 */
}
@media (prefers-reduced-motion: reduce) { /* 减弱动态效果时 */
  .deep-dot, /* 思考中的闪动圆点、 */
  .pick-line .ghost, /* 一注的空球、 */
  .pick-line .ball.reveal {animation:none;} /* 一注的号码不做动画 */
}
.segmented:active input:enabled ~ .segmented-thumb { /* 按住分段控件（且未禁用）时的滑块 */
  --thumb-s:1.1; /* 放大 1.1 倍，像透镜 */
  background-color:var(--thumb-lens); /* 底色更透 */
  box-shadow: /* 透镜阴影（多行取值） */
    var(--glass-edge), /* 深色细边 */
    inset 0 1px 0 rgba(255,255,255,.9), /* 顶部亮线 */
    inset 2px 2px 4px rgba(255,255,255,.55), /* 左上透镜光带 */
    inset -2px -2px 4px rgba(255,255,255,.4), /* 右下透镜光带 */
    0 8px 20px rgba(0,0,0,.16); /* 更远更明显的投影 */
}
.segmented input:focus-visible ~ .segmented-thumb { /* 单选框获得键盘焦点时的滑块 */
  outline:2px solid var(--primary); /* 显示焦点框 */
  outline-offset:2px; /* 焦点框离滑块 2px */
}
.segmented input:disabled ~ label { /* 单选框禁用（生成中）时的选项文字 */
  cursor:not-allowed; /* 鼠标显示为禁止 */
}
.button-group { /* 按钮组 */
  display:flex; /* 横向排列 */
  gap:var(--pad); /* 按钮之间的间距 */
  margin-top:var(--pad); /* 与上方分段控件的间距 */
}
button { /* 按钮 */
  position:relative; /* 建立定位上下文，供伪元素定位 */
  isolation:isolate; /* 新建层叠上下文，让发光层留在文字下面 */
  flex:1; /* 平分剩余宽度 */
  height:var(--ctl-h); /* 高度 */
  padding:0 12px; /* 左右内边距 */
  font-size:1rem; /* 字号 */
  font-weight:600; /* 粗体 */
  font-family:inherit; /* 字体跟随页面（按钮默认不继承） */
  border-radius:calc(var(--ctl-h) / 2); /* 胶囊形圆角 */
  border:none; /* 去掉默认边框 */
  background:var(--glass-spec),var(--glass-bg-strong); /* 镜面反光叠在较实的玻璃底色上 */
  color:var(--primary); /* 文字用主题色 */
  cursor:pointer; /* 鼠标显示为手形 */
  box-shadow:var(--glass-shadow); /* 完整玻璃阴影 */
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),filter .25s,opacity .25s,background-color .25s; /* 按下放大用带回弹的曲线，滤镜、透明度、底色平滑过渡 */
}
button.prominent { /* 主按钮（生成号码、保存图片） */
  --glow:rgba(255,255,255,.35); /* 触摸发光调弱，避免盖住白字 */
  background:var(--glass-spec),var(--tint-primary); /* 镜面反光叠在靛蓝底色上 */
  color:#fff; /* 白色文字 */
}
button:active { /* 按下按钮时 */
  transform:scale(1.07); /* 像凝胶一样放大 */
  filter:brightness(1.1) saturate(1.1); /* 提亮、提饱和 */
}
button:focus-visible { /* 按钮获得键盘焦点时 */
  outline:2px solid var(--primary); /* 显示焦点框 */
  outline-offset:2px; /* 焦点框离按钮 2px */
}
/* 生成过程中只禁止点击，外观保持不变 */
button:disabled { /* 禁用的按钮 */
  opacity:1; /* 不变淡 */
  filter:none; /* 不变灰 */
  transform:none; /* 不放大 */
  cursor:not-allowed; /* 鼠标显示为禁止 */
}
.result-box { /* 结果卡片 */
  border-radius:var(--radius-outer); /* 外圆角 */
  padding:14px; /* 内边距 */
  width:100%; /* 宽度铺满 */
  height:210px; /* 固定高度，正好放下 5 行号码 */
  overflow-y:hidden; /* 超出部分裁掉 */
  flex-shrink:0; /* 不被压缩 */
}
.result-inner { /* 结果内容 */
  height:100%; /* 占满结果卡片的内容区 */
  overflow:hidden; /* 深度思考的步骤放不下时在这里滚动（不能滚动卡片本身：卡片的高光描边会跟着移位） */
  display:flex; /* 用 flex 布局 */
  flex-direction:column; /* 纵向排列每行号码 */
  justify-content:flex-start; /* 从顶部开始排 */
  align-items:center; /* 每行水平居中 */
  width:100%; /* 宽度铺满 */
  gap:10px; /* 行间距 */
}
/* 号码球：带高光的着色玻璃珠 */
.ball { /* 号码球 */
  width:28px; /* 宽度 */
  height:28px; /* 高度 */
  margin:0 4px; /* 左右各留 4px */
  border-radius:50%; /* 圆形 */
  display:inline-flex; /* 行内 flex，让数字居中 */
  align-items:center; /* 垂直居中 */
  justify-content:center; /* 水平居中 */
  font-size:.85rem; /* 字号 */
  font-weight:600; /* 粗体 */
  color:#fff; /* 白色数字 */
  text-shadow:0 1px 1px rgba(0,0,0,.18); /* 数字下方淡淡的阴影 */
  box-shadow: /* 球的立体感（多行取值） */
    inset 0 1px 1px rgba(255,255,255,.6), /* 顶部内侧高光 */
    inset 0 -2px 3px rgba(0,0,0,.12), /* 底部内侧暗部 */
    0 2px 5px rgba(15,23,42,.18); /* 球下方的投影 */
}
/* 数字按字形居中：裁掉行框上下的字体留白，只留大写字母高度到基线（数字与大写字母同高），再由 flex 居中。
   不裁剪时居中的是整个行框，留白上下不对称，数字会偏上或偏下（随字体和字号变化）；不支持 text-box 的旧浏览器保持原样 */
.ball-num { /* 号码数字 */
  display:block; /* 块级显示（text-box 裁剪只对块级容器生效） */
  text-box-trim:trim-both; /* 裁掉首行上方和末行下方的字体留白 */
  text-box-edge:cap alphabetic; /* 上边裁到大写字母顶端，下边裁到字母基线 */
}
.red {background:radial-gradient(circle at 32% 26%,var(--red-hi) 0%,var(--red) 55%,var(--red-lo) 100%);} /* 红球：左上偏高光的径向渐变 */
.blue {background:radial-gradient(circle at 32% 26%,var(--blue-hi) 0%,var(--blue) 55%,var(--blue-lo) 100%);} /* 蓝球：左上偏高光的径向渐变 */
@media (max-width:360px) { /* 屏幕宽度不超过 360px 时 */
  :root {--ctl-h:42px;--pad:8px;} /* 控件和内边距缩小 */
  .ball {width:24px;height:24px;font-size:.75rem;} /* 号码球缩小到 24px */
  .pick-line {height:30px;} /* 一注的行高跟着缩小 */
  .pick-line .ball {width:30px;height:30px;margin:0 3px;font-size:.85rem;} /* 一注的球缩小到 30px */
  button, /* 按钮、 */
  .segmented label {font-size:.9rem;} /* 选项文字的字号缩小 */
}
/* 横屏时高度不够放下上下排列的内容（页面不能滚动），改为标题在上、选择和结果左右并排 */
@media (orientation:landscape) and (max-height:520px) { /* 横屏且高度不超过 520px 时 */
  .container { /* 内容容器 */
    max-width:820px; /* 最宽 820px */
    display:grid; /* 改用网格布局 */
    grid-template-columns:1fr 1fr; /* 两栏等宽 */
    align-items:center; /* 两栏垂直居中对齐 */
    gap:12px 16px; /* 行间距 12px，列间距 16px */
    padding-top:max(12px, env(safe-area-inset-top)); /* 上方留白减小，并避开安全区 */
    padding-bottom:max(12px, env(safe-area-inset-bottom)); /* 下方留白减小，并避开安全区 */
  }
  .form-box {grid-column:1;grid-row:2 / span 2;} /* 表单：左栏 */
  .pick-box {grid-column:2;grid-row:2;} /* 一注：右栏上面 */
  .result-box {grid-column:2;grid-row:3;} /* 过程窗口：右栏下面 */
  h1 { /* 标题 */
    grid-column:1 / -1; /* 横跨两栏 */
    font-size:1.25rem; /* 字号缩小 */
    margin:0; /* 去掉外边距 */
  }
}
.ios-save-overlay { /* 保存图片弹窗的遮罩 */
  position: fixed; /* 固定在视口上 */
  top: 0; /* 贴住顶部 */
  right: 0; /* 贴住右边 */
  bottom: calc(0px - var(--screen-extra)); /* 贴住底部；主屏幕 App 里多往下延伸状态栏的高度，压暗整个屏幕 */
  left: 0; /* 贴住左边 */
  z-index: 99999; /* 放在所有内容上面 */
  /* 遮罩本身只压暗，并用背景色淡入：遮罩带模糊或透明度小于 1 时，弹窗自己的背景模糊看不到后面的页面；
     页面模糊交给遮罩里、弹窗旁边的单独一层（.ios-save-blur） */
  background: rgba(0, 0, 0, 0); /* 初始完全透明 */
  transition: background-color 0.22s ease; /* 遮罩颜色 0.22 秒淡入淡出 */
  isolation: isolate; /* 新建层叠上下文 */
  -webkit-transform: translateZ(0); /* 开启 GPU 合成（Safari） */
  transform: translateZ(0); /* 开启 GPU 合成 */
  touch-action: none; /* 禁止触摸手势 */
}
.ios-save-overlay.show { /* 显示时的遮罩 */
  background: var(--overlay-bg); /* 压暗背后的页面 */
}
.ios-save-blur { /* 弹窗后面的模糊层：和弹窗并列（不是弹窗的父元素），弹窗的玻璃仍能透出后面 */
  position: absolute; /* 铺满遮罩 */
  inset: 0; /* 四边贴齐 */
  -webkit-backdrop-filter: var(--scrim-filter); /* 模糊后面的页面（Safari） */
  backdrop-filter: var(--scrim-filter); /* 模糊后面的页面 */
  opacity: 0; /* 初始看不到 */
  transition: opacity .22s ease; /* 和遮罩一起淡入淡出 */
  pointer-events: none; /* 不挡点击：点弹窗外面仍能关闭 */
}
.ios-save-overlay.show .ios-save-blur { /* 显示时的模糊层 */
  opacity: 1; /* 完全显示 */
}
/* 弹窗的居中区域：不用固定定位，和页面内容在同一个坐标里、按同样的安全区居中。
   iOS 26 主屏幕 App 里固定定位的元素可能被挪位置（WebKit Bug 301108），而页面内容的位置是对的 */
.ios-save-stage { /* 弹窗的居中区域 */
  position: absolute; /* 相对页面定位（页面不滚动，和 body 重合） */
  top: 0; /* 贴住页面顶部 */
  left: 0; /* 贴住页面左边 */
  width: 100%; /* 和页面一样宽 */
  height: 100%; /* 和页面一样高 */
  z-index: 100000; /* 盖在遮罩上面 */
  display: flex; /* 用 flex 布局 */
  align-items: center; /* 弹窗垂直居中 */
  justify-content: center; /* 弹窗水平居中 */
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); /* 避开状态栏和底部横条，和页面内容的留白方式一致 */
  pointer-events: none; /* 自己不接收点击：点弹窗外面落到遮罩上，关闭弹窗 */
}
html.ios-app .ios-save-stage { /* 主屏幕 App 里 */
  min-height: var(--screen-h); /* 和页面一样至少一个屏幕高 */
}
.ios-save-modal { /* 保存图片弹窗 */
  position: relative; /* 建立定位上下文，供高光描边定位 */
  width: min(340px, 85vw); /* 宽 340px，屏幕窄时为屏幕宽度的 85% */
  max-height: 80vh; /* 最高为屏幕高度的 80% */
  padding: 14px; /* 内边距 */
  /* 通透玻璃：透过弹窗看到后面模糊的液体，比压暗的背景亮一些 */
  background: var(--glass-spec), var(--glass-modal); /* 镜面反光叠在玻璃底色上 */
  -webkit-backdrop-filter: var(--modal-filter); /* 背景模糊（Safari） */
  backdrop-filter: var(--modal-filter); /* 背景模糊 */
  border-radius: 32px; /* 圆角 */
  border: .5px solid var(--glass-border); /* 深色细边 */
  box-shadow: var(--glass-inset); /* 内侧高光 */
  display: flex; /* 用 flex 布局 */
  flex-direction: column; /* 纵向排列：图片、提示、关闭按钮 */
  align-items: center; /* 水平居中 */
  overflow: hidden; /* 超出部分裁掉 */
  pointer-events: auto; /* 弹窗本身可以点 */
  -webkit-transform: translateZ(0) scale(.9); /* 初始缩小到 90%（Safari） */
  transform: translateZ(0) scale(.9); /* 初始缩小到 90% */
  -webkit-filter: blur(10px); /* 初始模糊（Safari） */
  filter: blur(10px); /* 初始模糊 */
  opacity: 0; /* 初始透明 */
  transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .3s ease, -webkit-filter .3s ease, opacity .22s ease; /* 缩放带回弹，模糊和透明度平滑过渡 */
}
.ios-save-stage.show .ios-save-modal { /* 显示时的弹窗 */
  -webkit-transform: translateZ(0) scale(1); /* 恢复原大小（Safari） */
  transform: translateZ(0) scale(1); /* 恢复原大小 */
  -webkit-filter: none; /* 变清晰（Safari） */
  filter: none; /* 变清晰 */
  opacity: 1; /* 完全不透明 */
}
.ios-save-preview { /* 弹窗里的预览图 */
  display: block; /* 块级显示 */
  width: 100%; /* 宽度铺满弹窗 */
  height: auto; /* 高度按比例 */
  max-height: 65vh; /* 最高为屏幕高度的 65% */
  object-fit: contain; /* 完整显示图片，不裁剪 */
  border-radius: 18px; /* 圆角 */
  -webkit-user-select: none; /* 禁止选中（Safari） */
  user-select: none; /* 禁止选中 */
  -webkit-touch-callout: default; /* 允许长按弹出“存储到照片”菜单 */
}
.ios-save-tip { /* 弹窗提示文字 */
  margin-top: 10px; /* 与图片的间距 */
  font-size: 13px; /* 字号 */
  line-height: 20px; /* 行高 */
  color: var(--modal-tip); /* 文字颜色 */
  text-shadow: var(--modal-tip-shadow); /* 文字光晕，让它在彩色液体上也清楚 */
  text-align: center; /* 居中 */
}
.ios-save-close { /* 弹窗的关闭按钮 */
  --glow: rgba(255, 255, 255, 0.35); /* 触摸发光调弱，避免盖住白字 */
  flex: none; /* 不伸缩（按钮默认会平分宽度） */
  width: 100%; /* 宽度铺满弹窗 */
  margin-top: 10px; /* 与提示文字的间距 */
  background: var(--glass-spec), var(--tint-primary); /* 镜面反光叠在靛蓝底色上 */
  color: #fff; /* 白色文字 */
  font-size: 15px; /* 字号 */
}
/* ===== 开屏页：每次打开时显示开屏图片和加载进度条，页面加载好后淡出 ===== */
.splash { /* 开屏页：盖住整个屏幕 */
  position: fixed; /* 固定在屏幕上 */
  top: 0; /* 贴住顶部 */
  left: 0; /* 贴住左边 */
  width: 100%; /* 铺满宽度 */
  height: 100vh; /* 铺满高度（旧浏览器） */
  height: 100lvh; /* 铺满大视口，盖住 iOS 工具栏区域 */
  height: calc(100lvh + var(--screen-extra)); /* 主屏幕 App 里再多延伸状态栏的高度 */
  z-index: 200000; /* 盖在所有内容和弹窗上面 */
  overflow: hidden; /* 画面超出屏幕的部分裁掉 */
  background: #f1f3fe; /* 和开屏图片边缘一样的淡蓝白色：图片没载入或没铺满时不突兀 */
  transition: opacity .45s ease; /* 淡出 */
}
html.ios-app .splash { /* 主屏幕 App 里 */
  min-height: var(--screen-h); /* 至少铺满整个屏幕 */

// ===== 深度思考：多专家 + 回测 + 贝叶斯加权 + 候选优化 + 自我检查，过程像推理模型一样实时显示 =====
// 开奖是独立随机事件，任何号码组合的中奖概率都一样，历史统计不能提高中奖概率。这里按严谨的预测流程来做，并如实显示结论：
// 1. 四位“专家”各自给下一期每个号码估概率：频率（按时间衰减加权，半衰期用回测前的数据调参）、遗漏（历史上同样遗漏时的开出率）、

const DEEP={window:200,tune:300,pool:20,temper:5} // 深度思考设置：回测最近 200 期、调参用回测前的 300 期、从最被看好的 20 个红球里选号、权重的缓和系数
const NN={features:10,hidden:16,epochs:6,train:1100,valid:200} // 神经网络设置：每个号码 10 项特征、隐藏层 16 个神经元、训练 6 轮、用 1100 期训练、最近 200 期留作回测（和其他专家同一段）
const historyCache={} // 已读取的开奖历史：彩种 → 数据
async function loadHistory(type){ // 读取开奖历史（data/ssq.json、data/dlt.json，每期：[期号, 日期, 红球, 蓝球]，新的在前）
  if(historyCache[type]) return historyCache[type] // 读过就直接用
  const response=await fetch(`data/${type}.json`,{cache:"no-cache"}) // 向服务器确认最新版本
  if(!response.ok) throw new Error(`HTTP ${response.status}`) // 读取失败
  const data=await response.json() // 解析 JSON
  if(!Array.isArray(data.draws)||data.draws.length<50) throw new Error("数据不完整") // 数据太少

}
function randomFloat(){ // [0,1) 内的随机小数（用加密随机数）
  return randomIntUnbiased(0x100000000)/0x100000000 // 32 位随机整数除以 2^32
}
function seededRandom(text){ // 由一段文字得到固定的“随机数”序列：同样的文字，每次得到的序列完全一样（神经网络的起点用它，结果可以复现）
  let h=2166136261 // FNV-1a 哈希的初始值
  for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)} // 把文字哈希成 32 位整数
  let a=h>>>0 // 种子
  return ()=>{ // 每调用一次给出下一个 [0,1) 的小数（mulberry32 算法）
    a=(a+0x6D2B79F5)>>>0 // 推进状态
    let t=Math.imul(a^a>>>15,a|1) // 打乱
    t^=t+Math.imul(t^t>>>7,t|61) // 再打乱
    return ((t^t>>>14)>>>0)/4294967296 // 转成 [0,1)
  }
}
function nnTrainSpan(total){ // 训练用几期：最多 1100 期，前面至少留 100 期用来算特征
  return Math.max(100,Math.min(NN.train,total-NN.valid-100)) // 期数
}
function nnSamples(draws,col,k,max){ // 把开奖历史整理成样本：每一期的每个号码一个样本（10 项特征 → 这一期有没有开出）
  const F=NN.features // 特征个数
  const ch=draws.slice().reverse() // 按时间从早到晚排列
  const T=ch.length // 总期数
  const valid=NN.valid // 验证期数
  const train=nnTrainSpan(T) // 训练期数
  const start=T-train-valid // 第一个样本所在的期
  const W=max+1 // 每期一行（下标 0 不用）
  const pre=new Int32Array((T+1)*W) // 前缀和：pre[t*W+n] 是前 t 期里号码 n 开出的次数
  for(let t=0;t<T;t++){ // 每一期
    for(let n=1;n<=max;n++) pre[(t+1)*W+n]=pre[t*W+n] // 先抄上一行
    for(const n of ch[t][col]) pre[(t+1)*W+n]++ // 这一期开出的号码加一
  }
  const count=(t,w,n)=>pre[t*W+n]-pre[Math.max(0,t-w)*W+n] // 第 t 期之前 w 期里号码 n 开出的次数
  const expect=w=>w*k/max // w 期里每个号码平均开出的次数
  const rows=(T-start+1)*max // 样本数：训练 + 验证 + 最后一组（下一期，用来预测）
  const X=new Float32Array(rows*F) // 特征
  const Y=new Uint8Array(rows) // 答案：这一期开出了就是 1
  const last=new Int32Array(W).fill(-1) // 每个号码最近一次开出的期
  for(let t=0;t<=T;t++){ // 每一期（t=T 是还没开奖的下一期）
    if(t>=start) for(let n=1;n<=max;n++){ // 进入样本范围后的每个号码
      const r=(t-start)*max+n-1 // 样本序号
      const o=r*F // 这个样本的特征从这里开始
      const all=pre[t*W+n] // 之前一共开出几次
      const gap=last[n]<0?t:t-1-last[n] // 遗漏：已经连续几期没开出
      X[o]=count(t,5,n)/expect(5) // 近 5 期热度（1 为平均）
      X[o+1]=count(t,10,n)/expect(10) // 近 10 期热度
      X[o+2]=count(t,30,n)/expect(30) // 近 30 期热度
      X[o+3]=count(t,100,n)/expect(100) // 近 100 期热度
      X[o+4]=all/expect(t) // 长期频率
      X[o+5]=Math.min(gap*Math.max(all,1)/t,5) // 遗漏 ÷ 平均间隔（最多按 5 算）
      X[o+6]=Math.min(gap,60)/60 // 遗漏期数（最多按 60 算）
      X[o+7]=t>=1&&ch[t-1][col].includes(n)?1:0 // 上一期开出过
      X[o+8]=t>=2&&ch[t-2][col].includes(n)?1:0 // 上上期开出过
      X[o+9]=(n-1)/(max-1) // 号码本身的大小
      Y[r]=t<T&&ch[t][col].includes(n)?1:0 // 这一期有没有开出
    }
    if(t<T) for(const n of ch[t][col]) last[n]=t // 记下最近开出的期
  }
  const nTrain=train*max // 训练样本数（排在最前面）
  for(let f=0;f<F;f++){ // 每项特征按训练样本标准化：减平均、除标准差，网络更好学
    let mean=0,sq=0 // 平均值、平方和
    for(let i=0;i<nTrain;i++) mean+=X[i*F+f] // 求和
    mean/=nTrain // 平均值
    for(let i=0;i<nTrain;i++) sq+=(X[i*F+f]-mean)**2 // 平方和
    const sd=Math.sqrt(sq/nTrain)||1 // 标准差（全一样时按 1 算）
    for(let i=0;i<rows;i++) X[i*F+f]=(X[i*F+f]-mean)/sd // 标准化全部样本
  }
  return {X,Y,k,max,train,valid,nTrain,predictAt:(T-start)*max} // 样本、号码规则、训练和验证期数、下一期样本的位置
}
async function trainNet(s,onEpoch,sliceMs=12,rand=randomFloat){ // 训练一个小型神经网络：10 个输入 → 16 个神经元（tanh）→ 1 个输出（这个号码这一期开出的概率）；在主线程上每算 sliceMs 毫秒让一下；rand 决定起点和样本顺序
  const F=NN.features,H=NN.hidden // 输入个数、隐藏层神经元个数
  const W2=H*F,B1=W2+H,B2=B1+H,size=B2+1 // 参数排布：[输入→隐藏的权重 | 隐藏→输出的权重 | 隐藏层偏置 | 输出偏置]，共 size 个
  const w=new Float64Array(size),m=new Float64Array(size),v=new Float64Array(size),g=new Float64Array(size) // 参数、Adam 的一阶和二阶动量、梯度
  for(let i=0;i<B1;i++) w[i]=(rand()*2-1)*Math.sqrt(6/(i<W2?F+H:H+1)) // 权重起点（Xavier 初始化），由 rand 决定
  const base=s.k/s.max // 平均开出概率
  w[B2]=Math.log(base/(1-base)) // 输出偏置从平均概率起步
  const X=s.X,h=new Float64Array(H) // 特征、隐藏层输出
  const forward=i=>{ // 前向计算第 i 个样本，返回开出的概率
    let z=w[B2] // 输出层从偏置开始
    for(let j=0;j<H;j++){ // 每个隐藏神经元
      let a=w[B1+j] // 偏置
      for(let f=0;f<F;f++) a+=w[j*F+f]*X[i*F+f] // 加权求和
      h[j]=Math.tanh(a) // 激活
      z+=w[W2+j]*h[j] // 汇总到输出
    }
    return 1/(1+Math.exp(-z)) // sigmoid 转成概率
  }
  const order=Array.from({length:s.nTrain},(_,i)=>i) // 训练样本的顺序
  const BATCH=128,LR=.005 // 每批样本数、学习率
  let step=0,loss=0,slice=performance.now() // Adam 步数、本轮误差、这一段计算的开始时间
  for(let e=1;e<=NN.epochs;e++){ // 每一轮
    for(let i=order.length-1;i>0;i--){ // 打乱样本顺序
      const j=Math.floor(rand()*(i+1)) // 交换的位置（由 rand 决定）
      ;[order[i],order[j]]=[order[j],order[i]] // 交换
    }
    loss=0 // 本轮误差清零
    for(let b=0;b<order.length;b+=BATCH){ // 每一批
      g.fill(0) // 梯度清零
      const end=Math.min(b+BATCH,order.length) // 这一批的结尾
      for(let q=b;q<end;q++){ // 批里的每个样本
        const i=order[q],p=forward(i),y=s.Y[i] // 样本、预测概率、答案
        loss-=Math.log(Math.max(y?p:1-p,1e-12)) // 交叉熵误差
        const dz=p-y // 输出层的误差信号
        g[B2]+=dz // 输出偏置的梯度
        for(let j=0;j<H;j++){ // 反向传播到每个隐藏神经元
          g[W2+j]+=dz*h[j] // 隐藏→输出权重的梯度
          const dh=dz*w[W2+j]*(1-h[j]*h[j]) // 隐藏神经元的误差信号（tanh 的导数）
          g[B1+j]+=dh // 隐藏层偏置的梯度
          for(let f=0;f<F;f++) g[j*F+f]+=dh*X[i*F+f] // 输入→隐藏权重的梯度
        }
      }
      step++ // Adam 步数加一
      const n=end-b,c1=1-.9**step,c2=1-.999**step // 批大小、动量的偏差修正
      for(let p=0;p<size;p++){ // 用 Adam 更新每个参数
        const gr=g[p]/n // 平均梯度
        m[p]=.9*m[p]+.1*gr // 一阶动量
        v[p]=.999*v[p]+.001*gr*gr // 二阶动量
        w[p]-=LR*(m[p]/c1)/(Math.sqrt(v[p]/c2)+1e-8) // 更新
      }
      if(performance.now()-slice>sliceMs){ // 连续算了 sliceMs 毫秒
        await new Promise(r=>setTimeout(r)) // 让一下，液体动画和页面不卡
        slice=performance.now() // 重新计时
      }
    }
    loss/=order.length // 本轮平均误差
    await onEpoch(e,loss) // 报告进度
    slice=performance.now() // 重新计时
  }
  return {forward,loss} // 网络（前向计算）和最后一轮的误差
}
function deepExperts(ch,col,k,M){ // 三位统计专家：逐期往前走，每期只用它之前的数据，给第 start～T 期（T 是下一期）的每个号码估概率
  const T=ch.length,start=T-DEEP.window,rows=T-start+1,u=k/M // 总期数、回测起点、要估的期数、平均概率
  const HL=[8,16,32,64,128,256],decay=HL.map(h=>Math.pow(.5,1/h)) // 频率专家的候选半衰期（期）和对应的衰减系数

function nnWindow(net,s){ // 神经网络专家：回测期和下一期每个号码的概率（每期归一化到开出个数）

  for(let r=0;r<rows;r++){ // 每一期
    let sum=0;for(let n=0;n<M;n++){P[r*M+n]=net.forward(s.nTrain+r*M+n);sum+=P[r*M+n]} // 网络给的概率
    for(let n=0;n<M;n++)P[r*M+n]=Math.min(.999,Math.max(1e-4,P[r*M+n]*s.k/sum)) // 归一化
  }

async function deepPool(draws,col,k,M,onEpoch,sliceMs){ // 一种球（红球或蓝球）的完整分析：专家打分、回测、贝叶斯加权
  const ch=draws.slice().reverse(),T=ch.length,u=k/M // 按时间从早到晚、总期数、平均概率
  const E=deepExperts(ch,col,k,M) // 三位统计专家
  const s=nnSamples(draws,col,k,M) // 神经网络的样本（最近 200 期留作回测）
  const net=await trainNet(s,onEpoch,sliceMs,seededRandom(`${draws[0][0]}|${draws.length}|${col}|${k}|${M}`)) // 训练：起点由最新期号等固定下来，同样的数据每次训练出同样的网络
  const models=[{key:"uniform",name:"均衡基准",P:null},{key:"freq",name:"频率专家",P:E.freq},{key:"gap",name:"遗漏专家",P:E.gap},{key:"markov",name:"转移专家",P:E.markov},{key:"nn",name:"神经网络",P:nnWindow(net,s)}] // 参与评比的模型
  const prob=(m,r,n)=>m.P?m.P[r*M+n-1]:u // 模型 m 给第 start+r 期号码 n 的概率
  for(const m of models){ // 回测每个模型
    let loss=0,hit=0 // 对数损失、命中
    for(let r=0;r<DEEP.window;r++){ // 回测期的每一期
      const y=new Set(ch[E.start+r][col]),order=[] // 真实开出的号码
      for(let n=1;n<=M;n++){const p=prob(m,r,n);loss-=Math.log(y.has(n)?p:1-p);order.push([n,p])} // 累计损失
      order.sort((a,b)=>b[1]-a[1]);for(let q=0;q<k;q++)if(y.has(order[q][0]))hit++ // 前 k 名里开出了几个
    }

    m.next=Array.from({length:M+1},(_,n)=>n?prob(m,DEEP.window,n):0) // 对下一期的看法
    m.top=m.P?m.next.map((p,n)=>[n,p]).slice(1).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n])=>n):[] // 最看好的 3 个号码

  for(const m of models){m.weight=m.w/z;m.gain=base-m.loss;delete m.w} // 归一化；gain>0 表示比均衡基准好

}
let deepWorkerUrl=null // 后台线程的脚本地址（只生成一次）
function deepWorkerURL(){ // 把分析用到的函数拼成后台线程（Web Worker）的脚本：计算在后台跑，液体动画和思考过程的显示都不卡
  if(!deepWorkerUrl) deepWorkerUrl=URL.createObjectURL(new Blob([[ // 生成脚本地址
    `const NN=${JSON.stringify(NN)}`,`const DEEP=${JSON.stringify(DEEP)}`, // 设置

    `onmessage=async event=>{

  ].join("\n")],{type:"text/javascript"})) // 脚本类型

function runDeepPool(draws,col,k,max,onEpoch){ // 分析一种球：优先放到后台线程，不支持时在主线程上分段算
  const onMainThread=()=>deepPool(draws,col,k,max,onEpoch,12) // 在主线程上算（每 12 毫秒让一下）
  let worker // 后台线程
  try{ worker=new Worker(deepWorkerURL()) }catch(error){ return onMainThread() } // 创建不了就在主线程上算
  return new Promise((resolve,reject)=>{ // 等后台线程算完
    worker.onmessage=event=>{ // 收到后台线程的消息
      const d=event.data // 消息内容
      if(d.done){ worker.terminate(); resolve(d.result); return } // 算完：关掉线程，返回结果
      onEpoch(d.epoch,d.loss) // 训练进度
    }
    worker.onerror=event=>{ // 后台线程出错（例如浏览器不允许）
      event.preventDefault() // 不在控制台报错
      worker.terminate() // 关掉线程
      onMainThread().then(resolve,reject) // 改在主线程上算
    }
    worker.postMessage({draws,col,k,max}) // 把开奖数据交给后台线程
  })
}
function commonSet(values){ // 历史上最常见的取值，合计占到 85% 为止
  const counts={} // 每个取值出现的次数
  values.forEach(v=>{counts[v]=(counts[v]||0)+1}) // 计数
  const order=Object.keys(counts).map(Number).sort((a,b)=>counts[b]-counts[a]) // 按次数从多到少
  const keep=new Set() // 保留的取值
  let covered=0 // 已覆盖的期数
  for(const v of order){ // 从最常见的开始
    keep.add(v) // 保留
    covered+=counts[v] // 累计
    if(covered>=values.length*.85) break // 覆盖 85% 就够了
  }
  return keep // 返回
}
function shapeOf(reds,rule){ // 一注红球的形态：和值、奇数个数、大号个数、每区个数、最长连号
  const half=rule.red[1]/2 // 大小分界：大于一半的算大号
  let run=1,longest=1 // 当前连号长度、最长连号长度
  for(let i=1;i<reds.length;i++){ // 逐个比较相邻号码
    run=reds[i]===reds[i-1]+1?run+1:1 // 连着就加一，否则重新算
    longest=Math.max(longest,run) // 记下最长
  }
  return { // 返回
    sum:reds.reduce((a,b)=>a+b,0), // 和值
    odd:reds.filter(n=>n%2).length, // 奇数个数
    big:reds.filter(n=>n>half).length, // 大号个数
    zoneMax:Math.max(...rule.zones.map(([lo,hi])=>reds.filter(n=>n>=lo&&n<=hi).length)), // 号码最多的那个区有几个
    longest, // 最长连号
  }
}
function analyze(type,data){ // 分析开奖历史，得到加权和筛选条件
  const rule=DEEP_RULES[type] // 规则
  const draws=data.draws // 全部开奖（新的在前）
  const shapes=draws.map(d=>shapeOf(d[2],rule)) // 每期红球的形态
  const sums=shapes.map(x=>x.sum).sort((a,b)=>a-b) // 和值从小到大
  const pct=q=>sums[Math.floor((sums.length-1)*q)] // 百分位数
  const zoneLimit=Math.max(...commonSet(shapes.map(x=>x.zoneMax))) // 历史 85% 的开奖里，单区最多几个号
  const runLimit=Math.max(...commonSet(shapes.map(x=>x.longest))) // 历史 85% 的开奖里，最长连号
  return { // 返回
    rule,draws, // 规则、开奖
    sumRange:[pct(.1),pct(.9)], // 历史 80% 的开奖落在这个和值范围里
    oddSet:commonSet(shapes.map(x=>x.odd)), // 常见的奇数个数
    bigSet:commonSet(shapes.map(x=>x.big)), // 常见的大号个数
    zoneLimit,runLimit, // 单区上限、连号上限
    jackpots:new Set(draws.map(d=>d[2].join(",")+"|"+d[3].join(","))), // 开出过的头奖组合
  }
}
function fitsHistory(reds,a){ // 这注红球的形态是不是历史上常见的
  const x=shapeOf(reds,a.rule) // 形态
  return x.sum>=a.sumRange[0]&&x.sum<=a.sumRange[1]&&a.oddSet.has(x.odd)&&a.bigSet.has(x.big)&&x.zoneMax<=a.zoneLimit&&x.longest<=a.runLimit // 和值、奇偶、大小、区间、连号都在常见范围内
}
function deepPick(a,red,blue,count){ // 选号（不用随机数）：从最被看好的红球里枚举全部组合，去掉少见形态，按得分从高到低依次选出彼此不太像的 count 注
  const R=a.rule,[kr,Mr]=R.red,[kb,Mb]=R.blue // 规则：红球、蓝球的个数和范围
  const byArray=(x,y)=>{for(let i=0;i<x.length;i++) if(x[i]!==y[i]) return x[i]-y[i];return 0} // 两组号码按数字逐个比较（得分一样时用，保证顺序固定）
  const rank=(mix,M)=>Array.from({length:M},(_,i)=>i+1).sort((x,y)=>mix[y]-mix[x]||x-y) // 号码按被看好程度从高到低（一样时号码小的在前）
  const combos=(nums,size,score)=>{ // 列出 nums 里取 size 个的全部组合，算好得分，按得分从高到低排好
    const out=[],cur=[] // 结果、当前组合
    const walk=start=>{ // 逐个往组合里加号码
      if(cur.length===size){out.push({nums:cur.slice(),score:cur.reduce((sum,n)=>sum+score(n),0)});return} // 凑够了
      for(let i=start;i<=nums.length-(size-cur.length);i++){cur.push(nums[i]);walk(i+1);cur.pop()} // 依次尝试
    }
    walk(0) // 开始
    return out.sort((x,y)=>y.score-x.score||byArray(x.nums,y.nums)) // 得分从高到低
  }
  const top=rank(red.mix,Mr).slice(0,DEEP.pool).sort((x,y)=>x-y) // 最被看好的 20 个红球
  const all=combos(top,kr,n=>Math.log(red.mix[n]*Mr/kr)) // 它们的全部组合（得分：各号概率相对平均值的对数之和）
  const list=all.filter(c=>fitsHistory(c.nums,a)) // 去掉少见形态
  const penalty=Math.max(.02,(list[0].score-list[Math.min(list.length,400)-1].score)/4) // 号码重复使用的扣分（按得分的分布定）
  const chosen=[],uses=new Array(Mr+1).fill(0) // 选中的、每个红球已用了几次
  const allowed=c=>!chosen.includes(c)&&c.nums.every(n=>uses[n]<2)&&chosen.every(t=>t.nums.filter(n=>c.nums.includes(n)).length<=R.maxShare) // 没选过、每个红球最多用 2 次、和已选的共用红球不超过上限
  while(chosen.length<count){ // 依次选
    let best=null,bestScore=-Infinity // 这一轮最好的
    for(const c of list){ // 从高分往低分看
      if(!allowed(c)) continue // 不符合规矩
      const adjusted=c.score-penalty*c.nums.reduce((sum,n)=>sum+uses[n],0) // 用过的号码再用要扣分：尽量多覆盖不同号码
      if(adjusted>bestScore){best=c;bestScore=adjusted} // 更好就换（一样时保留先看到的，结果固定）
    }
    best=best||list.find(c=>!chosen.includes(c)) // 实在没有合适的就放宽
    chosen.push(best) // 选中
    best.nums.forEach(n=>uses[n]++) // 记下用过的红球

  const usedBlue=new Set() // 已用过的蓝球
  const tickets=chosen.map(c=>{ // 给每注配蓝球
    const fine=blueSets.filter(b=>!a.jackpots.has(c.nums.join(",")+"|"+b.nums.join(","))) // 不和这注红球凑成历史头奖

  })

function deepCheck(a,tickets){ // 自我检查：逐项核对 5 注号码
  const R=a.rule,reds=new Set(),blues=new Set(),sums=[] // 规则、覆盖的红球、蓝球、和值
  let maxShare=0,rules=true,shapes=true,jackpots=0 // 最大共用红球数、号码规则、形态、历史头奖
  const uses={} // 每个红球用了几次
  const okNums=(v,[n,max])=>v.length===n&&v.every((x,i)=>x>=1&&x<=max&&(!i||x>v[i-1])) // 个数、范围、从小到大不重复
  tickets.forEach((t,i)=>{ // 每一注
    t.red.forEach(n=>{reds.add(n);uses[n]=(uses[n]||0)+1});t.blue.forEach(n=>blues.add(n));sums.push(t.red.reduce((x,y)=>x+y,0)) // 统计
    if(!okNums(t.red,R.red)||!okNums(t.blue,R.blue)) rules=false // 号码规则
    if(!fitsHistory(t.red,a)) shapes=false // 形态
    if(a.jackpots.has(t.red.join(",")+"|"+t.blue.join(","))) jackpots++ // 历史头奖
    tickets.slice(0,i).forEach(o=>{maxShare=Math.max(maxShare,o.red.filter(n=>t.red.includes(n)).length)}) // 两两共用的红球
  })

  return {reds:reds.size,blues:blues.size,sumMin:Math.min(...sums),sumMax:Math.max(...sums),maxShare,maxUse,rules,shapes,jackpots,ok:rules&&shapes&&!jackpots&&maxShare<=R.maxShare&&maxUse<=2} // 结果
}

}

    const p=document.createElement("p") // 一段
    p.className=`deep-p ${cls}` // 样式
    if(label){const b=document.createElement("b");b.className="deep-step";b.textContent=label;p.appendChild(b)} // 小标题
    const body=document.createElement("span") // 正文
    p.appendChild(body) // 放进段落
    log.appendChild(p) // 放进思考过程
    if(quick){body.textContent=text;follow();setTimeout(()=>resolve(body),120);return} // 减弱动态效果：整段出现
    let shown=0,last=performance.now() // 已显示的字数、上一帧时间
    const step=now=>{ // 每一帧
      shown=Math.min(text.length,shown+Math.max(1,Math.round((now-last)*.12))) // 按经过的时间多显示几个字
      last=now;body.textContent=text.slice(0,shown);follow() // 显示
      if(shown<text.length) requestAnimationFrame(step) // 没写完继续
      else setTimeout(()=>resolve(body),160) // 写完停一下

    requestAnimationFrame(step) // 开始

  const nums=v=>v.map(pad2).join(" ") // 号码列表的写法

  const pct=x=>`${Math.round(x*100)}%` // 百分比
  try{ // 尝试
    const data=await loadHistory(type) // 读取开奖历史
    const a=analyze(type,data),draws=a.draws,latest=draws[0] // 形态统计、全部开奖（新的在前）、最新一期
    const [kr,Mr]=rule.red,[kb,Mb]=rule.blue // 红球、蓝球的个数和范围
    let epoch=0,epochLoss=0,liveLine=null // 神经网络的训练进度、显示进度的那一段
    const showEpoch=()=>{if(liveLine) liveLine.textContent=`正在学习近 ${(nnTrainSpan(draws.length)+NN.valid).toLocaleString()} 期 ${"■".repeat(epoch)}${"□".repeat(NN.epochs-epoch)} 误差 ${epoch?epochLoss.toFixed(4):"…"}`} // 更新进度
    const redJob=runDeepPool(draws,2,kr,Mr,(e,loss)=>{epoch=e;epochLoss=loss;showEpoch()}) // 红球分析（后台线程，和下面写字同时进行）
    const blueJob=runDeepPool(draws,3,kb,Mb,()=>{}) // 蓝球分析
    await write("思路",`为${rule.name}精确计算 1 注。先请四位专家给号码打分，用最近 ${DEEP.window} 期检验谁比平均水平强、就多听谁的，再从上万种组合里算出得分最高的一注并自我检查。结论只由开奖数据决定：数据不变，结论就不变，开出新一期才会更新。`)
    await write("数据",`共 ${draws.length.toLocaleString()} 期（${draws[draws.length-1][1]} 至 ${latest[1]}），最新第 ${latest[0]} 期：红 ${nums(latest[2])}，蓝 ${nums(latest[3])}。`)
    await write("第一步｜专家打分",`频率专家看谁出现得多（越近越重要）；遗漏专家看谁多久没出；转移专家看上期号码之后常跟着出谁；神经网络从 ${NN.features} 项特征里自己学。`)
    liveLine=await write("神经网络","","live") // 训练进度这一段
    showEpoch() // 先显示当前进度
    const red=await redJob // 等红球分析完成
    liveLine.textContent=`学完了（${NN.epochs} 轮，误差 ${red.nnLoss.toFixed(4)}；训练起点由第 ${latest[0]} 期固定，结果可以复现）。` // 完成
    liveLine.parentNode.classList.remove("live") // 不再是进度

    const experts=["freq","gap","markov","nn"].map(M) // 四位专家

    const consensus=Object.keys(votes).map(Number).filter(n=>votes[n]>=2).sort((x,y)=>votes[y]-votes[x]||x-y) // 被两位以上专家同时看好的号码
    await write("各自看好",`频率 ${nums(M("freq").top)}｜遗漏 ${nums(M("gap").top)}｜转移 ${nums(M("markov").top)}｜神经网络 ${nums(M("nn").top)}。${consensus.length?`其中 ${list(consensus)} 被两位以上专家同时看好。`:"四位专家的意见各不相同。"}`)
    await write("第二步｜回测",`用最近 ${DEEP.window} 期逐期考试，每期只用它之前的数据，不偷看答案。前 ${kr} 名平均猜中：频率 ${M("freq").hits.toFixed(2)}、遗漏 ${M("gap").hits.toFixed(2)}、转移 ${M("markov").hits.toFixed(2)}、神经网络 ${M("nn").hits.toFixed(2)}；平均水平（每个号码机会均等）是 ${M("uniform").hits.toFixed(2)}。`)
    const blue=await blueJob // 等蓝球分析完成
    const best=experts.reduce((x,y)=>y.gain>x.gain?y:x) // 回测最好的专家
    const ranked=[...red.models].sort((x,y)=>y.weight-x.weight).map(m=>`${m.name} ${pct(m.weight)}`).join("、") // 发言权从高到低
    const blueTop=[...blue.models].sort((x,y)=>y.weight-x.weight)[0] // 蓝球发言权最高的
    await write("第三步｜分配权重",`${best.gain>1?`${best.name}略好于平均水平，但优势很小，不能全信。`:"四位专家都没有明显超过平均水平：开奖本身没有规律可循，历史上的“冷热”多半是巧合。"}所以按考试成绩分配发言权，成绩差距小就不拉开太多：${ranked}（“均衡基准”就是每个号码机会均等）。蓝球里${blueTop.name}的发言权最高（${pct(blueTop.weight)}）。`)
    const pick=deepPick(a,red,blue,1),ticket=pick.tickets[0] // 精确计算：形态常见的组合里得分最高的一注
    const inPick=consensus.filter(n=>ticket.red.includes(n)) // 多位专家共同看好、并且在这一注里的号码
    await write("第四步｜精确计算",`按加权后的分数取前 ${pick.pool} 个红球，列出全部 ${pick.total.toLocaleString()} 种组合，去掉和值、奇偶、大小、分区、连号少见的，剩 ${pick.valid.toLocaleString()} 种，逐一算分，取得分最高的一注：红 ${nums(ticket.red)}。蓝球取分数最高、又不和这注红球凑成历史头奖的：${nums(ticket.blue)}。${!consensus.length?"":inPick.length?`多位专家看好的 ${list(inPick)} 在这一注里。`:"多位专家看好的号码因为分数或形态限制，没有进入这一注。"}`)
    const check=deepCheck(a,pick.tickets) // 自我检查
    await write("第五步｜自我检查",check.ok // 检查通过
      ?`号码个数和范围正确；和值 ${check.sumMin}（常见范围 ${a.sumRange[0]}～${a.sumRange[1]}）；奇偶、大小、分区、连号都在常见范围；不是历史头奖组合。全部通过，给出结果。`
      :`有一项没通过（${[!check.rules&&"号码规则",!check.shapes&&"形态",check.jackpots&&"历史头奖"].filter(Boolean).join("、")}），结果仅供参考。`)
    title.textContent="已深度思考" // 标题改成已完成（不显示用时）
    log.onscroll=fade // 手动滚动时更新上下渐隐
    resultInner.classList.add("deep-done") // 想完了（思考过程留在窗口里，可以上下滑动回看）
    showPick(ticket) // 中间的卡片填上这一注
    resultMode="deep" // 结果来自深度思考
  }catch(error){ // 读取或分析出错
    console.warn("深度思考失败:",error) // 在控制台记录
    showPickGhosts(false) // 一注的位置恢复成空球
    resultInner.innerHTML="" // 清空
    resultInner.className="result-inner" // 普通样式
    const p=document.createElement("div") // 提示
    p.className="deep-p" // 样式
    p.style.alignSelf="stretch" // 占满宽度
    p.textContent="读取开奖历史失败，请联网后重试" // 提示内容
    resultInner.appendChild(p) // 显示
  }finally{ // 无论成败
    isRolling=false // 标记为生成结束
    resultInner.removeAttribute("aria-busy") // 读屏软件播报结果
    toggleButtons(false) // 恢复按钮和切换
  }
}

function formatDateLocal(date){ // 时间格式化为 2026-10-30_123456
  const y=date.getFullYear() // 年
  const m=String(date.getMonth()+1).padStart(2,"0") // 月，补零
  const d=String(date.getDate()).padStart(2,"0") // 日，补零
  const h=String(date.getHours()).padStart(2,"0") // 时，补零
  const min=String(date.getMinutes()).padStart(2,"0") // 分，补零
  const s=String(date.getSeconds()).padStart(2,"0") // 秒，补零
  return `${y}-${m}-${d}_${h}${min}${s}` // 拼成字符串
}
// 导出图片直接用 Canvas 画：版式与原来的截图一致，配色随当前深浅模式。
// 不用 html2canvas 截图：它按自己估算的字体基线画字，iPhone 的苹方、SF 字体上数字会明显偏下
const EXPORT_LAYOUT={ball:28,gap:8,rowGap:12,padX:16,padY:20,titleSize:16,titleHeight:22,titleGap:16,numberSize:13.6} // 导出图片的版式：球直径、球间距、行间距、左右留白、上下留白、标题字号、标题行高、标题与号码的间距、数字字号
// 按字形实际的上下边界垂直居中，不依赖各字体不同的基线和行高
function fillTextCentered(ctx,text,x,cy){ // 在 (x, cy) 处画文字，按字形上下边界垂直居中
  ctx.textBaseline="alphabetic" // 以字母基线为准
  const m=ctx.measureText(text) // 量出文字的尺寸
  if(m.actualBoundingBoxAscent!==undefined){ // 浏览器支持字形的实际上下边界时
    ctx.fillText(text,x,cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2) // 基线下移半个（上沿高度 − 下沿深度），让字形正好居中
  }else{ // 不支持时
    ctx.textBaseline="middle" // 退回以行框中线为准
    ctx.fillText(text,x,cy) // 画文字
  }
}
// 把 CSS 的 linear-gradient(角度, 颜色 位置%, ...) 换成 Canvas 渐变，渐变线长度与 CSS 的算法相同
function canvasLinearGradient(ctx,css,width,height){ // CSS 线性渐变 → Canvas 渐变
  const angle=parseFloat((css.match(/([\d.]+)deg/)||[0,180])[1])*Math.PI/180 // 取角度并换成弧度，没写时默认 180 度（从上到下）
  const dx=Math.sin(angle) // 渐变方向的 x 分量（CSS 0 度朝上，顺时针）
  const dy=-Math.cos(angle) // 渐变方向的 y 分量
  const half=(Math.abs(width*dx)+Math.abs(height*dy))/2 // 渐变线的半长：让渐变刚好覆盖整个矩形的角
  const g=ctx.createLinearGradient(width/2-dx*half,height/2-dy*half,width/2+dx*half,height/2+dy*half) // 从中心沿方向往两边各延伸半长，建立渐变
  for(const m of css.matchAll(/(#[0-9a-f]{3,8}|rgba?\([^)]*\))\s+([\d.]+)%/gi)) g.addColorStop(parseFloat(m[2])/100,m[1]) // 逐个取出“颜色 位置%”，加为色标
  return g // 返回渐变
}
// 与 .red、.blue 的 radial-gradient(circle at 32% 26%, ...) 相同，半径到最远的角；投影与页面上的号码球相同
function drawExportBall(ctx,theme,scale,color,number,x,y,r){ // 画一个导出图片里的号码球
  const gx=x-r+2*r*.32 // 高光中心 x：球左边 + 32% 直径
  const gy=y-r+2*r*.26 // 高光中心 y：球上边 + 26% 直径
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.hypot(x+r-gx,y+r-gy)) // 径向渐变，半径到最远的角（右下角）
  g.addColorStop(0,theme.getPropertyValue(`--${color}-hi`).trim()) // 0%：高光色
  g.addColorStop(.55,theme.getPropertyValue(`--${color}`).trim()) // 55%：主色
  g.addColorStop(1,theme.getPropertyValue(`--${color}-lo`).trim()) // 100%：暗部色
  ctx.save() // 保存画布状态（阴影设置之后恢复）
  // Canvas 的阴影参数不随缩放变化，按导出倍数换算
  ctx.shadowColor="rgba(15,23,42,.18)" // 投影颜色
  ctx.shadowOffsetY=2*scale // 投影向下 2px
  ctx.shadowBlur=5*scale // 投影模糊 5px
  ctx.fillStyle=g // 用渐变填充
  ctx.beginPath() // 开始画路径
  ctx.arc(x,y,r,0,Math.PI*2) // 圆
  ctx.fill() // 填充球
  ctx.shadowColor="rgba(0,0,0,.18)" // 数字阴影颜色
  ctx.shadowOffsetY=scale // 数字阴影向下 1px
  ctx.shadowBlur=scale // 数字阴影模糊 1px
  ctx.fillStyle="#fff" // 白色数字
  fillTextCentered(ctx,number,x,y) // 在球心画数字，按字形居中
  ctx.restore() // 恢复画布状态，去掉阴影
}

function drawExportImage(title){ // 画出导出图片，返回画布
  const L=EXPORT_LAYOUT // 版式参数的简写
  const theme=getComputedStyle(document.documentElement) // 当前深浅模式下的 CSS 变量
  const font=getComputedStyle(document.body).fontFamily // 页面使用的字体
  const lines=exportRows().map(line=>[...line.children].map(ball=>({ // 从页面读出每行的号码球（不含深度思考的标题和思考过程）
    number:ball.textContent, // 号码文字
    color:ball.classList.contains("blue")?"blue":"red" // 颜色：有 blue 类就是蓝球，否则是红球
  })))
  // 至少 2 倍；iPhone 等 3 倍屏按 3 倍导出，图片更清晰
  const scale=Math.min(Math.max(window.devicePixelRatio||1,2),3) // 导出倍数：至少 2，最多 3，跟随屏幕像素密度
  const canvas=document.createElement("canvas") // 新建画布
  const ctx=canvas.getContext("2d") // 取 2D 绘图上下文
  const titleFont=`600 ${L.titleSize}px ${font}` // 标题字体：粗体 16px
  ctx.font=titleFont // 先设好字体，用来量标题宽度
  const columns=Math.max(...lines.map(line=>line.length)) // 最多一行有几个球
  const width=Math.ceil(Math.max(columns*(L.ball+L.gap),ctx.measureText(title).width)+L.padX*2) // 图片宽度：号码行和标题取较宽者，再加左右留白
  const height=L.padY*2+L.titleHeight+L.titleGap+lines.length*L.ball+(lines.length-1)*L.rowGap // 图片高度：上下留白 + 标题 + 间距 + 各行号码 + 行间距
  canvas.width=width*scale // 画布实际像素宽度
  canvas.height=height*scale // 画布实际像素高度
  ctx.scale(scale,scale) // 之后按 CSS 像素坐标作画
  ctx.fillStyle=theme.getPropertyValue("--export-base").trim() // 底色
  ctx.fillRect(0,0,width,height) // 先铺底色
  ctx.fillStyle=canvasLinearGradient(ctx,theme.getPropertyValue("--export-bg"),width,height) // 背景渐变
  ctx.fillRect(0,0,width,height) // 再铺渐变
  ctx.textAlign="center" // 文字水平居中
  ctx.font=titleFont // 标题字体
  ctx.fillStyle=theme.getPropertyValue("--export-title").trim() // 标题颜色
  fillTextCentered(ctx,title,width/2,L.padY+L.titleHeight/2) // 画标题，在标题行内垂直居中
  ctx.font=`600 ${L.numberSize}px ${font}` // 号码数字字体：粗体 13.6px
  const top=L.padY+L.titleHeight+L.titleGap // 第一行号码的顶部位置
  lines.forEach((line,row)=>{ // 每一行
    const left=(width-line.length*(L.ball+L.gap))/2+L.gap/2 // 这一行最左边球的左边缘，让整行水平居中
    line.forEach((ball,i)=>{ // 这一行的每个球
      drawExportBall(ctx,theme,scale,ball.color,ball.number,left+i*(L.ball+L.gap)+L.ball/2,top+row*(L.ball+L.rowGap)+L.ball/2,L.ball/2) // 画球：圆心 x、圆心 y、半径
    })
  })
  return canvas // 返回画好的画布
}

  }catch(error){ // 画图出错时

    alert("图片生成失败，请重试") // 提示失败
    return // 不保存
  }
  // iPadOS 默认伪装成 Mac 的 UA，用触摸点数区分
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1) // 是否 iOS：UA 含 iPad/iPhone/iPod，或者是带多点触摸的“Mac”（iPadOS）
  if(isIOS){ // iOS 上

    return // 结束
  }
  canvas.toBlob(blob=>{ // 其他设备：把画布转成 PNG 文件
    if(!blob){ // 转换失败时
      alert("图片生成失败，请重试") // 提示失败
      return // 结束
    }
    const url=URL.createObjectURL(blob) // 为文件生成临时地址
    const a=document.createElement("a") // 新建一个链接
    a.href=url // 链接指向文件
    a.download=`lottery-${typeText}-${modeText}-${dateText}.png` // 下载时的文件名，带上彩种和选号方式
    document.body.appendChild(a) // 链接放进页面（部分浏览器要求）
    a.click() // 模拟点击，开始下载
    document.body.removeChild(a) // 移除链接
    setTimeout(()=>{ // 稍后
      URL.revokeObjectURL(url) // 释放临时地址
    },1000) // 1 秒后
  },"image/png") // 输出 PNG 格式
}
// iOS 不能直接下载到相册：弹出预览，长按图片保存
function showSavePreview(src,alt){ // 弹出保存预览：src 为图片地址，alt 为图片的文字说明
  // 关闭后把焦点还给触发保存的按钮
  const opener=document.activeElement // 当前获得焦点的元素（保存按钮）
  const overlay=document.createElement("div") // 遮罩
  overlay.className="ios-save-overlay" // 遮罩样式
  const blur=document.createElement("div") // 弹窗后面的模糊层
  blur.className="ios-save-blur" // 模糊层样式
  const stage=document.createElement("div") // 弹窗的居中区域
  stage.className="ios-save-stage" // 居中区域样式
  const modal=document.createElement("div") // 弹窗
  modal.className="ios-save-modal" // 弹窗样式
  modal.setAttribute("role","dialog") // 读屏软件当作对话框
  modal.setAttribute("aria-modal","true") // 对话框打开时，背后的内容不可操作
  modal.setAttribute("aria-label","保存图片") // 对话框的名称
  const preview=document.createElement("img") // 预览图
  preview.className="ios-save-preview" // 预览图样式
  preview.alt=alt // 图片的文字说明
  preview.src=src // 图片内容

    gl.viewport(0,0,fieldW,fieldH) // 视口为纹理尺寸
    gl.useProgram(field.prog) // 用液体程序
    gl.uniform2fv(field.u.uWarpP,ph.warp) // 五层扭曲的相位
    ph.tint.forEach((p,k)=>{tintBuf[k*4+2]=p}) // 各条纹的相位
    gl.uniform4fv(field.u.uTint,tintBuf) // 条纹参数：方向、相位、饱和度
    gl.drawArrays(gl.TRIANGLES,0,3) // 画满整个纹理
    gl.bindFramebuffer(gl.FRAMEBUFFER,null) // 改为画到屏幕
    gl.viewport(0,0,canvas.width,canvas.height) // 视口为画布尺寸
    gl.useProgram(glass.prog) // 用玻璃程序
    gl.bindTexture(gl.TEXTURE_2D,fieldTex) // 使用刚画好的液体纹理
    // 面板位置按画布自身的位置换算：iOS 主屏幕 App 里画布不一定正好从屏幕顶端开始，按屏幕坐标算玻璃会和面板错开
    const cr=canvas.getBoundingClientRect() // 画布在屏幕上的位置
    const shown=panels.filter(el=>el.getClientRects().length) // 正在显示的面板（隐藏的不画）
    gl.uniform1i(glass.u.uPanelN,shown.length) // 面板数量
    gl.uniform1fv(glass.u.uPanelR,shown.map(el=>parseFloat(getComputedStyle(el).borderTopLeftRadius)||0).concat([0,0,0]).slice(0,3)) // 各块面板的圆角半径（从 CSS 读取，不足三块补 0）
    gl.uniform4fv(glass.u.uPanel,shown.flatMap(el=>{ // 各块面板的位置
      const r=el.getBoundingClientRect() // 面板在屏幕上的位置
      return [r.left-cr.left+r.width/2,r.top-cr.top+r.height/2,r.width/2,r.height/2] // 相对画布的中心 x、中心 y，半宽、半高
    }).concat(new Array(12).fill(0)).slice(0,12)) // 不足三块补 0
    gl.drawArrays(gl.TRIANGLES,0,3) // 画满整个屏幕
  }
  // 帧率不设上限：屏幕每刷新一次就画一帧（60Hz 屏 60 帧，高刷屏跟随浏览器给的刷新率）
  function loop(now){ // WebGL 的动画循环
    raf=requestAnimationFrame(loop) // 预约下一帧
    draw(now) // 画这一帧
  }
  function start(){ // 开始动画循环
    if(!raf&&!reduceMotion.matches) raf=requestAnimationFrame(loop) // 没在循环且没开减弱动态效果时才开始
  }
  function stop(){ // 停止动画循环
    cancelAnimationFrame(raf) // 取消下一帧
    raf=0 // 清空帧编号
  }
  function destroy(){ // 销毁 WebGL：停止动画、移除监听、释放资源
    stop() // 停止动画
    listeners.abort() // 移除所有带 signal 的监听
    observers.forEach(o=>o.disconnect()) // 断开所有尺寸观察器
    canvas.remove() // 移除画布
    document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记，CSS 玻璃恢复
    const lose=gl.getExtension("WEBGL_lose_context") // 取“主动丢弃上下文”扩展
    if(lose&&!gl.isContextLost()) lose.loseContext() // 上下文还在就主动丢弃，立即释放显存
  }
  document.body.insertBefore(canvas,document.body.firstChild) // 画布放到页面最前面（在内容下层）
  resize() // 设置尺寸并画第一帧
  // 极少数设备不能渲染到纹理，此时改用 2D 兜底画法
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo) // 绑定帧缓冲
  const fboOk=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE // 检查能否渲染到纹理
  gl.bindFramebuffer(gl.FRAMEBUFFER,null) // 恢复画到屏幕
  if(!fboOk){ // 不能渲染到纹理时
    destroy() // 销毁
    return null // 返回 null，改用兜底
  }
  canvas.addEventListener("webglcontextlost",()=>{ // WebGL 上下文丢失时（例如 iOS 后台回收）
    destroy() // 销毁
    onLost() // 通知控制器改用兜底
  },on) // 监听可一次性移除
  document.documentElement.classList.add("lg-webgl") // 标记 WebGL 生效，CSS 去掉玻璃底色和模糊
  start() // 开始动画
  window.addEventListener("resize",resize,on) // 窗口尺寸变化时重新设置
  if(window.visualViewport) visualViewport.addEventListener("resize",resize,on) // 可视区域尺寸变化时（iOS 工具栏收起展开）重新设置
  if(window.ResizeObserver){ // 浏览器支持 ResizeObserver 时
    ;[document.querySelector(".container"),canvas].forEach(el=>{ // 观察内容容器（面板位置变化）和画布（画布尺寸变化）
      const o=new ResizeObserver(()=>draw(performance.now())) // 尺寸变化时重画
      o.observe(el) // 开始观察
      observers.push(o) // 记入列表，销毁时断开
    })
  }
  // 旧版 Safari 不支持用 signal 移除监听，所以回调里先确认 WebGL 仍在使用
  onMediaChange(matchMedia("(prefers-color-scheme: dark)"),()=>{ // 系统深浅模式切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    readTheme() // 重新读取颜色
    draw(performance.now()) // 重画
  },on) // 监听可一次性移除
  onMediaChange(reduceMotion,()=>{ // 系统“减弱动态效果”切换时
    if(listeners.signal.aborted) return // 已销毁就不管
    stop() // 先停止
    start() // 按新设置重新开始
    draw(performance.now()) // 立即画一帧
  },on) // 监听可一次性移除
  return {destroy} // 返回销毁接口
}
// 优先用 WebGL；不支持、上下文丢失或系统要求降低透明度时，用 2D 兜底背景和 CSS 玻璃。
// "降低透明度"可以随时切换，切换后立即生效。
// iOS Safari 常在页面切到后台后回收 WebGL 上下文，回到前台时重新创建
;(function liquidGlassController(){ // 立即执行：决定用 WebGL 还是兜底
  const reduceTransparency=matchMedia("(prefers-reduced-transparency: reduce)") // 系统“降低透明度”设置
  // WebGL 创建失败或运行中丢失时，先用兜底背景顶上，再按这些间隔自动重试；用完后等下次回到前台再试。
  // iOS 刚启动或从后台切回时偶尔建不起来，原来失败一次就再也不试，只剩没有折射的磨砂玻璃
  const RETRY_DELAYS=[500,1500,4000,10000] // 第 1～4 次重试前等待的毫秒数
  let webgl=null // 当前的 WebGL 实例
  let retries=0 // 已经安排过几次重试（WebGL 成功运行或回到前台时清零）
  let retryTimer=0 // 下一次重试的计时器
  function scheduleRetry(){ // 安排下一次重试
    clearTimeout(retryTimer) // 取消已安排的重试
    if(retries>=RETRY_DELAYS.length) return // 次数用完：等下次回到前台再试
    retryTimer=setTimeout(apply,RETRY_DELAYS[retries++]) // 依次等 0.5、1.5、4、10 秒再试
  }
  function onLost(){ // WebGL 运行中丢失时（例如 iOS 回收显存）
    webgl=null // 清掉 WebGL 实例
    liquidBackdrop.start() // 先用兜底背景顶上
    scheduleRetry() // 稍后重建
  }
  function create(){ // 创建 WebGL，出错时清理干净
    try{ // 尝试
      return createLiquidGlass(onLost) // 创建，丢失时调用 onLost
    }catch(error){ // 初始化出错时
      console.warn("液体玻璃初始化失败:",error) // 在控制台记录
      document.querySelectorAll(".lg-canvas").forEach(c=>c.remove()) // 移除可能残留的画布
      document.documentElement.classList.remove("lg-webgl") // 去掉 WebGL 生效的标记
      return null // 返回 null
    }
  }
  function apply(){ // 根据当前设置选择 WebGL 或兜底
    clearTimeout(retryTimer) // 这次就是在处理，取消已安排的重试
    if(reduceTransparency.matches){ // 开启了降低透明度
      if(webgl) webgl.destroy() // 有 WebGL 就销毁
      webgl=null // 清掉 WebGL 实例
      liquidBackdrop.start() // 改用兜底（实底玻璃）
      return // 结束
    }
    if(webgl) return // WebGL 已在运行就不处理
    webgl=create() // 尝试创建 WebGL
    if(webgl){ // 创建成功
      retries=0 // 重试次数清零
      liquidBackdrop.stop() // 停止兜底背景
    }else{ // 创建失败
      liquidBackdrop.start() // 先用兜底背景
      scheduleRetry() // 稍后再试
    }
  }
  apply() // 页面加载时先选一次
  onMediaChange(reduceTransparency,apply) // 降低透明度切换时重新选
  document.addEventListener("visibilitychange",()=>{ // 页面可见性变化时
    if(document.visibilityState!=="visible") return // 切到后台时不处理
    retries=0 // 回到前台：重试次数重新算
    apply() // 重新选（WebGL 被回收后会重建）
  })
  addEventListener("pageshow",event=>{ // 页面显示时（含从后退缓存恢复）
    if(!event.persisted) return // 只处理从缓存恢复的情况，首次加载已经处理过
    retries=0 // 重试次数重新算
    apply() // 重新选
  })
})() // 立即执行函数结束
// 离线缓存：添加到主屏幕后，没有网络也能打开。只在网址为 http(s) 时注册，直接打开本地文件时跳过
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){ // 浏览器支持且通过网址打开时
  navigator.serviceWorker.register("sw.js").catch(error=>console.warn("离线缓存注册失败:",error)) // 注册离线缓存，失败不影响使用
}
