# 每晚自动更新开奖历史（网页“深度思考”用）：抓取最新开奖并校验，有新数据就提交到 main，再请 GitHub Pages 重新发布
name: 更新开奖历史  # 工作流名称
on:  # 触发条件
  # 按开奖时间运行：双色球周二、四、日 21:15 开奖，大乐透周一、三、六 21:25 开奖，500.com 一般十几分钟后更新。
  # 只在开奖日（周五以外）运行；GitHub 的定时任务常会延迟甚至跳过，所以开奖后连跑几次，第二天早上再补一次。
  # 没有新开奖时什么也不做，多跑几次没有影响。cron 用 UTC 时间：北京时间减 8 小时，这几个时间点 UTC 和北京是同一天
  schedule:  # 定时（UTC 时间；星期 0=周日，0-4,6 = 周日到周四、周六）
    - cron: "47 13 * * 0-4,6"  # 开奖日北京时间 21:47（开奖后约 20～30 分钟）
    - cron: "17 14 * * 0-4,6"  # 开奖日北京时间 22:17
    - cron: "47 14 * * 0-4,6"  # 开奖日北京时间 22:47
    - cron: "47 15 * * 0-4,6"  # 开奖日北京时间 23:47
    - cron: "47 23 * * 0-4,6"  # 开奖次日北京时间 07:47（UTC 仍是开奖日 23:47）：头天晚上都没跑成时再补一次
  workflow_dispatch:  # 也可以在 Actions 页面手动运行
permissions:  # 权限
  contents: write  # 提交更新后的数据
  pages: write  # 请 GitHub Pages 重新发布
concurrency:  # 同一时间只跑一个
  group: update-history  # 分组名
  cancel-in-progress: false  # 不取消正在跑的
jobs:  # 任务
  update:  # 更新任务
    # 只在 Lottery-generator 里运行：Lottery-source-code 是它的完整镜像（同一份提交记录），
    # 两边都跑会各自提交一次新数据，提交记录分叉后就没法直接同步；镜像仓库的数据靠同步过去（比较时不区分大小写）
    if: github.repository == 'CLAY-PSY/Lottery-generator'
    runs-on: ubuntu-latest  # 运行环境
    timeout-minutes: 10  # 最多跑 10 分钟
    steps:  # 步骤
      - uses: actions/checkout@v4  # 取出仓库代码
      - name: 抓取并校验开奖历史  # 运行更新脚本（只用 Python 标准库，系统自带 Python 3）
        run: python3 scripts/update_history.py  # 校验不通过会报错退出，不会写入坏数据
      - name: 有新数据就提交  # 提交并推送
        id: commit  # 供下一步判断
        run: |  # 多行脚本
          if git diff --quiet -- data; then echo "没有新开奖"; exit 0; fi  # 数据没变就结束
          git config user.name "github-actions[bot]"  # 提交者名字
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"  # 提交者邮箱
          git add data  # 加入数据文件
          git commit -m "更新开奖历史 $(TZ=Asia/Shanghai date +%F)"  # 提交说明带上日期
          git push  # 推送到 main
          echo "pushed=true" >> "$GITHUB_OUTPUT"  # 记下已推送
      - name: 请 GitHub Pages 重新发布  # 用 GITHUB_TOKEN 推送的提交不一定会触发 Pages 发布，这里主动请求一次
        if: steps.commit.outputs.pushed == 'true'  # 只有推送了新数据才需要
        env:  # 环境变量
          GH_TOKEN: ${{ github.token }}  # 调用 GitHub API 用的令牌
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "没能请求重新发布（Pages 可能不是“从分支发布”），下次推送时会一起发布"  # 失败不影响数据更新
