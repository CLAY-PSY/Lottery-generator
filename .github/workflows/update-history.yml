# 全天 24 小时每 5 分钟自动更新开奖历史（网页“深度思考”用）：抓取最新开奖并校验，有新数据就提交到 main，再启动“发布网页”工作流（static.yml）
name: 更新开奖历史  # 工作流名称
on:  # 触发条件
  # 全天不间断：每小时的第 2、7、12……57 分钟各运行一次（北京时间），一天 288 次；5 分钟是 GitHub 定时允许的最短间隔。
  # 双色球 21:15、大乐透 21:25 开奖，500.com 一般十几分钟后更新；不管它什么时候更新、GitHub 的定时任务延迟多久，下一轮都会补上。
  # 没有新开奖时只是检查一遍，不提交、不发布；避开整点（GitHub 整点最忙，定时任务容易延迟）
  schedule:  # 定时
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"  # 每 5 分钟
      timezone: "Asia/Shanghai"  # 按北京时间（中国没有夏令时，全年一致）；不写时默认是 UTC
  workflow_dispatch:  # 也可以在 Actions 页面手动运行
permissions:  # 权限
  contents: write  # 提交更新后的数据
  actions: write  # 启动“发布网页”工作流（static.yml）
concurrency:  # 同一时间只跑一个
  group: update-history  # 分组名
  cancel-in-progress: false  # 不取消正在跑的
jobs:  # 任务
  update:  # 更新任务
    # 只在 Lottery-generator 里运行：Lottery-source-code 是它的完整镜像（同一份提交记录），
    # 两边都跑会各自提交一次新数据，提交记录分叉后就没法直接同步；镜像仓库的数据靠同步过去（比较时不区分大小写）
    if: github.repository == 'CLAY-PSY/Lottery-generator'
    runs-on: ubuntu-latest  # 运行环境
    timeout-minutes: 10  # 最多跑 10 分钟
    steps:  # 步骤
      - uses: actions/checkout@v4  # 取出仓库代码
      - name: 抓取并校验开奖历史  # 运行更新脚本（只用 Python 标准库，系统自带 Python 3）
        # 校验不通过会报错退出，不会写入坏数据；暂时连不上 500.com（退出码 75）只给出提醒、这一轮跳过，
        # 免得一天跑 288 次时短暂断网就连发失败通知；数据超过 4 天没更新时脚本会直接报失败
        run: |  # 多行脚本
          code=0; python3 scripts/update_history.py || code=$?  # 运行并记下退出码
          if [ "$code" = 75 ]; then echo "::warning::暂时连不上 500.com，这一轮跳过，5 分钟后再试"; exit 0; fi  # 暂时的问题
          exit "$code"  # 0 成功；其他非零是真的失败
      - name: 有新数据就提交  # 提交并推送
        id: commit  # 供下一步判断
        run: |  # 多行脚本
          if git diff --quiet -- web/data; then echo "没有新开奖"; exit 0; fi  # 数据没变就结束
          git config user.name "github-actions[bot]"  # 提交者名字
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"  # 提交者邮箱
          git add web/data  # 加入数据文件
          git commit -m "更新开奖历史 $(TZ=Asia/Shanghai date +%F)"  # 提交说明带上日期
          git pull --rebase origin main  # 先接上 main 最新的提交（期间可能刚合并了 PR），免得推送被拒；数据提交只改 web/data，不会冲突
          git push origin HEAD:main  # 推送到 main
          echo "pushed=true" >> "$GITHUB_OUTPUT"  # 记下已推送
      - name: 发布网页  # 网页由 static.yml 用 Actions 发布；机器人（GITHUB_TOKEN）推送的提交不会触发其他工作流，这里手动启动它（GitHub 允许这样启动）
        if: steps.commit.outputs.pushed == 'true'  # 只有推送了新数据才需要
        env:  # 环境变量
          GH_TOKEN: ${{ github.token }}  # 调用 GitHub API 用的令牌（需要 actions: write）
        run: gh workflow run static.yml --ref main --repo "${{ github.repository }}"  # 启动失败时这次运行会显示失败，方便发现（数据已经提交，不受影响）
