# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # 只在 Lottery-generator 里发布：Lottery-source-code 是它的镜像，同步过去后不应尝试发布网页（比较时不区分大小写）
    if: github.repository == 'CLAY-PSY/Lottery-generator'
    environment:
      name: github-pages
      # 网址取成功的那一次发布（第一次失败时取重试的）
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布 web 文件夹（网页、样式、脚本、图标、图片、开奖数据、离线缓存），它就是网站的最外层，网址和原来一样
          path: './web'
      # 发布失败自动重试：GitHub 偶尔刚上传完就找不到这个包（报“No artifacts named github-pages were found”），
      # 稍等一会儿再发布就好。第一次失败等 30 秒再试，再失败等 60 秒试最后一次；三次都失败这次运行才算失败
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true # 失败了不停下，交给下面的重试
        uses: actions/deploy-pages@v5
      - name: Wait before retry (1)
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::第一次发布失败，30 秒后重试"
          sleep 30
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true # 失败了不停下，再试最后一次
        uses: actions/deploy-pages@v5
      - name: Wait before retry (2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: |
          echo "::warning::第二次发布也失败，60 秒后最后重试一次"
          sleep 60
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5 # 最后一次：这次再失败，整个运行标记为失败
