<!DOCTYPE html> <!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN"> <!-- 根元素，页面语言为简体中文 -->
<head> <!-- 文档头：放元信息和样式 -->
<meta charset="UTF-8"> <!-- 字符编码使用 UTF-8 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"> <!-- 视口：宽度等于设备宽度，禁止缩放，内容延伸到刘海和圆角区域 -->
<meta name="theme-color" content="#f7f3ff" media="(prefers-color-scheme: light)"> <!-- 浅色模式下浏览器状态栏的颜色 -->
<meta name="theme-color" content="#07081a" media="(prefers-color-scheme: dark)"> <!-- 深色模式下浏览器状态栏的颜色 -->
<!-- 添加到主屏幕：以独立 App 的样子全屏打开，有自己的图标和名字 -->
<meta name="apple-mobile-web-app-capable" content="yes"> <!-- 从 iPhone 主屏幕打开时全屏显示，不显示 Safari 的地址栏和工具栏（iOS 16.3 及更早靠这一项） -->
<meta name="mobile-web-app-capable" content="yes"> <!-- 同上，标准写法（安卓 Chrome 等） -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- 状态栏透明，液体背景一直延伸到状态栏下面 -->
<meta name="apple-mobile-web-app-title" content="幸运选号"> <!-- 主屏幕图标下面显示的名字 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2"> <!-- iPhone、iPad 主屏幕图标（180×180）；?v=2 让浏览器换掉缓存里的旧图标 -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2"> <!-- 浏览器标签页图标 -->
<link rel="preload" as="image" href="images/splash.jpg" fetchpriority="high"> <!-- 开屏图片优先下载 -->
<link rel="manifest" href="manifest.webmanifest"> <!-- 网页应用清单：名字、图标、全屏显示（iOS 16.4 起和安卓都读它） -->
<script src="js/ios-app.js"></script> <!-- 主屏幕 App 底部白边修正（放在页面最前面，第一帧就生效） -->
<title>双色球 / 大乐透 随机选号</title> <!-- 页面标题 -->
<link rel="stylesheet" href="css/base.css"> <!-- 基础：颜色和尺寸变量（浅色、深色、降低透明度）、页面整体排版、禁止缩放和选中 -->
<link rel="stylesheet" href="css/layout.css"> <!-- 页面布局：背景画布、内容容器、主屏幕 App 的修正、状态栏、标题 -->
<link rel="stylesheet" href="css/glass.css"> <!-- 液态玻璃材质：半透明、背景模糊、高光描边、触摸发光 -->
<link rel="stylesheet" href="css/controls.css"> <!-- 表单卡片和分段控件（彩种、选号方式）：滑块、液态拉伸动画、按住和禁用状态 -->
<link rel="stylesheet" href="css/process.css"> <!-- 过程窗口（深度思考、随机选号共用）和中间的一注卡片：标题行、逐字写出的过程、空球、弹出动画 -->
<link rel="stylesheet" href="css/buttons.css"> <!-- 按钮：生成号码、保存图片 -->
<link rel="stylesheet" href="css/balls.css"> <!-- 结果卡片和号码球；小屏幕时缩小 -->
<link rel="stylesheet" href="css/landscape.css"> <!-- 横屏：标题在上，选择和结果左右并排 -->
<link rel="stylesheet" href="css/save-dialog.css"> <!-- 保存图片的预览弹窗（iPhone、iPad 长按保存到相册） -->
<link rel="stylesheet" href="css/splash.css"> <!-- 开屏页：开屏图片和加载进度条 -->
</head> <!-- 文档头结束 -->
<body> <!-- 页面主体开始 -->
<div class="splash" id="splash" aria-hidden="true"> <!-- 开屏页（读屏软件忽略） -->
  <div class="splash-view"> <!-- 画面居中的区域 -->
    <div class="splash-art"> <!-- 按图片比例缩放的画面 -->
      <img class="splash-img" src="images/splash.jpg" alt="" decoding="async"> <!-- 开屏图片 -->
      <div class="splash-track"><div class="splash-fill"></div></div> <!-- 进度条：轨道和走动的部分 -->
    </div>
  </div>
</div>
<script src="js/splash.js"></script> <!-- 开屏页：加载好后进度条走满再淡出 -->
<div class="backdrop" aria-hidden="true"></div> <!-- 2D 兜底背景的容器（读屏软件忽略） -->
<div class="container"> <!-- 页面内容容器 -->
  <h1>双色球 / 大乐透 随机选号</h1> <!-- 页面标题 -->
  <div class="form-box glass"> <!-- 表单卡片（玻璃） -->
    <div class="segmented" role="radiogroup" aria-label="彩种"> <!-- 分段控件，读屏软件当作一组单选按钮 -->
      <input type="radio" name="type" id="type-ssq" value="ssq" checked> <!-- “双色球”单选框，默认选中 -->
      <input type="radio" name="type" id="type-dlt" value="dlt"> <!-- “大乐透”单选框 -->
      <span class="segmented-thumb" aria-hidden="true"></span> <!-- 滑块（纯装饰，读屏软件忽略） -->
      <label for="type-ssq">双色球</label> <!-- “双色球”选项文字，点击选中对应单选框 -->
      <label for="type-dlt">大乐透</label> <!-- “大乐透”选项文字，点击选中对应单选框 -->
    </div> <!-- 分段控件结束 -->
    <div class="segmented mode-switch" role="radiogroup" aria-label="选号方式"> <!-- 选号方式：随机选号 / 深度思考 -->
      <input type="radio" name="mode" id="mode-random" value="random" checked> <!-- “随机选号”单选框，默认选中 -->
      <input type="radio" name="mode" id="mode-deep" value="deep"> <!-- “深度思考”单选框 -->
      <span class="segmented-thumb" aria-hidden="true"></span> <!-- 滑块（纯装饰，读屏软件忽略） -->
      <label for="mode-random">随机选号</label> <!-- “随机选号”：纯随机，与原来相同 -->
      <label for="mode-deep">深度思考</label> <!-- “深度思考”：参考历史开奖统计选号 -->
    </div> <!-- 选号方式结束 -->
    <div class="button-group"> <!-- 按钮组 -->
      <button type="button" id="generate-btn" class="prominent">生成号码</button> <!-- “生成号码”按钮 -->
      <button type="button" id="save-btn" class="prominent">保存图片</button> <!-- “保存图片”按钮 -->
    </div> <!-- 按钮组结束 -->
  </div> <!-- 表单卡片结束 -->
  <div class="pick-box glass" id="pick-box"> <!-- 一注卡片（玻璃）：只放选出的一注；下面的卡片显示选号过程 -->
    <div class="pick-line" id="pick-line" aria-live="polite" aria-label="选出的一注"></div> <!-- 一注号码：还没选时是空球 -->
  </div> <!-- 一注卡片结束 -->
  <div class="result-box glass"> <!-- 结果卡片（玻璃） -->
    <div class="result-inner" id="result-inner" aria-live="polite" aria-label="选号过程"></div> <!-- 选号过程：随机选号写出每个球怎么抽出来，深度思考写出思考过程 -->
  </div> <!-- 结果卡片结束 -->
</div> <!-- 页面内容容器结束 -->
<script src="js/gestures.js" defer></script> <!-- 禁止页面缩放（手机、平板、电脑一套规则）：双击、两指捏合、触控板捏合、Ctrl＋滚轮；过程窗口随时能滑；生成号码时页面其他地方不能拖 -->
<script src="js/common.js" defer></script> <!-- 公共部分：页面元素、彩种和选号方式、分段控件动画、触摸发光、加密随机数、号码球、按钮状态 -->
<script src="js/pick-card.js" defer></script> <!-- 两种彩票的规则；中间的一注卡片：空球（依次呼吸）和填上号码 -->
<script src="js/random-pick.js" defer></script> <!-- 随机选号：和深度思考一样分步写出过程（思路、准备号码池、生成随机数、抽红球、抽蓝球、自我检查），过程中不显示抽中的号码，抽完后一注一起填上 -->
<script src="js/deep-think.js" defer></script> <!-- 深度思考：研究全部走势图和开奖日期，十二位专家打分、回测、加权，精确计算一注，思考过程逐段写出 -->
<script src="js/save-image.js" defer></script> <!-- 保存图片：把中间的一注画成图片；iPhone、iPad 弹出预览长按保存，其他设备直接下载 -->
<script src="js/liquid-glass.js" defer></script> <!-- 液态背景和玻璃：WebGL 画液体和玻璃面板，不支持时用 2D 兜底；跟随深浅模式和减弱动态效果 -->
<script src="js/main.js" defer></script> <!-- 启动：绑定两个按钮，一注卡片先放空球，注册离线缓存 -->
</body> <!-- 页面主体结束 -->
</html> <!-- 根元素结束 -->
